<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 2560px; height: 1440px; overflow: hidden; background: #0D1B2A; font-family: 'Arial Black', 'Impact', sans-serif; }
</style>
</head>
<body>
<svg width="2560" height="1440" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Red gradient stripe -->
    <linearGradient id="redStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C00000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF2200;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle overlay gradient for depth -->
    <linearGradient id="bgOverlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1B2A;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#0D1B2A;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0D1B2A;stop-opacity:0.85" />
    </linearGradient>
    <!-- Pipe silhouette pattern -->
    <pattern id="pipePat" x="0" y="0" width="320" height="320" patternUnits="userSpaceOnUse">
      <!-- Horizontal main pipe -->
      <rect x="0" y="120" width="320" height="28" fill="#1a2d42" rx="14"/>
      <!-- Vertical drop pipe -->
      <rect x="140" y="0" width="18" height="320" fill="#152436" rx="9"/>
      <!-- Sprinkler head -->
      <circle cx="149" cy="155" r="22" fill="#1e3350"/>
      <rect x="135" y="148" width="28" height="8" fill="#243d58" rx="4"/>
      <circle cx="149" cy="148" r="8" fill="#2a4a6a"/>
      <!-- Cross pipe accent -->
      <rect x="60" y="120" width="18" height="80" fill="#1a2d42" rx="9"/>
      <rect x="240" y="120" width="18" height="80" fill="#1a2d42" rx="9"/>
      <!-- Small sprinkler heads on branches -->
      <circle cx="69" cy="175" r="12" fill="#1e3350"/>
      <circle cx="249" cy="175" r="12" fill="#1e3350"/>
    </pattern>
    <!-- Glow filter for text -->
    <filter id="textGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Red glow for icon -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#FF2200" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BASE BACKGROUND -->
  <rect width="2560" height="1440" fill="#0D1B2A"/>

  <!-- PIPE PATTERN BACKGROUND - right side -->
  <rect x="680" y="0" width="1880" height="1440" fill="url(#pipePat)" opacity="0.55"/>

  <!-- LEFT RED GRADIENT STRIPE -->
  <rect x="0" y="0" width="768" height="1440" fill="url(#redStripe)"/>

  <!-- RED STRIPE EDGE FADE - blends into dark bg -->
  <linearGradient id="stripeFade" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="768" y2="0">
    <stop offset="70%" style="stop-color:#0D1B2A;stop-opacity:0"/>
    <stop offset="100%" style="stop-color:#0D1B2A;stop-opacity:1"/>
  </linearGradient>
  <rect x="0" y="0" width="768" height="1440" fill="url(#stripeFade)"/>

  <!-- DARK OVERLAY over pipes for contrast -->
  <rect x="680" y="0" width="1880" height="1440" fill="url(#bgOverlay)"/>

  <!-- DIAGONAL ACCENT LINE -->
  <line x1="740" y1="0" x2="820" y2="1440" stroke="#FF2200" stroke-width="3" opacity="0.6"/>
  <line x1="760" y1="0" x2="840" y2="1440" stroke="#C00000" stroke-width="1.5" opacity="0.3"/>

  <!-- FIRE PROTECTION SHIELD ICON (center-left of text area) -->
  <g transform="translate(900, 380)" filter="url(#redGlow)">
    <!-- Shield shape -->
    <path d="M120,0 L240,50 L240,160 Q240,280 120,340 Q0,280 0,160 L0,50 Z" 
          fill="none" stroke="#FF2200" stroke-width="6" opacity="0.9"/>
    <path d="M120,20 L220,62 L220,160 Q220,264 120,316 Q20,264 20,160 L20,62 Z" 
          fill="#C00000" opacity="0.15"/>
    <!-- Flame inside shield -->
    <g transform="translate(60, 60)">
      <!-- Outer flame -->
      <path d="M60,200 Q20,160 30,110 Q40,70 20,40 Q50,60 55,90 Q65,50 80,0 Q100,60 95,100 Q110,70 105,40 Q130,80 120,120 Q130,155 100,200 Z" 
            fill="url(#redStripe)" opacity="0.9"/>
      <!-- Inner flame highlight -->
      <path d="M60,190 Q35,155 45,115 Q52,85 42,62 Q62,75 65,100 Q72,72 82,30 Q96,75 91,105 Q100,82 98,62 Q116,92 108,122 Q115,150 92,190 Z" 
            fill="#FF6633" opacity="0.7"/>
    </g>
  </g>

  <!-- COMPANY NAME - Main Title -->
  <text x="1000" y="720" 
        font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
        font-size="148" 
        font-weight="900"
        fill="white"
        letter-spacing="8"
        filter="url(#textGlow)">A-PRO MÜHENDİSLİK</text>

  <!-- RED UNDERLINE ACCENT -->
  <rect x="1000" y="748" width="1300" height="8" fill="url(#redStripe)" rx="4"/>
  <rect x="1000" y="760" width="800" height="3" fill="#FF2200" opacity="0.4" rx="2"/>

  <!-- SUBTITLE -->
  <text x="1004" y="840"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="68"
        font-weight="400"
        fill="rgba(255,255,255,0.85)"
        letter-spacing="4">Yangın Söndürme &amp; Algılama Sistemleri</text>

  <!-- TAGLINE / DESCRIPTOR -->
  <text x="1006" y="920"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="42"
        font-weight="300"
        fill="rgba(255,255,255,0.45)"
        letter-spacing="6">ENDÜSTRİYEL YANGIN KORUMA SİSTEMLERİ</text>

  <!-- LEFT STRIPE CONTENT - white icon area -->
  <g transform="translate(160, 580)">
    <!-- Large flame/fire symbol -->
    <path d="M220,520 Q80,420 120,280 Q160,160 80,40 Q200,120 220,240 Q260,140 320,0 Q400,160 380,300 Q440,200 420,120 Q520,240 480,380 Q520,460 420,520 Z" 
          fill="white" opacity="0.12"/>
    <path d="M220,490 Q110,400 145,275 Q175,165 110,65 Q210,135 228,248 Q264,153 318,20 Q388,168 370,298 Q424,208 406,135 Q494,246 456,374 Q492,448 400,490 Z" 
          fill="white" opacity="0.18"/>
  </g>

  <!-- VERTICAL TEXT ON STRIPE - subtle -->
  <text x="80" y="900" 
        font-family="'Arial', sans-serif" 
        font-size="32" 
        fill="rgba(255,255,255,0.25)"
        letter-spacing="12"
        transform="rotate(-90, 80, 900)">FIRE PROTECTION ENGINEERING</text>

  <!-- HORIZONTAL DIVIDER LINE bottom -->
  <rect x="0" y="1340" width="2560" height="2" fill="rgba(255,255,255,0.08)"/>

  <!-- BOTTOM BAR -->
  <rect x="0" y="1342" width="2560" height="98" fill="rgba(0,0,0,0.35)"/>

  <!-- WEBSITE URL - bottom right -->
  <text x="2440" y="1406"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="44"
        font-weight="400"
        fill="rgba(255,255,255,0.65)"
        text-anchor="end"
        letter-spacing="2">www.apro.com.tr</text>

  <!-- BOTTOM LEFT - certification/tagline -->
  <text x="120" y="1406"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="38"
        font-weight="300"
        fill="rgba(255,255,255,0.4)"
        letter-spacing="4">ISO 9001 · TSE · NFPA Sertifikalı</text>

  <!-- BOTTOM CENTER - decorative dots -->
  <circle cx="1280" cy="1391" r="4" fill="#FF2200" opacity="0.7"/>
  <circle cx="1260" cy="1391" r="3" fill="#FF2200" opacity="0.4"/>
  <circle cx="1300" cy="1391" r="3" fill="#FF2200" opacity="0.4"/>

  <!-- TOP RIGHT CORNER ACCENT -->
  <rect x="2460" y="0" width="100" height="6" fill="url(#redStripe)"/>
  <rect x="2554" y="0" width="6" height="100" fill="url(#redStripe)"/>

</svg>
</body>
</html>
