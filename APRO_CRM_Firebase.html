// Tek seferlik backfill: eski (salesRep boş) tekliflere, bağlı fırsatın sahibini (assignedTo) yaz.
// quotationId -> {salesRep, preparedBy} eşlemesi CRM'de (fırsat/teklif talebi) mevcut; sunucu yalnızca
// değeri null olanları doldurur, dolu olanı EZMEZ. Önce dryRun ile kaç kayıt etkilenecek gösterir.
async function backfillTeklifSalesReps() {
  const map = {};
  for (const o of (state.opportunities || [])) {
    if (!o.quotationId) continue;
    const e = map[o.quotationId] = map[o.quotationId] || {};
    if (!e.salesRep && o.assignedTo) e.salesRep = o.assignedTo;
  }
  for (const p of (state.proposals || [])) {
    if (!p.quotationId) continue;
    const e = map[p.quotationId] = map[p.quotationId] || {};
    if (!e.salesRep) {
      const opp = (state.opportunities || []).find(o => o.id === p.opportunityId);
      if (opp && opp.assignedTo) e.salesRep = opp.assignedTo;
    }
    if (!e.preparedBy && p.preparedBy) e.preparedBy = p.preparedBy;
  }
  const items = Object.entries(map)
    .map(([quotationId, v]) => ({ quotationId, salesRep: v.salesRep || '', preparedBy: v.preparedBy || '' }))
    .filter(i => i.salesRep || i.preparedBy);
  if (!items.length) { alert('Eşlenecek teklif bulunamadı (fırsat/teklif taleplerinde quotationId + sahip yok).'); return; }

  async function call(dryRun) {
    const res = await fetch(TEKLIF_BACKFILL_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-crm-key': TEKLIF_API_KEY },
      body: JSON.stringify({ dryRun, items }),
    });
    const b = await res.json().catch(() => null);
    if (!res.ok) throw new Error(b?.error?.message || ('HTTP ' + res.status));
    return b.data;
  }
  try {
    const dry = await call(true);
    if (!dry.wouldUpdate) { alert('Güncellenecek boş teklif yok. (Eşlenen: ' + dry.matched + ', hepsi zaten dolu.)'); return; }
    const lines = (dry.planned || []).slice(0, 20)
      .map(p => '• ' + (p.projectName || p.id) + '  →  ' + (p.salesRep || '(temsilci yok)')).join('\n');
    if (!confirm(dry.wouldUpdate + ' teklifin satış temsilcisi doldurulacak:\n\n' + lines + '\n\nDevam edilsin mi?')) return;
    const done = await call(false);
    alert('✅ Tamamlandı. ' + done.updated + ' teklif güncellendi.');
  } catch (e) {
    alert('Backfill hatası: ' + (e && e.message ? e.message : e));
  }
}
window.backfillTeklifSalesReps = backfillTeklifSalesReps;

  const targets = (state.opportunities || []).filter(o =>
    o.stage === 'KAZANILDI' && o.quotationId && o.quotationStatus !== 'APPROVED');
  if (!targets.length) { alert('Onaylanacak kazanılmış teklif yok. (KAZANILDI + bağlı teklif + henüz onaysız bulunamadı.)'); return; }
  const lines = targets.slice(0, 20).map(o => '• ' + (o.title || o.quotationId) + '  →  ' + (o.assignedTo || '(temsilci yok)')).join('\n');
  if (!confirm(targets.length + ' kazanılmış teklif APPROVED yapılacak (karlılığa dahil):\n\n' + lines + '\n\nDevam edilsin mi?')) return;
  let ok = 0, fail = 0;
  for (const o of targets) {
    try {
      const prop = (state.proposals || []).find(p => p.quotationId === o.quotationId);
      const res = await fetch(TEKLIF_APPROVE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-crm-key': TEKLIF_API_KEY },
        body: JSON.stringify({ quotationId: o.quotationId, salesRep: o.assignedTo || '', preparedBy: (prop && prop.preparedBy) || '' }),
      });
      const b = await res.json().catch(() => null);
      if (res.ok && b && b.success) {
        const upd = {...o, quotationStatus: 'APPROVED', ...stamp()};
        await saveDoc('opportunities', o.id, upd);
        setState({opportunities: (state.opportunities || []).map(x => x.id === o.id ? upd : x)});
        ok++;
      } else { fail++; }
    } catch (e) { fail++; }
  }
  alert('✅ Tamamlandı. Onaylanan: ' + ok + (fail ? ', başarısız: ' + fail : ''));
}
window.approveWonQuotationsBulk = approveWonQuotationsBulk;

// CRM kullanıcısı için teklif programında oturum açar, session token döndürür.
async function getCrmSessionToken() {
  // state.currentUser her zaman güvenilir; firebase.auth().currentUser
  // zaman zaman auth restore gecikmesi nedeniyle null olabilir.
  const _attempt = async () => {
    const cu = state.currentUser || firebase.auth().currentUser;
    if (!cu?.email) return null;
    const res = await fetch(TEKLIF_AUTH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-crm-key': TEKLIF_API_KEY },
      body: JSON.stringify({
        email:  cu.email,
        name:   cu.displayName || cu.email,
        crmUid: cu.uid,
      }),
    }).catch(() => null);
    if (!res?.ok) return null;
    const body = await res.json().catch(() => null);
    return body?.data?.token ?? null;
  };
  try {
    const t = await _attempt();
    if (t) return t;
    // İlk denemede başarısız → 600ms bekle, tekrar dene
    await new Promise(r => setTimeout(r, 600));
    return await _attempt();
  } catch { return null; }
}

// Teklif referansına revizyon eki: revizyon ≥2 ise "...-R2" eklenir (zaten ekliyse tekrarlamaz).
function tpRefWithRev(d) {
  const base = (d && (d.number ?? d.reference)) ?? null;
  if (!base) return base;
  const rev = Number(d && d.revisionNumber);
  if (Number.isFinite(rev) && rev >= 2 && !/-R\d+$/.test(base)) return base + '-R' + rev;
  return base;
}
// Fırsat değeri daima EUR: API grandTotalEur (EUR'ya çevrilmiş) döndürür; yoksa ham toplama düşer.
function tpValueEur(d) {
  const v = d && (d.grandTotalEur ?? d.grandTotal);
  return v ? parseFloat(v) : null;
}

// Teklif programında silinmiş bir teklifin CRM bağlantısını temizler.
// Yalnız teklif bağlantı alanları (quotationId/quotationUrl/quotationStatus) sıfırlanır →
// Fırsatlar bölümündeki buton "📋 Teklif Oluştur"a döner. Fırsat/teklif talebi kaydı SİLİNMEZ.
// Not: _editedBy'ye dokunulmaz (sistem işlemi — düzenleyen alanı korunur).
async function clearDeletedQuotationLink(qid) {
  if (!qid) return false;
  // quotationId KORUNUR, yalnızca "silinmiş" olarak işaretlenir. Teklif programındaki silme
  // geri alınabilir (soft delete) — bağlantıyı yok edersek teklif geri geldiğinde CRM onu
  // bir daha bulamıyor ve buton kalıcı olarak "Teklif Oluştur"da kalıyordu. İşaret sayesinde
  // buton yine "Teklif Oluştur"a döner, ama teklif geri alınırsa senkronda bağlantı kendiliğinden onarılır.
  const clr = obj => ({ ...obj, quotationDeleted: true, quotationStatus: '' });
  const oppTargets  = (state.opportunities || []).filter(o => o.quotationId === qid);
  const propTargets = (state.proposals || []).filter(p => p.quotationId === qid);
  if (oppTargets.length === 0 && propTargets.length === 0) return false;
  let opps = [...state.opportunities], props = [...state.proposals];
  for (const o of oppTargets)  { const u = clr(o); await saveDoc('opportunities', o.id, u); opps  = opps.map(x => x.id === o.id ? u : x); }
  for (const p of propTargets) { const u = clr(p); await saveDoc('proposals',    p.id, u); props = props.map(x => x.id === p.id ? u : x); }
  setState({ opportunities: opps, proposals: props });
  return true;
}

// Mevcut teklifi SSO ile aç. Teklif silinmişse CRM'den otomatik temizler.
async function openQuotationWithSSO(quotationId) {
  // Personel listelerini her açılışta sync et (fire-and-forget) — yalnızca mevcut CRM kullanıcıları
  fetch(TEKLIF_STAFF_SYNC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-crm-key': TEKLIF_API_KEY },
    body: JSON.stringify({
      salesReps: usersWithTargets().map(u=>u.displayName),
      preparedByNames: state.users.map(u=>u.displayName).sort((a,b)=>a.localeCompare(b,'tr')),
    }),
  }).catch(() => {});

  // 1. Teklif hala var mı kontrol et
  try {
    const chk = await fetch(
      `${TEKLIF_APP_URL}/api/v1/crm/quotation-status?id=${encodeURIComponent(quotationId)}`,
      { headers: { 'x-crm-key': TEKLIF_API_KEY } }
    ).catch(() => null);
    if (chk?.ok) {
      const chkBody = await chk.json().catch(() => null);
      if (chkBody?.data?.exists === false) {
        // HTTP 200 + exists:false = teklif KESİN silinmiş (geçici erişim sorunu değil —
        // o durumda yanıt !res.ok olur ve bu bloğa hiç girilmez). CRM bağlantısını otomatik
        // temizle → buton "📋 Teklif Oluştur"a döner. Fırsat/teklif talebi kaydı korunur.
        await clearDeletedQuotationLink(quotationId);
        showToast('🧹 Bu teklif teklif programında silinmiş — CRM bağlantısı otomatik temizlendi. Yeniden teklif oluşturabilirsiniz.');
        return;
      } else if (chkBody?.data?.exists === true) {
        // Teklif mevcut → durum + toplam + referans + satış temsilcisi → Fırsatlar güncellenir
        // (Teklif Talepleri bu akıştan etkilenmez — bağlantısız bölüm)
        const tpStatus    = chkBody.data.status    ?? null;
        // Değer daima EUR (teklif $/₺ olsa bile API EUR'ya çevirip gönderir).
        const tpTotal     = tpValueEur(chkBody.data);
        // REF.: hazırlandı/gönderildi'de atanan teklif numarası (örn. A-Pro-T-26-0036).
        // Revizyon ≥2 ise "-R2" eklenir. Numara yoksa (taslak) manuel referansa düşer.
        const tpReference = tpRefWithRev(chkBody.data);
        const tpSalesRep  = chkBody.data.salesRep  ?? null;
        const tpLastEditor = chkBody.data.lastEditor ?? null;
        const relatedOpps = state.opportunities.filter(o => o.quotationId === quotationId);
        const _scrollSave = [...document.querySelectorAll('.apro-no-sb')].map(el => el.scrollLeft);
        let updatedOpps = [...state.opportunities];
        for (const o of relatedOpps) {
          const upd = { ...o,
            ...(tpStatus   !== null && { quotationStatus: tpStatus }),
            ...(tpTotal    !== null && tpTotal > 0 && { value: tpTotal }),
            ...(tpReference !== null && { tenderRef: tpReference }),
            ...(tpSalesRep  !== null && tpSalesRep !== '' && { assignedTo: tpSalesRep }),
            ...syncStamp(tpLastEditor)
          };
          await saveDoc('opportunities', o.id, upd);
          updatedOpps = updatedOpps.map(x => x.id === o.id ? upd : x);
        }
        if (relatedOpps.length > 0) {
          setState({ opportunities: updatedOpps });
          requestAnimationFrame(() => {
            [...document.querySelectorAll('.apro-no-sb')].forEach((el, i) => { if (_scrollSave[i]) el.scrollLeft = _scrollSave[i]; });
          });
        }
      }
    }
  } catch {}
  // 2. Teklif mevcut → SSO ile doğrudan aç
  const token = await getCrmSessionToken();
  if (!token) { showToast('⚠️ Oturum alınamadı, tekrar deneyin.'); return; }
  window.open(`${TEKLIF_APP_URL}/crm-login?token=${encodeURIComponent(token)}&redirect=/quotations/${quotationId}`, '_blank');
}

// Aşama 3: Müşteri güncelleme senkronizasyonu (fire-and-forget)
function syncCustomerToTeklif(customer) {

      name: customer.firmName || customer.name || '',

    }),
  }).catch(() => {}); // Sessizce geç — CRM akışını engelleme
}

// Aşama 1+2: Teklif oluştur — tür seçimi + mükerrer koruma + CRM'e quotationId kaydet
async function teklifOlustur(customer, opportunityTitle, opportunityId) {
  // Format + para birimi seçimi
  const selection = await selectTeklifFormat();
  if (!selection) return;
  const { format, currency, language } = selection;
  // Teknik Servis: UNIT_PRICE düzeni + isService bayrağı (numara A-Pro-BT serisi).
  const isService = format === 'SERVICE';
  const apiFormat = isService ? 'UNIT_PRICE' : format;
  // Personel listelerini Teklif Programı'na sync et (fire-and-forget)
  const salesRepsSync  = usersWithTargets().map(u=>u.displayName);
  const preparedBySync = usersWithTargets().map(u=>u.displayName).sort((a,b)=>a.localeCompare(b,'tr'));
  fetch(TEKLIF_STAFF_SYNC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-crm-key': TEKLIF_API_KEY },
    body: JSON.stringify({ salesReps: salesRepsSync, preparedByNames: preparedBySync }),
  }).catch(() => {});

  // Aşama 2: Fırsata bağlı teklif zaten varsa uyar
  if (opportunityId) {
    const existing = state.proposals.find(p =>
      p.customerId === customer.id && p.quotationId && p.opportunityId === opportunityId
    );
    if (existing) {
      const openExisting = confirm(
        'Bu fırsat için zaten bir teklif oluşturulmuş:\n"' + existing.title + '"\n\nMevcut teklifi açmak ister misiniz?\n\nTamam = Mevcut teklifi aç\nİptal = Yine de yeni oluştur'
      );
      if (openExisting) {
        await openQuotationWithSSO(existing.quotationId);
        return;
      }
    }
  }
  try {
    showNotification('teklif-aciliyor', 'Teklif Programı', 'Teklif oluşturuluyor...', 'info');
    // Satış temsilcisi = fırsatın sahibi (assignedTo); yoksa teklifi açan kullanıcı.
    // Hazırlayan = teklifi açan CRM kullanıcısı. Böylece Teklif'te tekrar seçilmez (mükerrer önlenir).
    const _opp = opportunityId ? state.opportunities.find(o => o.id === opportunityId) : null;
    const salesRepName = (_opp && _opp.assignedTo) || state.currentUser?.displayName || '';
    const preparedByName = state.currentUser?.displayName || '';
    const res = await fetch(TEKLIF_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-crm-key': TEKLIF_API_KEY },
      body: JSON.stringify({
        customerName: customer.firmName || customer.name || 'Bilinmeyen',
        phone: customer.phone || '',
        email: customer.email || '',
        crmCustomerId: customer.id || '',
        crmOpportunityTitle: opportunityTitle || '',
        salesRep: salesRepName,
        preparedBy: preparedByName,
        format: apiFormat,
        currency: currency,
        language: language,
        isService: isService,
      }),
    });
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error(body?.error?.message ?? 'Sunucu hatası');
    const { quotationId, quotationUrl } = body.data;
    // Fırsata bağlıysa: mevcut proposal'ı güncelle, yoksa yeni oluştur
    const existingProp = opportunityId
      ? state.proposals.find(p => p.opportunityId === opportunityId && !p.quotationId)
      : null;
    if (existingProp) {
      const updated = {...existingProp, quotationId: quotationId||'', quotationUrl: quotationUrl||'', quotationStatus: 'DRAFT', source: 'opportunity', ...stamp()};
      await saveDoc('proposals', existingProp.id, updated);
      setState({ proposals: state.proposals.map(p => p.id===existingProp.id ? updated : p) });
    } else {
      const propTitle = opportunityTitle || ((customer.firmName || customer.name || '') + ' — Teklif');
      const propId = genId();
      const propData = {
        id: propId, title: propTitle,
        customerId: customer.id||'', opportunityId: opportunityId||'',
        preparedBy: state.currentUser?.displayName||'', amount: 0,
        status: 'Hazırlanıyor', createdAt: today(),
        validUntil: '', sentDate: '', notes: '',
        quotationId: quotationId||'', quotationUrl: quotationUrl||'', quotationStatus: 'DRAFT',
        source: 'opportunity',
        ...stamp(),
      };
      await saveDoc('proposals', propId, propData);
      setState({ proposals: [...state.proposals, propData] });
    }
    // Fırsata doğrudan quotationUrl yaz (hızlı erişim için)
    if (opportunityId) {
      const opp = state.opportunities.find(o => o.id === opportunityId);
      if (opp) {
        const updatedOpp = {...opp, quotationId: quotationId||'', quotationUrl: quotationUrl||'', quotationStatus: 'DRAFT', ...stamp()};
        await saveDoc('opportunities', opportunityId, updatedOpp);
        setState({ opportunities: state.opportunities.map(o => o.id===opportunityId ? updatedOpp : o) });
      }
    }
    // Otomatik oturum: CRM kullanıcısı teklif programına direkt girer
    const sessionToken = await getCrmSessionToken();
    if (!sessionToken) {
      console.warn('[SSO] Token alınamadı — pencere açılmadı.');
      showToast('⚠️ Teklif oluşturuldu. Teklif Programı açılamadı, lütfen tekrar deneyin.');
      return;
    }
    // Yeni oluşturulan teklif direkt açılır (az önce DB'ye yazıldı, 404 yok)
    const openUrl = `${TEKLIF_APP_URL}/crm-login?token=${encodeURIComponent(sessionToken)}&redirect=/quotations/${quotationId}`;
    window.open(openUrl, '_blank');
    showToast('✅ Teklif oluşturuldu — Fırsat ve Teklif Talepleri güncellendi!');
  } catch(e) {
    alert('Teklif oluşturulamadı: ' + e.message);
  }
}

async function loadUsers() {
  try {
    const snap = await db.collection('users').get();
    if(snap.empty) {
      // İlk kurulum - rol dokümanlarını oluştur (şifre Firestore'a YAZILMAZ; Firebase Auth tutar)
      for(const u of DEFAULT_USERS) {
        const {password, ...rest} = u;
        await db.collection('users').doc(u.email).set({...rest, active:true, createdAt: today()});
      }
      return DEFAULT_USERS.map(u=>{ const {password, ...r}=u; return {...r,active:true}; });
    }
    return snap.docs.map(d=>({...d.data(), email:d.id}));
  } catch(e) { return DEFAULT_USERS.map(u=>{ const {password, ...r}=u; return {...r,active:true}; }); }
}

async function loadCollection(name) {
  try {
    const snap = await db.collection(name).orderBy('createdAt','asc').get();
    return snap.docs.map(d=>({...d.data(), id:d.id}));

    try {
      const snap = await db.collection(name).get();
      return snap.docs.map(d=>({...d.data(), id:d.id}));
    } catch(e2) { return []; }

}

// ════════ MALİ YIL ALTYAPISI (global aktif yıl + yıl merceği) ════════
// GLOBAL aktif mali yıl: tüm yıla-ait ekranlar bu yıla göre süzülür; yeni kayıtlar bu yıla damgalanır.
function activeFiscalYear(){ return Number(state.activeFiscalYear) || new Date().getFullYear(); }
// Yıla-ait koleksiyonlar (mercek uygulanır). Müşteri/Tedarikçi/Periyodik Bakım ORTAK → burada YOK.
const FY_SCOPED_COLLECTIONS = ['opportunities','proposals','services','serviceOpps','visits','appointments','tasks','evaluations'];
// Bir kaydın MERCEK yılı (hangi mali yıl bölümünde görünür): sabit damga varsa o, yoksa doğuş (createdAt) yılı.
//   → updatedAt KULLANILMAZ (açık kaydın yılı düzenlemeyle kaymasın). Prim atfı ayrı fonksiyondadır (_pOppFY).
function recFY(rec){
  if(!rec) return 0;
  if(rec.fiscalYear!=null && rec.fiscalYear!=='') return Number(rec.fiscalYear)||0;
  const c = String(rec.createdAt||rec.date||rec.dueDate||rec.period||'');
  return Number(c.slice(0,4)) || new Date().getFullYear();
}
// Listeyi aktif mali yıla göre süz (yıla-ait koleksiyonlar için).
function filterFY(list, year){
  const y = Number(year)||activeFiscalYear();
  return (list||[]).filter(r=>recFY(r)===y);
}
// Aktif mali yılda o koleksiyonda HİÇ kayıt yoksa "temiz yıl" bilgilendirme şeridi (yoksa boş span).

}
// Eski (acik/tamam) → yeni durum akışına okuma-anında eşleme; yeni alanlara varsayılan.
function normTask(t){
  if(!t) return t;
  if(t._norm) return t;                      // idempotent
  const status = t.status==='acik' ? 'yapilacak'
               : t.status==='tamam' ? 'tamamlandi'
               : (t.status||'yapilacak');
  return Object.assign({}, t, {
    _norm:true,
    context: t.context || 'sirket',
    assignedBy: t.assignedBy || t.createdBy || '',
    linkType: t.linkType || t.linkedType || 'none',
    linkId: t.linkId || t.linkedId || '',
    linkLabel: t.linkLabel || '',
    status,
    needsApproval: t.needsApproval===true,
    dueTime: t.dueTime || '',
    startDate: t.startDate || '',
    approvedAt: t.approvedAt || null,
    approvedBy: t.approvedBy || '',
    revisionCount: Number(t.revisionCount)||0,
    assignmentHistory: Array.isArray(t.assignmentHistory)? t.assignmentHistory : [],
    comments: Array.isArray(t.comments)? t.comments : [],
    execStage: t.execStage || '',
  });
}
// ---- Faz 2: Proje icra erişimcileri (okuma-anında varsayılan, migration yok) ----
function projStage(o){ return (o && typeof PROJECT_STAGES!=='undefined' && PROJECT_STAGES.includes(o.execStage)) ? o.execStage : 'teknik'; }
function projIsActive(o){ return !!(o && o.execActive===true && !o.execClosedAt); }
function projIsAwaiting(o){ return !!(o && o.stage==='KAZANILDI' && o.execActive!==true); }
function projIsClosed(o){ return !!(o && o.execActive===true && o.execClosedAt); }
// ===== FAZ 3a: Arıza servis icra — salt-okuma güvenli erişimciler =====
function servExecStage(s){ return (s && typeof SERVICE_STAGES!=='undefined' && SERVICE_STAGES.includes(s.execStage)) ? s.execStage : 'talep'; }
function servIsActive(s){ return !!(s && s.execActive===true && !s.execClosedAt); }
function servIsAwaiting(s){ return !!(s && s.execActive!==true && (s.status==='Onaylandı' || s.status==='Randevu')); }
function servIsClosed(s){ return !!(s && s.execActive===true && s.execClosedAt); }
function servIsOverdue(s){ return !!(s && s.execTargetDate && _toDate(s.execTargetDate) < _toDate(today())); }
// "Kapalı" (iş bitti) sayılan durumlar: onaylandi her zaman; tamamlandi yalnız onay gerekmiyorsa.
function taskIsClosed(t){
  const n = normTask(t)||{};
  return n.status==='onaylandi' || (n.status==='tamamlandi' && !n.needsApproval);
}
// Akıllı onay varsayılanı: yüksek öncelik VEYA proje/servis bağlamı → true.
function defaultNeedsApproval(ctx, priority){
  return priority==='yuksek' || ctx==='proje' || ctx==='servis';
}
// Bir kayıt silinince bağlı autoGenerated görevleri de sil; manuel bağlıları döndür (çağıran sorar).
async function cascadeDeleteTasksFor(linkType, linkId){
  const bound = (state.tasks||[]).map(normTask).filter(t=>t.linkType===linkType && t.linkId===linkId);
  const autos = bound.filter(t=>t.autoGenerated);
  const manuals = bound.filter(t=>!t.autoGenerated);
  for(const t of autos){ await deleteDoc('tasks', t.id); }
  if(autos.length) setState({ tasks:(state.tasks||[]).filter(x=>!autos.some(a=>a.id===x.id)) });
  return { deletedAuto: autos.length, manuals };
}
// Aktif mali yılı yükle: settings/config.activeFiscalYear; yoksa/eskiyse takvim yılına OTOMATİK ilerlet (1 Ocak geçişi).
async function loadActiveFiscalYear(){
  const calYear = new Date().getFullYear();
  try {
    const snap = await db.collection('settings').doc('config').get();
    const stored = snap.exists ? Number(snap.data().activeFiscalYear)||0 : 0;
    // Otomatik ilerleme: kayıtlı yıl takvim yılından küçükse yeni yıla geç ve kalıcılaştır.
    if(stored && stored>=calYear) return stored;
    if(stored && stored<calYear){ try{ await db.collection('settings').doc('config').set({activeFiscalYear:calYear},{merge:true}); }catch(e){} return calYear; }
    return calYear;
  } catch(e){ return calYear; }
}
// Aktif mali yılı GLOBAL değiştir (kalıcı). Admin: yıl geçişi / geçmiş yılı görüntüleme.

// YIL BAZLI hedefleri döndürür: { '2026': {...}, ... }. Eski DÜZ yapıyı otomatik içinde bulunulan yıla sarar.
async function loadTargets() {
  try {
    const snap = await db.collection('settings').doc('targets').get();
    if(!snap.exists) return {};
    const data = snap.data() || {};
    const keys = Object.keys(data);
    const looksYearly = keys.length>0 && keys.every(k=>/^\d{4}$/.test(k));
    if(looksYearly) return data;                                  // zaten yıl bazlı
    const legacyYear = String(new Date().getFullYear());           // eski düz yapı → bu yıla sar (geriye dönük uyum)
    return { [legacyYear]: { ..._emptyTargets(), ...data } };
  } catch(e) { return {}; }
}

// Bir yıl+kişi için ledger kaydı (yoksa boş).
function _ledgerRec(year, name){
  const y = (state.primLedger||{})[String(year)] || {};
  return y[name] || { paid:0, quarters:{} };
}
// O yıl içinde, verilen çeyrekten ÖNCEKİ çeyreklerde bu kişiye ödenen toplam prim.
function _paidBeforeQuarter(year, name, q){
  const rec=_ledgerRec(year,name); let s=0;
  Object.keys(rec.quarters||{}).forEach(k=>{ if(Number(k)<Number(q)) s+=Number(rec.quarters[k].amount)||0; });
  return s;
}

async function loadEvalConfig() {
  // Kriter yapısı ve ağırlıklar HER ZAMAN koddan (DEFAULT_EVAL_CONFIG) gelir — tek doğruluk kaynağı.
  // Kayıttan yalnızca prim ayarları (taban/eşik/hızlandırıcı) alınır; böylece kod ağırlık değişiklikleri asla gizlenmez.
  const base = JSON.parse(JSON.stringify(DEFAULT_EVAL_CONFIG));
  try {
    const snap = await db.collection('settings').doc('evalConfig').get();
    if(snap.exists && snap.data()) {
      const saved = snap.data();
      Object.keys(base).forEach(dep=>{
        const s = saved[dep];
        if(s && typeof s==='object'){
          if(typeof s.primBase==='number')    base[dep].primBase    = s.primBase;
          if(typeof s.threshold==='number')   base[dep].threshold   = s.threshold;
          if(typeof s.overCap==='number')     base[dep].overCap     = s.overCap;
          if(typeof s.overAccel==='number')   base[dep].overAccel   = s.overAccel;
        }
      });
    }
  } catch(e) { /* varsayılan kullanılır */ }
  return base;
}
async function saveEvalConfig(cfg) {
  try {
    // Yalnızca prim parametrelerini sakla — kriter/ağırlık koddan yönetildiği için kaydedilmez.
    const out = {};
    Object.keys(cfg||{}).forEach(dep=>{
      const c = cfg[dep]||{};
      out[dep] = { primBase:Number(c.primBase)||0, threshold:Number(c.threshold)||0, overCap:Number(c.overCap)||1.5, overAccel:Number(c.overAccel)||1 };
    });
    await db.collection('settings').doc('evalConfig').set(out);
    state.evalConfig = await loadEvalConfig();
    showToast('✅ Prim ayarları kaydedildi!');
  } catch(e) { showToast('❌ Kaydedilemedi!','#dc2626'); }
}

async function loadProfitActuals() {
  // Teklif Programı'ndan gerçekleşen kâr verisi. Dönüş = marginByRep (aylık marj %, geriye dönük uyum).
  // AYRICA state.profitByRep + state.revenueByRep doldurulur → karlilik kriteri YTD kümülatif
  // blended marjı (ΣYTD kâr ÷ ΣYTD ciro) olarak DOĞRU hesaplar (aylık %'leri ortalamak yanlıştır).
  try {
    if (typeof TEKLIF_APP_URL === 'undefined' || typeof TEKLIF_API_KEY === 'undefined' || !TEKLIF_API_KEY) return {};
    const res = await fetch(`${TEKLIF_APP_URL}/api/v1/crm/profit`, { headers: { 'x-crm-key': TEKLIF_API_KEY } });
    if(!res.ok) return {};
    const body = await res.json().catch(()=>null);
    const data = body && body.data ? body.data : null;
    if(!data) return {};
    state.profitByRep  = (data.profitByRep  && typeof data.profitByRep==='object')  ? data.profitByRep  : {};
    state.revenueByRep = (data.revenueByRep && typeof data.revenueByRep==='object') ? data.revenueByRep : {};
    return (data.marginByRep && typeof data.marginByRep==='object') ? data.marginByRep : {};
  } catch(e) { return {}; }
}
// YTD kümülatif blended kâr marjı (%) = ΣYTD kâr ÷ ΣYTD ciro × 100. Ham veri yoksa null.
// Dönemler quotation.updatedAt ayına göre keylenir (takvim yılı); teklif fiscalYear devri Faz 2.
function _cumMarginPct(name, period){
  const pr = (state.profitByRep||{})[name];
  const rv = (state.revenueByRep||{})[name];
  if(!pr || !rv) return null;
  const py=Number(String(period).slice(0,4))||0, pm=Number(String(period).slice(5,7))||0;
  let profit=0, revenue=0, any=false;
  Object.keys(rv).forEach(k=>{
    const ky=Number(String(k).slice(0,4))||0, km=Number(String(k).slice(5,7))||0;
    if(ky===py && km<=pm){ revenue += Number(rv[k])||0; profit += Number(pr[k])||0; any=true; }
  });
  if(!any || revenue<=0) return null;
  return (profit/revenue)*100;
}

async function saveTargets(targets) {
  try {
    // Tüm değerleri Number'a çevir (string kalmasın)
    const clean = {
      company: Number(targets.company)||0,
      serviceCompany: Number(targets.serviceCompany)||0,
      reps: {},
      serviceReps: {},
      profitReps: {}
    };
    Object.keys(targets.reps||{}).forEach(k=>{ clean.reps[k] = Number(targets.reps[k])||0; });
    Object.keys(targets.serviceReps||{}).forEach(k=>{ clean.serviceReps[k] = Number(targets.serviceReps[k])||0; });
    Object.keys(targets.profitReps||{}).forEach(k=>{ clean.profitReps[k] = Number(targets.profitReps[k])||0; });
    // Yıl bazlı sakla: yalnızca AKTİF mali yılın hedefini güncelle, diğer yıllara dokunma.
    const fy = String(_currentFY());
    // Dashboard state.targets'ı içinde bulunulan TAKVİM yılı için okur; yalnızca o yıl düzenleniyorsa güncelle.
    const isCurrentCalendarYear = fy === String(new Date().getFullYear());
    const byYear = JSON.parse(JSON.stringify(state.targetsByYear||{}));
    byYear[fy] = clean;
    if(state.testMode){ state.targetsByYear = byYear; if(isCurrentCalendarYear) state.targets = clean; showToast('🧪 Test modu — hedefler kaydedilmedi'); return; }
    await db.collection('settings').doc('targets').set(byYear);
    state.targetsByYear = byYear;
    if(isCurrentCalendarYear) state.targets = clean;
    showToast('✅ '+fy+' hedefleri kaydedildi!');
  } catch(e) { showToast('❌ Hedef kaydedilemedi!','#dc2626'); }
}

function h(tag, attrs={}, ...children) {
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)) {
    if(k==='style'&&typeof v==='object') Object.assign(el.style, v);
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='className') el.className=v;
    else el.setAttribute(k,v);
  }
  for(const c of children.flat()) {
    if(c==null||c===false||c===undefined) continue;
    el.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(String(c)) : c);
  }
  return el;
}
function badge(lbl, color) {
  return h('span',{style:{background:color+'22',color,padding:'4px 11px',borderRadius:'20px',fontSize:'12px',fontWeight:'700',whiteSpace:'nowrap',border:'1px solid '+color+'44'}},lbl);

let loginState = {email:'',pw:'',err:'',attempts:0,locked:false};

function renderLogin() {
  async function doLogin() {
    if(loginState.locked) return;
    loginState.err = '';
    const email = loginState.email.trim().toLowerCase();
    const pw = loginState.pw;
    if(!email || !pw) { loginState.err='E-posta ve şifre gerekli.'; renderLoginForm(); return; }
    loginState.checking = true;
    renderLoginForm();
    try {
      // 1) Firebase Auth ile kimlik doğrula (düz metin şifre karşılaştırması YOK)
      try {
        await auth.signInWithEmailAndPassword(email, pw);
      } catch(authErr) {
        // İlk kurulum: varsayılan admin Auth'ta henüz yoksa oluştur
        // Plaintext parola yok: yalnız tanımlı admin e-postası, ilk kurulumda yazdığı parolayla Auth hesabını oluşturur.
        const isDefaultAdmin = DEFAULT_USERS.some(u=>u.email.toLowerCase()===email);
        const code = authErr.code||'';
        if(isDefaultAdmin && (code==='auth/user-not-found'||code==='auth/invalid-credential'||code==='auth/invalid-login-credentials')) {
          await auth.createUserWithEmailAndPassword(email, pw);
        } else { throw authErr; }
      }
      // 2) Rol dokümanını oku (artık kimlik doğrulanmış — kilitli kurallar izin verir)
      let user;
      const udoc = await db.collection('users').doc(email).get({source:'server'});
      if(udoc.exists) {
        user = {...udoc.data(), email};
      } else {
        // Rol dokümanı yoksa: yalnız varsayılan admin için oluştur, aksi halde reddet
        const da = DEFAULT_USERS.find(u=>u.email.toLowerCase()===email);
        if(da) {
          const {password, ...rest} = da;
          await db.collection('users').doc(email).set({...rest, active:true, createdAt:today()});
          user = {...rest, email, active:true};
        } else {
          await auth.signOut();
          loginState.checking=false; loginState.err='Hesap tanımlı değil. Yöneticiye başvurun.'; renderLoginForm(); return;
        }
      }
      if(user.active===false) {
        await auth.signOut();
        loginState.checking=false; loginState.err='Bu hesap pasif. Yöneticiye başvurun.'; renderLoginForm(); return;
      }
      loginState.checking=false;
      state.users = state.users || [];
      setState({currentUser:user, view:'app', loading:true});
      await loadAllData();
      setState({loading:false});
      // personelAutoGenerateTasks(); // KALDIRILDI — şablon-tetiklemeli modele geçildi (spec §8)
      taskDueReminders(); // fire-and-forget, günde bir kez bildirir
    } catch(err) {
      loginState.checking=false;
      loginState.attempts++;
      const code = err.code||'';
      loginState.err =
        (code==='auth/wrong-password'||code==='auth/invalid-credential'||code==='auth/invalid-login-credentials') ? 'E-posta veya şifre hatalı.' :
        code==='auth/user-not-found' ? 'E-posta tanınmıyor.' :
        code==='auth/too-many-requests' ? 'Çok fazla deneme. Bir süre sonra tekrar deneyin.' :
        code==='auth/user-disabled' ? 'Bu hesap devre dışı bırakılmış.' :
        code==='auth/network-request-failed' ? 'Sunucuya bağlanılamadı. İnternet bağlantınızı kontrol edin.' :
        'Giriş başarısız. Bilgileri kontrol edin.';
      loginState.pw='';
      if(loginState.attempts>=5) loginState.locked=true;
      renderLoginForm();
    }
  }

  function renderLoginForm() {
    const root = document.getElementById('root');
    root.innerHTML='';

    const emailInp = inp('e-posta@a-pro.com.tr', loginState.email, v=>{loginState.email=v;loginState.err='';});
    const pwInp = inp('••••••', loginState.pw, v=>{loginState.pw=v;loginState.err='';}, 'password', {letterSpacing:'0.18em',textAlign:'center',fontSize:'16px'});
    pwInp.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

    const errDiv = loginState.err ? h('div',{style:{background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:'9px',padding:'10px 14px',color:'#dc2626',fontSize:'13px',marginBottom:'14px',textAlign:'center'}},loginState.err) : null;

    const content = loginState.locked
      ? h('div',{style:{background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:'12px',padding:'20px',textAlign:'center'}},
          h('div',{style:{fontSize:'28px',marginBottom:'8px'}},'🚫'),
          h('div',{style:{color:'#dc2626',fontWeight:'700',fontSize:'15px',marginBottom:'4px'}},'Erişim Engellendi'),
          h('div',{style:{color:'#ef4444',fontSize:'13px'}},'5 hatalı deneme. Sayfayı yenileyip tekrar deneyin.')
        )
      : h('div',{},
          field('E-posta', emailInp),
          field('Şifre', pwInp),
          errDiv||h('span'),
          btn(loginState.checking?'Doğrulanıyor...':'Giriş Yap', loginState.checking?()=>{}:doLogin, 'linear-gradient(135deg,#2563eb,#1d4ed8)', '#fff', '13px 16px', {width:'100%',fontSize:'15px',borderRadius:'10px',fontWeight:'700',boxShadow:'0 4px 12px rgba(37,99,235,.3)',opacity:loginState.checking?'0.7':'1',cursor:loginState.checking?'not-allowed':'pointer'}),
          h('div',{style:{textAlign:'center',marginTop:'16px',fontSize:'12px',color:'#7a90aa'}},'Yetkisiz erişim yasaktır.')
        );

    root.appendChild(
      h('div',{style:{minHeight:'100vh',background:'linear-gradient(160deg,#0f2040 0%,#1e3a6e 50%,#1a3060 100%)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Inter',sans-serif"}},
        h('div',{style:{background:'#ffffff',border:'none',borderRadius:'20px',padding:'44px 40px',width:'100%',maxWidth:'400px',animation:'fu .35s ease',boxShadow:'0 25px 60px rgba(15,31,53,.35)'}},
          h('div',{style:{textAlign:'center',marginBottom:'28px'}},
            h('div',{style:{width:'60px',height:'60px',background:'linear-gradient(135deg,#2563eb,#1d4ed8)',borderRadius:'16px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'28px',margin:'0 auto 16px',boxShadow:'0 6px 16px rgba(37,99,235,.35)'}},'⚡'),
            h('div',{style:{fontWeight:'800',fontSize:'22px',color:'#0f1f35',marginBottom:'6px'}},'A-PRO İş Takip CRM'),
            h('div',{style:{fontSize:'12px',color:'#4a6080',textTransform:'uppercase',letterSpacing:'0.08em'}},'Mühendislik · Satış & Servis')
          ),
          content
        )
      )
    );
    setTimeout(()=>emailInp.focus(),100);
  }

  renderLoginForm();
}

// Fırsat "KAZANILDI" olduğunda bağlı teklifi Teklif Programı'nda APPROVED durumuna çeker.
// Karlılık (profit) yalnızca APPROVED teklifleri topladığı için bu adım olmadan
// kazanılan satış karlılıkta "veri yok" kalır. Endpoint idempotenttir (tekrar tetiklenirse hata vermez).
async function approveWonQuotation(opp) {
  try {
    if (typeof TEKLIF_APPROVE_URL === 'undefined' || !TEKLIF_API_KEY) return;
    if (!opp || opp.stage !== 'KAZANILDI' || !opp.quotationId) return;
    if (opp.quotationStatus === 'APPROVED') return;
    // Hazırlayan: bağlı teklif talebinden; satış temsilcisi: fırsat sahibi.
    const prop = (state.proposals || []).find(p => p.quotationId === opp.quotationId);
    const res = await fetch(TEKLIF_APPROVE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-crm-key': TEKLIF_API_KEY },
      body: JSON.stringify({
        quotationId: opp.quotationId,
        salesRep: opp.assignedTo || '',
        preparedBy: (prop && prop.preparedBy) || '',
      }),
    });
    const body = await res.json().catch(() => null);
    if (!res.ok || !body || !body.success) return;
    // Yerel durumu APPROVED yap → buton/rozet güncellensin.
    const upd = {...opp, quotationStatus: 'APPROVED', ...stamp()};
    await saveDoc('opportunities', opp.id, upd);
    setState({opportunities: (state.opportunities || []).map(o => o.id === opp.id ? upd : o)});
    showToast('✅ Teklif onaylandı — karlılığa dahil edildi.');
  } catch (e) { /* sessiz: kazanma kaydını engellemez */ }
}

async function saveProp(form, isEdit) {

  if(isAssignedToOther && assigneeChanged) {
    const notifKey = 'prop_assigned_'+id+'_'+preparedBy;

        '📄 Teklif Atandı',
        '"'+(data.title||'Teklif')+'" hazırlamanız için atandı.',

async function delItem(col, id) {
  if(col==='proposals') {
    if(!confirm('Bu teklif taslağını silmek istediğinizden emin misiniz?')) return;
  } else {
    if(!confirm('Silmek istiyor musunuz?')) return;
  }
  if(col==='services'){ await cascadeDeleteTasksFor('service', id); }
  if(col==='maintenances'){ await cascadeDeleteTasksFor('maintenance', id); }
  await deleteDoc(col, id);
  if(col==='customers') setState({customers:state.customers.filter(x=>x.id!==id)});
  else if(col==='opportunities') setState({opportunities:state.opportunities.filter(x=>x.id!==id)});
  else if(col==='proposals') setState({proposals:state.proposals.filter(x=>x.id!==id)});
  else if(col==='services') setState({services:state.services.filter(x=>x.id!==id)});
  else if(col==='maintenances') setState({maintenances:state.maintenances.filter(x=>x.id!==id)});
  showToast('🗑 Silindi.');
}

  let nc = {name:'',title:'',email:'',phone:''};

  function getEl() {
    const contactsDiv = h('div',{});
    let editContactId = null;
    let ec = {name:'',title:'',email:'',phone:''};

    function renderContacts() {
      contactsDiv.innerHTML='';
      f.contacts.forEach(ct=>{
        // Düzenleme modu aktif mi bu kişi için?
        if(editContactId===ct.id) {
          const eName=inp('Ad Soyad',ec.name,v=>ec.name=v);
          const eTitle=inp('Ünvan',ec.title,v=>ec.title=v);
          const eEmail=inp('E-posta',ec.email,v=>ec.email=v);
          const ePhone=inp('Telefon',ec.phone,v=>ec.phone=v);
          contactsDiv.appendChild(h('div',{style:{background:'#eff6ff',border:'1.5px solid #3b82f6',borderRadius:'10px',padding:'12px',marginBottom:'8px'}},
            row(field('Ad Soyad *',eName,true),field('Ünvan',eTitle,true)),
            row(field('E-posta',eEmail,true),field('Cep Tel',ePhone,true)),
            h('div',{style:{display:'flex',gap:'8px',marginTop:'8px'}},
              btn('✓ Kaydet',()=>{
                if(!ec.name)return;
                f.contacts=f.contacts.map(k=>k.id===ct.id?{...k,...ec}:k);
                editContactId=null;renderContacts();
              },'linear-gradient(135deg,#10b981,#059669)','#fff','7px 14px',{flex:'1',fontSize:'12px'}),
              btn('İptal',()=>{editContactId=null;renderContacts();},'#21262d','#8b949e','7px 12px',{fontSize:'12px'})
            )
          ));
        } else {
          contactsDiv.appendChild(h('div',{style:{background:G,border:`1px solid ${G4}`,borderRadius:'9px',padding:'10px 13px',marginBottom:'8px',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
            h('div',{},
              h('div',{style:{fontWeight:'700',fontSize:'13px',color:T1,marginBottom:'3px'}},ct.name+(ct.title?` — ${ct.title}`:'')),
              h('div',{style:{display:'flex',gap:'12px',flexWrap:'wrap'}},
                ct.email?h('span',{style:{fontSize:'11px',color:'#2563eb'}},'✉ '+ct.email):h('span'),
                ct.phone?h('span',{style:{fontSize:'11px',color:'#16a34a'}},'📱 '+ct.phone):h('span')
              )
            ),
            h('div',{style:{display:'flex',gap:'5px'}},
              btn('✏️',()=>{editContactId=ct.id;ec={name:ct.name||'',title:ct.title||'',email:ct.email||'',phone:ct.phone||''};renderContacts();},'#eff6ff','#1d4ed8','5px 9px',{fontSize:'11px',border:'1px solid #bfdbfe',borderRadius:'6px'}),
              h('button',{onClick:()=>{f.contacts=f.contacts.filter(k=>k.id!==ct.id);renderContacts();},style:{background:'none',border:'none',color:'#f87171',cursor:'pointer',fontSize:'18px',padding:'2px 6px'}},'×')
            )
          ));
        }
      });
      if(!f.contacts.length&&!addMode) contactsDiv.appendChild(h('div',{style:{color:T3,fontSize:'12px'}},'Henüz kişi eklenmedi.'));
    }
    renderContacts();

    const addArea = h('div',{});
    const addBtn2 = btn('+ Kişi Ekle', ()=>{addMode=true;renderAdd();}, 'linear-gradient(135deg,#6366f1,#8b5cf6)', '#fff', '5px 12px', {fontSize:'12px'});
    function renderAdd() {
      addArea.innerHTML='';
      if(!addMode){addArea.appendChild(addBtn2);return;}
      const nName=inp('Ad Soyad',nc.name,v=>nc.name=v);
      const nTitle=inp('Müdür…',nc.title,v=>nc.title=v);
      const nEmail=inp('kisi@firma.com',nc.email,v=>nc.email=v);
      const nPhone=inp('0532 000 00 00',nc.phone,v=>nc.phone=v);
      addArea.appendChild(h('div',{style:{background:G,border:'1px solid #6366f1',borderRadius:'10px',padding:'13px'}},
        row(field('Ad Soyad *',nName,true),field('Ünvan',nTitle,true)),
        row(field('E-posta',nEmail,true),field('Cep Tel',nPhone,true)),
        h('div',{style:{display:'flex',gap:'8px'}},
          btn('✓ Kişiyi Ekle',()=>{if(!nc.name)return;f.contacts.push({...nc,id:genId()});nc={name:'',title:'',email:'',phone:''};addMode=false;renderContacts();renderAdd();},'linear-gradient(135deg,#10b981,#059669)','#fff','8px 14px',{flex:'1'}),
          btn('İptal',()=>{addMode=false;renderAdd();},'#21262d','#8b949e')
        )
      ));
    }
    renderAdd();

    const fName=inp('Firma adı',f.firmName,v=>f.firmName=v);
    // Sektör seçimi - ÇOK SEKTÖRLÜ ŞİRKET seçilirse alt panel açılır
    // Yeni firma ise sectors boş başlasın, düzenleme ise mevcut sectors gelsin
    if(!f.sectors || !Array.isArray(f.sectors)) f.sectors = [];
    // Yeni kayıt ise sıfırla, düzenlemede koru
    const isNewRecord = !item;
    if(isNewRecord) f.sectors = [];

    const subSectorPanel = document.createElement('div');
    subSectorPanel.style.cssText = 'display:none;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px;margin-top:8px;';

    function renderSubSectors() {
      subSectorPanel.innerHTML = '';
      const title = document.createElement('div');
      title.style.cssText = 'font-size:12px;font-weight:700;color:#1d4ed8;margin-bottom:10px;';
      title.textContent = '🏢 Sektörleri seçin (birden fazla seçilebilir):';
      subSectorPanel.appendChild(title);

      const grid = document.createElement('div');
      grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:6px;';

      const subList = SEC_C.filter(s => s !== 'ÇOK SEKTÖRLÜ ŞİRKET');
      subList.forEach(function(s) {
        const isChecked = f.sectors.indexOf(s) >= 0;

        const lbl = document.createElement('label');
        lbl.style.cssText = 'display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:8px;cursor:pointer;user-select:none;' +
          (isChecked ? 'background:#dbeafe;border:1.5px solid #3b82f6;' : 'background:#fff;border:1.5px solid #e2e8f0;');

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = isChecked;
        chk.style.cssText = 'width:15px;height:15px;cursor:pointer;accent-color:#2563eb;flex-shrink:0;';
        chk.addEventListener('change', function() {
          if(chk.checked) {
            if(f.sectors.indexOf(s) < 0) f.sectors.push(s);
          } else {
            f.sectors = f.sectors.filter(function(x){ return x !== s; });
          }
          renderSubSectors();
        });

        const span = document.createElement('span');
        span.style.cssText = 'font-size:12px;' + (isChecked ? 'color:#1d4ed8;font-weight:600;' : 'color:#374151;font-weight:400;');
        span.textContent = s;

        lbl.appendChild(chk);
        lbl.appendChild(span);
        grid.appendChild(lbl);
      });

      subSectorPanel.appendChild(grid);

      if(f.sectors.length > 0) {
        const summary = document.createElement('div');
        summary.style.cssText = 'margin-top:10px;padding:8px 10px;background:#dbeafe;border-radius:7px;font-size:12px;color:#1e40af;font-weight:600;';
        summary.textContent = '✓ ' + f.sectors.length + ' sektör seçildi: ' + f.sectors.join(', ');
        subSectorPanel.appendChild(summary);
      } else {
        const hint = document.createElement('div');
        hint.style.cssText = 'margin-top:8px;font-size:11px;color:#6b7280;font-style:italic;';
        hint.textContent = 'Henüz sektör seçilmedi.';
        subSectorPanel.appendChild(hint);
      }
    }

    const fSectorSel = sel(SEC_C, f.sector || SEC_C[0], function(v) {
      f.sector = v;
      if(v === 'ÇOK SEKTÖRLÜ ŞİRKET') {
        subSectorPanel.style.display = 'block';
        renderSubSectors();
      } else {
        subSectorPanel.style.display = 'none';
        f.sectors = [];
      }
    });

    // Düzenleme modunda zaten ÇOK SEKTÖRLÜ ŞİRKET ise paneli aç
    if(f.sector === 'ÇOK SEKTÖRLÜ ŞİRKET') {
      subSectorPanel.style.display = 'block';
      renderSubSectors();
    }

    const fSector = h('div', {}, fSectorSel, subSectorPanel);
    const fCity=inp('İstanbul',f.city,v=>f.city=v);
    const fPhone=inp('0212 000 00 00',f.phone,v=>f.phone=v);
    const fEmail=inp('info@firma.com',f.email,v=>f.email=v);
    const fWeb=inp('www.firma.com',f.web,v=>f.web=v);

    return h('div',{},
      field('Firma Adı *',fName),
      row(field('Sektör',fSector,true),field('Şehir',fCity,true)),
      row(field('Firma Telefonu',fPhone,true),field('Firma E-posta',fEmail,true)),
      field('Web Adresi',fWeb),
      h('div',{style:{marginBottom:'12px'}},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}},
          lbl(`İletişim Kişileri (${f.contacts.length})`),
          addArea
        ),
        contactsDiv
      ),
      h('div',{style:{display:'flex',gap:'10px'}},
        btn('Kaydet',()=>{if(f.firmName)saveFirm(f,!!item);},'linear-gradient(135deg,#6366f1,#8b5cf6)','#fff','11px 16px',{flex:'1',fontSize:'14px'}),
        btn('İptal',()=>setState({modal:null}),'#21262d','#8b949e','11px 20px',{fontSize:'14px'})
      )
    );
  }
  return modal(item?'Firmayı Düzenle':'Yeni Firma', getEl(), ()=>setState({modal:null}), '680px');
}

// hasTarget !== false olan aktif kullanıcılar (HEDEFSİZ olmayanlar)

function buildOppModal(item) {
  // Yeni fırsat "TEKLİF" aşamasında başlar (teklif talebi formuyla aynı).
  // Varsayılan KAZANILDI idi: kullanıcı aşamayı değiştirmezse fırsat kazanılmış sayılıyor,
  // kazanılan ciroyu şişiriyor ve saveOpp içindeki kural bağlı teklifi kendiliğinden
  // APPROVED'a çekiyordu. Kazanıldı/Kaçtı kararı her zaman elle verilir.
  const f = item ? JSON.parse(JSON.stringify(item)) : {title:'',customerId:'',contractorId:'',adminId:'',value:'',stage:'TEKLİF',jobStatus:JOB_ST[0],sector:SEC_O[0],assignedTo:'',dueDate:'',tenderRef:'',probability:50,notes:'',createdAt:today()};
  const custOpts = [{v:'',l:'Seçin…'},...[...state.customers].sort((a,b)=>(a.firmName||'').localeCompare(b.firmName||'','tr')).map(c=>({v:c.id,l:c.firmName}))];

  const fTitle=inp('Proje adı',f.title,v=>f.title=v);
  const fCust=sel(custOpts,f.customerId,v=>f.customerId=v);
  const fContr=sel(custOpts,f.contractorId,v=>f.contractorId=v);
  const fAdmin=sel(custOpts,f.adminId,v=>f.adminId=v);
  const fSector=sel(SEC_O,f.sector,v=>f.sector=v);
  const fValue=inp('0',f.value,v=>f.value=v,'number');
  const fStage=sel(STAGES,f.stage,v=>f.stage=v);
  const fJob=sel(JOB_ST,f.jobStatus,v=>f.jobStatus=v);
  const repOptions = [{v:'',l:'-- Seçin --'},...usersWithTargets().map(u=>({v:u.displayName,l:u.displayName}))];
  const fAssigned = sel(repOptions, f.assignedTo, v=>f.assignedTo=v);
  const fDue=inp('',f.dueDate,v=>f.dueDate=v,'date');
  // REF. salt-okunur: değer Teklif Programı'ndan (teklif hazırlandı/gönderildi → numara)
  // otomatik gelir. Manuel giriş kapalı — aksi halde sync üzerine yazardı.
  const fRef=h('input',{placeholder:'Teklif hazırlandığında otomatik gelecek',value:f.tenderRef||'',
    readOnly:true,title:'REF. teklif programından otomatik gelir; elle düzenlenemez.',
    style:{width:'100%',padding:'9px 12px',background:'#eef2f7',border:`1px solid ${G4}`,borderRadius:'8px',color:'#64748b',fontSize:'13px',boxSizing:'border-box',fontFamily:"'DM Sans',sans-serif",outline:'none',cursor:'not-allowed'}});
  const fNotes=h('textarea',{placeholder:'Notlar...',style:{width:'100%',padding:'9px 12px',background:G,border:`1px solid ${G4}`,borderRadius:'8px',color:T1,fontSize:'13px',minHeight:'55px',resize:'vertical',boxSizing:'border-box',fontFamily:"'DM Sans',sans-serif"}},f.notes||'');
  fNotes.addEventListener('input',e=>f.notes=e.target.value);

  const probLabel = lbl(`Olasılık %${f.probability}`);
  const fProb=h('input',{type:'range',min:'0',max:'100',value:f.probability,style:{width:'100%',marginTop:'8px',accentColor:'#6366f1'}});
  fProb.addEventListener('input',e=>{f.probability=Number(e.target.value);probLabel.textContent=`Olasılık %${f.probability}`;});

  const content = h('div',{},
    field('Fırsat Başlığı *',fTitle),
    row(field('Müşteri *',fCust,true),field('Değer (€)',fValue,true)),
    row(field('Aşama',fStage,true),field('Müteahhit',fContr,true)),
    row(field('İdare',fAdmin,true),field('Sektör',fSector,true)),
    row(field('İşin Durumu',fJob,true),field('Satış Temsilcisi',fAssigned,true)),
    field('Ön Gör. Sipariş Tarihi',fDue),
    field('Teklif Referansı (tekliften otomatik)',fRef),
    h('div',{style:{display:'flex',gap:'10px',marginTop:'4px'}},
      btn('Kaydet',()=>{
        if(!(f.title&&f.customerId)) return;
        // Faz 2: aktif icrası olan fırsat KAZANILDI'dan çıkarılıyorsa uyar (görevler kalır, icra durur).
        if(item && item.execActive===true && item.stage==='KAZANILDI' && f.stage!=='KAZANILDI'){
          if(!confirm('Bu fırsatın aktif proje icrası var. Aşama KAZANILDI dışına alınırsa icra iptal edilir (görevler kalır). Devam edilsin mi?')) return;
          f.execActive=false;
        }
        saveOpp({...f,value:Number(f.value)||0},!!item);
      },'linear-gradient(135deg,#ea580c,#d97706)','#fff','11px 16px',{flex:'1',fontSize:'14px'}),
      btn('İptal',()=>setState({modal:null}),'#f1f5f9','#4a6080','11px 20px',{fontSize:'14px',border:'1px solid #b0c8e0',borderRadius:'9px'})
    )
  );
  return modal(item?'Fırsatı Düzenle':'Yeni Fırsat', content, ()=>setState({modal:null}), '640px');
}

function buildPropModal(item) {
  const f = item ? JSON.parse(JSON.stringify(item)) : {title:'',customerId:'',contractorId:'',opportunityId:'',preparedBy:'',amount:'',status:'Hazırlanıyor',createdAt:today(),validUntil:'',sentDate:'',notes:''};

  // Hazırlayan listesi: hedef girilmiş kullanıcılar; mevcut kayıttaki isim listede yoksa yine de ekle
  const _targetedNames = usersWithTargets().map(u=>u.displayName);
  const allNames = [...new Set([..._targetedNames, ...(f.preparedBy ? [f.preparedBy] : [])])];

  // Hazırlayan - açılır + yeni kişi ekle
  const prepContainer = document.createElement('div');

  function renderPrepField() {
    prepContainer.innerHTML = '';
    const selEl = document.createElement('select');
    selEl.style.cssText = `width:100%;padding:9px 12px;background:${G};border:1px solid ${G4};border-radius:8px;color:${T1};font-size:13px;outline:none;`;
    // Seçenekler
    [{v:'',l:'Seçin…'}, ...[...allNames].sort((a,b)=>a.localeCompare(b,'tr')).map(n=>({v:n,l:n}))].forEach(opt=>{
      const o = document.createElement('option');
      o.value = opt.v; o.textContent = opt.l;
      if(opt.v === f.preparedBy || (opt.v==='' && !f.preparedBy && !showCustom)) o.selected = true;
      selEl.appendChild(o);
    });
    selEl.addEventListener('change', e=>{
      f.preparedBy=e.target.value; renderPrepField();
    });
    prepContainer.appendChild(selEl);

  }
  renderPrepField();

  const custOpts = [{v:'',l:'Seçin…'},...[...state.customers].sort((a,b)=>(a.firmName||'').localeCompare(b.firmName||'','tr')).map(c=>({v:c.id,l:c.firmName}))];
  const oppOpts = [{v:'',l:'Seçin…'},...state.opportunities.map(o=>({v:o.id,l:o.title}))];
  const fTitle=inp('Teklif/Fırsat adı',f.title,v=>f.title=v);
  const fCust=sel(custOpts,f.customerId,v=>f.customerId=v);
  const fOpp=sel(oppOpts,f.opportunityId,v=>f.opportunityId=v);
  // Mevcut Gönderildi teklifler için sentDate'i modal açılışında doldur
  if(f.status==='Gönderildi'&&!f.sentDate) f.sentDate=today();
  const fSentDate=inp('',f.sentDate||'',v=>f.sentDate=v,'date');
  const fSt=sel(PROP_ST,f.status,v=>{
    f.status=v;
    if(v==='Gönderildi'&&!f.sentDate){f.sentDate=today();fSentDate.value=today();}
    if(v!=='Gönderildi'&&f.sentDate===today()){f.sentDate='';fSentDate.value='';}
  });
  const fAmt=inp('0',f.amount,v=>f.amount=v,'number');
  const fCreated=inp('',f.createdAt,v=>f.createdAt=v,'date');
  const fValid=inp('',f.validUntil,v=>f.validUntil=v,'date');
  const fNotes=h('textarea',{placeholder:'Notlar...',style:{width:'100%',padding:'9px 12px',background:G,border:`1px solid ${G4}`,borderRadius:'8px',color:T1,fontSize:'13px',minHeight:'55px',resize:'vertical',boxSizing:'border-box',fontFamily:"'DM Sans',sans-serif"}},f.notes||'');
  fNotes.addEventListener('input',e=>f.notes=e.target.value);
  const content = h('div',{},
    field('Fırsat Başlığı *',fTitle),
    row(field('Müşteri',fCust,true),field('Fırsat',fOpp,true)),
    row(field('Hazırlayan *',prepContainer,true),field('Durum',fSt,true)),
    row(field('Tutar (€)',fAmt,true),field('Talep Tarihi',fCreated,true)),
    row(field('Dead Line',fValid,true),field('Gönderilme Tarihi',fSentDate,true)),
    field('Notlar',fNotes),
    h('div',{style:{display:'flex',gap:'10px'}},
      btn('Kaydet',()=>{if(f.title&&f.preparedBy){if(f.status==='Gönderildi'&&!f.sentDate)f.sentDate=today();saveProp({...f,amount:Number(f.amount)||0},!!item);}},'linear-gradient(135deg,#3b82f6,#6366f1)','#fff','11px 16px',{flex:'1',fontSize:'14px'}),
      btn('İptal',()=>setState({modal:null}),'#21262d','#8b949e','11px 20px',{fontSize:'14px'})
    )
  );
  return modal(item?'Teklifi Düzenle':'Yeni Teklif', content, ()=>setState({modal:null}), '680px');
}

function buildServModal(item) {
  const f = item ? JSON.parse(JSON.stringify(item)) : {jobName:'',customerId:'',preparedBy:'',serviceContact:'',amount:'',status:'Gönderildi',createdAt:today(),validUntil:'',appointmentDate:'',notes:'',tenderRef:''};
  const custOpts = [{v:'',l:'Seçin…'},...[...state.customers].sort((a,b)=>(a.firmName||'').localeCompare(b.firmName||'','tr')).map(c=>({v:c.id,l:c.firmName}))];
  const fJob=inp('İşin adını girin',f.jobName,v=>f.jobName=v);
  const fCust=sel(custOpts,f.customerId,v=>f.customerId=v);
  const _staff=state.users.filter(u=>u.active!==false).map(u=>u.displayName).sort((a,b)=>a.localeCompare(b,'tr'));
  const _staffOpts=cur=>{var n=_staff.slice();if(cur&&n.indexOf(cur)<0)n.unshift(cur);return [{v:'',l:'-- Seçin --'},...n.map(x=>({v:x,l:x}))];};
  const fPrep=sel(_staffOpts(f.preparedBy),f.preparedBy,v=>f.preparedBy=v);
  const fContact=sel(_staffOpts(f.serviceContact),f.serviceContact,v=>f.serviceContact=v);
  const fAmt=inp('0',f.amount,v=>f.amount=v,'number');

// Çok-sistemli periyodik bakım editörü (NFPA iç-içe zamanlama).
const MT_FREQ_OPTS = [{v:'',l:'-- Periyot --'},{v:'aylik',l:'Aylık'},{v:'3aylik',l:'3 Aylık'},{v:'6aylik',l:'6 Aylık'},{v:'yillik',l:'Yıllık'}];
function maintHasSystems(m){ return !!(m && Array.isArray(m.mtSystems) && m.mtSystems.length); }
// Tarayıcı tarih alanı yazarken ara-değer (ör. yıl "0020") üretebilir; bu, ISO formatı
// geçerli görünse de mantıksız yıllarla (1920 vb.) devasa/anlamsız program listeleri
// üretmesin diye makul bir aralıkla sınırlanır.
function _isSaneISODate(iso){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  var y = parseInt(iso.slice(0,4),10);
  return y>=2015 && y<=2100;
}
// Periyodik bakım sözleşmesi en fazla 1 yıl geçerlidir — bitiş tarihi daha ileri
// girilse bile program bir yılı aşmaz (aylık en fazla 12, 3 aylık en fazla 4,
// 6 aylık en fazla 2, yıllık en fazla 1 bakım üretir).
function mtGenerateSchedule(baseISO, endISO, freq){
  var m = mtFreqMonths(freq);
  if(!_isSaneISODate(baseISO) || !_isSaneISODate(endISO) || !m) return [];
  var oneYearCap = _addMonth(baseISO, 12);
  var cappedEnd = endISO < oneYearCap ? endISO : oneYearCap;
  var out = []; var cur = _addMonth(baseISO, m); var guard = 0;
  while(cur && cur <= cappedEnd && guard < 12){ out.push(cur); cur = _addMonth(cur, m); guard++; }
  return out;
}

// Bir bakım kaydına bağlı tek "kayan" görevi (varsa) senkronlar: oluştur/güncelle,
// vade değiştiyse yeniden aç, ilgili kişi değiştiyse otomatik devret + bildir.
function maintTaskId(m){ return 'auto_maint_'+m.id; }
// Sıradaki vadeye denk gelen sistem(ler)in kaçıncı bakım olduğunu etiketler (ör. "3. Bakım").
// Program (mtEndDate) girilmemiş kayıtlarda etiket üretilmez (geri uyumlu).
function maintOccurrenceLabel(m){
  const due = (m.mtSystems||[]).filter(s=>s.due && s.due===m.mtNextDue);
  const labels = [];
  due.forEach(s=>{
    const schedule = mtGenerateSchedule(m.mtBaseDate, m.mtEndDate, s.freq);
    if(schedule.length) labels.push(((s.doneCount||0)+1)+'. Bakım');
  });
  return [...new Set(labels)].join(' + ');
}
// Çok sistemli bakım kayıtları için "kaçıncı bakım" ilerleme özeti — programsız
// (mtEndDate girilmemiş) veya sistemsiz (legacy) kayıtlarda null döner; o durumda
// çağıran taraf eski elle-seçilen Durum rozetini kullanmaya devam eder.
function maintProgressLabel(m){
  if(!maintHasSystems(m)) return null;
  const totals = m.mtSystems.map(s=>{
    const schedule = mtGenerateSchedule(m.mtBaseDate, m.mtEndDate, s.freq);
    return schedule.length ? {doneCount:(s.doneCount||0), total:schedule.length} : null;
  }).filter(Boolean);
  if(!totals.length) return null;
  const total = Math.max(...totals.map(t=>t.total));
  const allDone = totals.every(t=>t.doneCount>=t.total);
  if(allDone) return {text: total+'/'+total+' Tamamlandı', color:'#16a34a', done:true};
  // Sıradaki (henüz tamamlanmamış) bakımın kaçıncı olduğu — aşağıdaki numaralı
  // listedeki "N. Bakım" etiketiyle birebir aynı sayı, karışıklık olmasın diye.
  const occ = Math.max(...totals.filter(t=>t.doneCount<t.total).map(t=>t.doneCount+1));
  const nextDue = mtRecordNextDue(m.mtSystems);
  return {text: occ+'/'+total+'. Bakım · '+(nextDue?_toTR(nextDue):'-'), color:'#d97706', done:false};
}
async function maintSyncTask(m){
  try{
    const existing = (state.tasks||[]).map(normTask).find(t=>t.id===maintTaskId(m));
    if(!m.mtNextDue){
      if(existing && !taskIsClosed(existing)){
        await personelSaveDoc('tasks', Object.assign({}, existing, {status:'tamamlandi', completedAt:today()}));
      }
      return;
    }
    const person = personelPeople().find(u=>u.displayName===m.serviceContact);
    const dept = person ? person.department : '';
    const cust = (state.customers||[]).find(c=>c.id===m.customerId);
    const occ = maintOccurrenceLabel(m);
    const title = '🔁 Periyodik Bakım'+(occ?(' ('+occ+')'):'')+': '+((cust&&cust.firmName)||'Müşteri')+' — '+(m.jobName||'Bakım');
    if(!existing){
      if(!m.serviceContact) return;
      const t = normTask({
        id: maintTaskId(m), title, desc:'Planlı periyodik bakımı gerçekleştir ve tamamla.',
        assignedTo:m.serviceContact, department:dept,
        assignedBy:'sistem', context:'bakim', linkType:'maintenance', linkId:m.id, linkLabel:m.jobName||'',
        dueDate:m.mtNextDue, dueTime:'', startDate:'', status:'yapilacak', completedAt:null, priority:'orta',
        needsApproval:false, revisionCount:0, assignmentHistory:[], comments:[],
        autoGenerated:true, createdBy:'sistem', createdAt:today(), fiscalYear:activeFiscalYear()
      });
      await personelSaveDoc('tasks', t);
      return;
    }
    let next = Object.assign({}, existing, {title, department:dept});
    const dueChanged = existing.dueDate !== m.mtNextDue;
    if(dueChanged){ next.dueDate = m.mtNextDue; next.status = 'yapilacak'; next.completedAt = null; }
    if(m.serviceContact && existing.assignedTo !== m.serviceContact){
      const hist = (existing.assignmentHistory||[]).concat([{from:existing.assignedTo, to:m.serviceContact, at:today(), by:'sistem', reason:'sistem', note:'İlgili kişi bakım kaydında değiştirildi.'}]);
      next.assignedTo = m.serviceContact;
      next.assignmentHistory = hist;
      await personelSaveDoc('tasks', next);
      showNotification('task_reassign_'+next.id, '↪ Yeni görev', (next.title||'Görev')+' size devredildi.', 'info', m.serviceContact);
      return;
    }
    if(dueChanged || next.title!==existing.title || next.department!==existing.department){
      await personelSaveDoc('tasks', next);
    }
  }catch(e){ /* sessiz — görev senkronu ana CRM akışını etkilemez (personelAutoGenerateTasks deseniyle tutarlı) */ }
}
// maintenances koleksiyonuna yazan TÜM yollar bunu kullanır — saveDoc + state + görev senkronu tek yerde.
async function persistMaint(data){
  await saveDoc('maintenances', data.id, data);
  const exists = state.maintenances.some(x=>x.id===data.id);
  const list = exists ? state.maintenances.map(x=> x.id===data.id ? data : x) : [...state.maintenances, data];
  setState({maintenances:list});
  await maintSyncTask(data);
  return data;
}
// Ziyareti tamamla: vadesi gelen sistemleri birlikte ileri sar (kendi periyodu kadar).
async function maintVisitDone(m){
  if(!maintHasSystems(m)){ showToast('⚠️ Önce sistem ve periyot ekleyin.','#d97706'); return; }
  const recordDue = mtRecordNextDue(m.mtSystems);
  if(!recordDue){ showToast('⚠️ Geçerli vade bulunamadı.','#d97706'); return; }
  if(!clHasFreshCompleted('maintenance', m.id, m.mtLastDone||'')){ showToast('⚠️ Bu ziyaret için önce NFPA Checklist doldurulup personel+müşteri imzasıyla tamamlanmalı.','#d97706'); return; }
  const dueList = mtSystemsDueOn(m.mtSystems, recordDue);
  const names = dueList.map(s=>SYS_META[s.sysKey]?SYS_META[s.sysKey].l:s.sysKey).join(', ');
  const note = prompt('Ziyaret tamamlandı ('+_toTR(recordDue)+')\nServis edilen sistemler: '+names+'\n\nYapılan işlem / not (opsiyonel):', '');
  if(note===null) return;
  const me = (state.currentUser && state.currentUser.displayName) || '';
  const advanced = mtCompleteVisit(m.mtSystems, recordDue, m.mtBaseDate, m.mtEndDate);
  const nextDue = mtRecordNextDue(advanced);
  const hist = [...maintHistory(m), {at:recordDue, by:me, note:note||'', systems:names}];
  const data = {...m, mtSystems:advanced, mtHistory:hist, mtNextDue:nextDue, mtLastDone:recordDue, status:'Hizmet Henüz Verilmedi', ...stamp()};
  setState({saving:true});
  await persistMaint(data);
  setState({modal:null, saving:false});
  showToast('✅ Ziyaret tamamlandı — sonraki vade: '+(nextDue?_toTR(nextDue):'-'));
}
// Devam eden (zaten süregelen) bakım işleri için geçmişe dönük, elle tarihli kayıt ekler.
// Vade/programı etkilemez — yalnızca geçmiş ziyaret logunu (mtHistory) besler.
async function maintAddManualHistory(m, f){
  const systems = (f&&f.mtSystems)||[];
  const namedSystems = systems.map((s,i)=>({idx:i, sys:s, label: SYS_META[s.sysKey]?SYS_META[s.sysKey].l:(s.sysKey||('Sistem '+(i+1)))}));
  let target = null;
  if(namedSystems.length===1){
    target = namedSystems[0];
  } else if(namedSystems.length>1){
    const listStr = namedSystems.map((n,idx)=>(idx+1)+') '+n.label).join('\n');
    const pick = prompt('Hangi sistem için geçmiş kayıt eklenecek?\n'+listStr+'\n\nNumara girin:', '1');
    if(pick===null) return;
    const pickIdx = parseInt(pick.trim(),10)-1;
    if(!(pickIdx>=0 && pickIdx<namedSystems.length)){ showToast('⚠️ Geçersiz seçim.','#d97706'); return; }
    target = namedSystems[pickIdx];
  }

  const sys = target ? target.sys : null;
  const schedule = sys ? mtGenerateSchedule(f.mtBaseDate, f.mtEndDate, sys.freq) : [];

  let occurrence = null;
  let plannedDate = '';
  if(sys && schedule.length){
    const doneCount = sys.doneCount||0;
    if(doneCount>=schedule.length){ showToast('⚠️ Bu sistemin tüm planlanan bakımları zaten tamamlanmış.','#d97706'); return; }
    const optsStr = schedule.map((d,idx)=> idx>=doneCount ? (idx+1)+') '+_toTR(d) : null).filter(Boolean).join('\n');
    const pickN = prompt('Kaçıncı bakım tamamlandı?\n'+optsStr+'\n\nNumara girin:', String(doneCount+1));
    if(pickN===null) return;
    occurrence = parseInt(pickN.trim(),10);
    if(!(occurrence>=doneCount+1 && occurrence<=schedule.length)){ showToast('⚠️ Geçersiz bakım numarası.','#d97706'); return; }
    plannedDate = schedule[occurrence-1];
  }

  const dateStr = prompt('Gerçekleşen ziyaret tarihi (GG.AA.YYYY):', plannedDate ? _toTR(plannedDate) : _toTR(today()));
  if(dateStr===null) return;
  const iso = _toISO(dateStr.trim());
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)){ showToast('⚠️ Geçersiz tarih formatı. GG.AA.YYYY girin.','#d97706'); return; }

  const label = target ? target.label : '-';
  const note = prompt('Yapılan işlem / not (opsiyonel) — Sistem: '+label, '');
  if(note===null) return;

  const mtSystems = sys ? systems.map((s,i)=> i===target.idx ? Object.assign({}, s, {
    doneCount: occurrence!==null ? occurrence : (s.doneCount||0),
    due: (occurrence!==null && schedule.length) ? (schedule[occurrence]||'') : s.due,
    lastDone: iso
  }) : s) : systems;

  const me = (state.currentUser && state.currentUser.displayName) || '';
  const hist = [...maintHistory(m), {at:iso, by:me, note:note||'', systems:label, occurrence: occurrence||null}];
  const data = {...m, mtSystems, mtHistory:hist, mtNextDue: sys ? mtRecordNextDue(mtSystems) : m.mtNextDue, ...stamp()};
  await persistMaint(data);
  setState({modal:null});
  showToast('✅ Geçmiş kayıt eklendi: '+_toTR(iso));
}
