// ═══════════════════════════════════════════════════════
// PERSONEL MODÜLÜ (Faz 1) — Görev / Performans / Prim
// ═══════════════════════════════════════════════════════
function _pInPeriod(s, period){ return !!s && String(s).slice(0,7)===period; }
// YTD (yıl başından dönem sonuna): aynı yıl + dönem ayına kadar (dahil).
function _pYtdInPeriod(s, period){
  if(!s) return false;
  const ss = String(s).slice(0,7);
  return ss.slice(0,4)===String(period).slice(0,4) && ss <= period;
}
// Dönemin ay numarası (1-12) — yıllık hedefi orantılamak için (pace = yıllık × ay/12).
function _monthNum(period){ return Number(String(period).slice(5,7))||0; }
function _pOppDate(o){ return o.wonAt||o.closedAt||o.updatedAt||o.dueDate||o.createdAt; }
// ── Mali yıl (FY) atıf yardımcıları — prim/hedef yıl bazlı hesaplanır ──
function _periodYear(period){ return Number(String(period).slice(0,4))||0; }
function _quarterOfMonth(m){ return Math.floor(((Number(m)||1)-1)/3)+1; }   // 1..4
function _periodQuarter(period){ return _quarterOfMonth(_monthNum(period)); }
// Yılın geçen kısmı (0..1] — operasyonel/karlılık primini zamana orantılamak için.
function _elapsedFrac(period){ return Math.min(1, Math.max(0, _monthNum(period)/12)); }
// Bir fırsatın ait olduğu mali yıl: manuel devir varsa o (fiscalYear), yoksa kapanış tarihinin yılı.
function _pOppFY(o){ return o && o.fiscalYear ? Number(o.fiscalYear) : (_periodYear(_pOppDate(o))||0); }
// YTD ay konumu: manuel devirle başka yıldan taşındıysa yıl başından (1) sayılır, aksi halde kapanış ayı.
function _pOppFYMonth(o){
  const d=String(_pOppDate(o)||''); const cy=Number(d.slice(0,4))||0; const cm=Number(d.slice(5,7))||0;
  if(o && o.fiscalYear && cy!==Number(o.fiscalYear)) return 1;
  return cm;
}
// Fırsat, period'un mali yılında ve YTD penceresinde (yıl başı→dönem ayı) kazanıldı mı?
function _pWonYtd(o, period){
  return _pOppFY(o)===_periodYear(period) && _pOppFYMonth(o)>0 && _pOppFYMonth(o)<=_monthNum(period);
}
function _pIsDone(status){ return ['tamam','Tamamlandı','Yapıldı','Onaylandı','Kapandı','Çözüldü'].includes(status); }
function _pIsOverdue(rec){
  const d = rec.dueDate; if(!d) return false;
  if(_pIsDone(rec.status)) return false;
  return String(d) < today();
}
function personelPeople(){
  return (state.users||[]).filter(u=>u.active!==false && u.department);
}
function personelTaskStats(name, period, ytd){
  const win = ytd ? _pYtdInPeriod : _pInPeriod;
  const fy = _periodYear(period);
  const ts = (state.tasks||[]).map(normTask)
    .filter(t=>recFY(t)===fy && t.assignedTo===name && (win(t.dueDate,period)||win(t.completedAt,period)));
  const total = ts.length;
  const done = ts.filter(t=>taskIsClosed(t)).length;
  // Performans sebebiyle bu kişinin elinden alınmış görevler → negatif sinyal
  const takenAway = (state.tasks||[]).map(normTask).filter(t=>recFY(t)===fy &&
    (t.assignmentHistory||[]).some(h=>h.from===name && h.reason==='performans')).length;
  const denom = total + takenAway;
  return { total, done, takenAway, ratio: denom? done/denom : 0 };
}
// Zamanında teslim oranı — tamamlanan görevlerin vadesinde kapatılma oranı (tamamlama ≠ zamanında)
function personelTaskPunctual(name, period, ytd){
  const win = ytd ? _pYtdInPeriod : _pInPeriod;
  const fy = _periodYear(period);
  const ts = (state.tasks||[]).map(normTask)
    .filter(t=>recFY(t)===fy && t.assignedTo===name && (win(t.dueDate,period)||win(t.completedAt,period)));
  if(!ts.length) return null;
  const onTime = ts.filter(t=>{
    if(!taskIsClosed(t)) return false;
    if(!t.dueDate) return true;
    const doneD = String(t.completedAt||today()).slice(0,10);
    const dueD = String(t.dueDate).slice(0,10);
    if(doneD!==dueD) return doneD < dueD ? true : doneD===dueD;
    if(t.dueTime && t.completedAt && String(t.completedAt).length>10){
      return String(t.completedAt).slice(11,16) <= t.dueTime;
    }
    return true;
  }).length;
  return onTime/ts.length;
}
// Doğruluk = ilk seferde onaylanan / (onaylanan + revizyona düşen), yalnız onay gerektiren görevler.
// Performans sebebiyle elinden alınanlar da payda tarafına eklenir (kalite düşürücü).
function personelTaskDogruluk(name, period){
  const fy = _periodYear(period);
  const ts = (state.tasks||[]).map(normTask).filter(t=>recFY(t)===fy && t.assignedTo===name && t.needsApproval);
  const approvedClean = ts.filter(t=>t.status==='onaylandi' && (t.revisionCount||0)===0).length;
  const reviseCount = ts.reduce((a,t)=>a+(t.revisionCount||0),0);
  const takenAway = (state.tasks||[]).map(normTask).filter(t=>recFY(t)===fy &&
    (t.assignmentHistory||[]).some(h=>h.from===name && h.reason==='performans')).length;
  const denom = approvedClean + reviseCount + takenAway;
  if(denom===0) return null;
  return approvedClean/denom;
}
// ON-TRACK oranı döndürür (prim GEÇİŞ eşiği + performans göstergesi için).
//  • Hedef kriterleri (birey/şirket): pace bazlı = YTD kazanılan ÷ (yıllık × geçen ay/12) → "ilerlemede miyim".
//  • Karlılık: YTD kümülatif blended marj ÷ hedef marj (zaman-bağımsız oran).
//  • Operasyonel kriterler: YTD penceresinde oran (tek ay değil — kümülatif istikrar).
// NOT: Prim TUTARI bu oranı DEĞİL, yıllık kümülatif kazanımı kullanır (personelAnnualRatio + personelPrim).
function personelAutoMetric(kod, name, period, dept){
  const ytd = s=>_pYtdInPeriod(s,period);              // yıl başından döneme kümülatif pencere
  const mNum = _monthNum(period)||1;
  const T = targetsForYear(_periodYear(period));        // dönemin mali yılının hedefleri (FY-aware)
  const O=(state.opportunities||[]), P=(state.proposals||[]), M=(state.maintenances||[]);
  const SO=(state.serviceOpps||[]), V=(state.visits||[]), A=(state.appointments||[]);
  switch(kod){
    case 'sirket_hedef': {
      const annual = Number(T.company)||0;
      if(!annual) return null;
      const paceTarget = annual * mNum/12;               // pace = yıllığın geçen aya düşen kısmı (on-track)
      if(!paceTarget) return null;
      const won = O.filter(o=>o.stage==='KAZANILDI'&&_pWonYtd(o,period)).reduce((a,o)=>a+(Number(o.value)||0),0);
      return Math.min(won/paceTarget,1.5);
    }
    case 'birey_hedef': {
      const annual = Number(T.reps && T.reps[name])||0;
      if(!annual) return null;
      const paceTarget = annual * mNum/12;
      if(!paceTarget) return null;
      const won = O.filter(o=>o.assignedTo===name&&o.stage==='KAZANILDI'&&_pWonYtd(o,period)).reduce((a,o)=>a+(Number(o.value)||0),0);
      return Math.min(won/paceTarget,1.5);
    }
    case 'karlilik': {
      // YTD kümülatif blended marj (ΣYTD kâr ÷ ΣYTD ciro) ÷ hedef marj %. Aylık %'leri ORTALAMAK yanlıştır.
      const cum = _cumMarginPct(name, period);
      const targetPct = Number(T.profitReps && T.profitReps[name]) || 0;
      if(cum==null || !targetPct) return null;
      return Math.min(cum/targetPct, 1.5);
    }
    case 'teklif_takip': {
      // Teklif kayıtlarında sahibi 'preparedBy', vadesi 'validUntil'dır (assignedTo/dueDate yok).
      const isFinal = s => s==='Onaylandı' || s==='Reddedildi';
      const ps = P.filter(p=>p.preparedBy===name && (ytd(p.createdAt||p.sentDate||p.updatedAt) || !isFinal(p.status)));
      if(!ps.length) return null;
      const overdue = ps.filter(p=>!isFinal(p.status) && p.validUntil && String(p.validUntil).slice(0,10) < today()).length;
      return Math.max(0, 1 - overdue/ps.length);
    }
    case 'aktivite': {
      // YTD toplam aktivite ÷ (aylık 20 hedef × geçen ay) = aylık ortalama aktivite oranı.
      const v = V.filter(x=>x.assignedTo===name&&ytd(x.date||x.visitDate||x.createdAt)).length;
      const a = A.filter(x=>x.assignedTo===name&&ytd(x.date||x.datetime||x.createdAt)).length;
      const no = O.filter(o=>o.assignedTo===name&&ytd(o.createdAt)).length;
      return Math.min((v+a+no)/(20*mNum),1.5);
    }
    case 'hedefe_yonelim': {
      const os = O.filter(o=>o.assignedTo===name&&ytd(o.createdAt));
      if(!os.length) return null;
      const secs = (state.strategy && state.strategy.targetSectors) || DEFAULT_STRATEGY.targetSectors;
      const good = os.filter(o=>secs.indexOf(o.sector)>=0).length;
      return good/os.length;
    }
    case 'periyodik_bakim': {
      const ms = M.filter(m=>m.assignedTo===name&&ytd(m.dueDate||m.nextDate||m.date));
      if(!ms.length) return null;
      return ms.filter(m=>_pIsDone(m.status)).length/ms.length;
    }
    case 'acik_servis': {
      const ss = SO.filter(s=>s.assignedTo===name&&ytd(s.dueDate||s.createdAt||s.date));
      if(!ss.length) return null;
      const over = ss.filter(s=>_pIsOverdue(s)).length;
      return Math.max(0, 1 - over/ss.length);
    }
    case 'cozum_suresi': {
      const ss = SO.filter(s=>s.assignedTo===name&&ytd(s.dueDate||s.createdAt||s.date));
      if(!ss.length) return null;
      return ss.filter(s=>_pIsDone(s.status)).length/ss.length;
    }
    case 'gorev_dogruluk':
      return personelTaskDogruluk(name, period);
    // Görev tamamlama oranı (tamamlanan/toplam) — YTD kümülatif
    case 'gorev':
    case 'is_emri': {
      const st = personelTaskStats(name,period,true);
      return st.total? st.ratio : null;
    }
    // Zamanında teslim / kilometre taşı / raporlama — vadesinde kapatma oranı (YTD kümülatif)
    case 'zamaninda_teslim':
    case 'km_tasi':
    case 'raporlama':
      return personelTaskPunctual(name, period, true);
    // Keşif/teklif hazırlama süresi — bu kişiye ait tekliflerin zamanında (gecikmesiz) hazırlanma oranı
    case 'kesif_sure': {
      const isFinal = s => s==='Onaylandı' || s==='Reddedildi';
      const ps = P.filter(p=>p.preparedBy===name && (ytd(p.createdAt||p.sentDate||p.updatedAt) || !isFinal(p.status)));
      if(!ps.length) return null;
      const overdue = ps.filter(p=>!isFinal(p.status) && p.validUntil && String(p.validUntil).slice(0,10) < today()).length;
      return Math.max(0, 1 - overdue/ps.length);
    }
    default: {
      const st = personelTaskStats(name,period,true);
      return st.total? st.ratio : null;
    }
  }
}
// YILLIK hedefe göre HAM (tavansız) gerçekleşme oranı — prim KAZANIMI ve AŞIMI bunu kullanır.
// Yalnızca hedef (birey/şirket) ve karlılık için anlamlı; diğerlerinde null (bunlar oran×elapsed ile hesaplanır).
function personelAnnualRatio(kod, name, period){
  const T = targetsForYear(_periodYear(period));
  if(kod==='birey_hedef' || kod==='sirket_hedef'){
    const annual = kod==='birey_hedef' ? (Number(T.reps&&T.reps[name])||0) : (Number(T.company)||0);
    if(!annual) return null;
    const won = (state.opportunities||[]).filter(o=>(kod==='sirket_hedef'||o.assignedTo===name)&&o.stage==='KAZANILDI'&&_pWonYtd(o,period)).reduce((a,o)=>a+(Number(o.value)||0),0);
    return won/annual;
  }
  if(kod==='karlilik'){
    const targetPct = Number(T.profitReps&&T.profitReps[name])||0;
    const cum = _cumMarginPct(name, period);
    if(!targetPct || cum==null) return null;
    return cum/targetPct;
  }
  return null;
}
function personelEvalFor(name, period){
  return (state.evaluations||[]).find(e=>e.personName===name && e.period===period) || null;
}
function personelCritOran(c, name, period, dept, ev){
  if(c.auto) return personelAutoMetric(c.kod, name, period, dept);
  // Manuel kriter: yönetici o kritere değer girdiyse onu kullan
  if(ev && ev.criteria && typeof ev.criteria[c.kod]==='number') return ev.criteria[c.kod];
  // "yonetici" kalemi Yönetici Puanı (1-5) ile beslenir; diğer manuel kriterler girilene kadar hesap dışıdır
  if(c.kod==='yonetici'){ const ms = ev && ev.managerScore; return ms ? ms/5 : null; }
  return null;
}
function personelScore(person, period){
  const dept = person.department;
  const cfg = (state.evalConfig && state.evalConfig[dept]) || DEFAULT_EVAL_CONFIG[dept];
  if(!cfg) return null;
  const ev = personelEvalFor(person.displayName, period);
  const rows = cfg.criteria.map(c=>({ ...c, oran: personelCritOran(c, person.displayName, period, dept, ev) }));
  const avail = rows.filter(r=>r.oran!==null && r.oran!==undefined);
  const wsum = avail.reduce((a,r)=>a+(Number(r.weight)||0),0) || 1;
  const skor = avail.reduce((a,r)=>a+(r.weight/wsum)*r.oran, 0);
  return { dept, cfg, ev, rows, avail, wsum, skor, managerScore: (ev&&ev.managerScore)||0 };
}
// ÇEYREKLİK PRİM MOTORU — yıllık hedefe göre kümülatif hak ediş, çeyreklik ödeme.
//  • Geçiş kapısı (pass): PACE skoru (sc.skor) ≥ eşik → dönem sonunda hedefe gidişat yeterli mi?
//  • Hak ediş TUTARI: YILLIK kümülatif orana göre (pace DEĞİL). Yıl ilerledikçe birikir.
//      - hedef (birey/şirket): kazanım = min(yıllıkOran, 1)                → yıllık gerçekleşmenin doğrudan payı
//      - karlılık            : kazanım = min(marjOran, 1) × geçenSüre       → oran birikmez, süreye yayılır
//      - operasyonel/manuel  : kazanım = min(oran, 1) × geçenSüre           → aynı mantık
//  • Aşım (over): YALNIZCA Q4'te (yıl kapanışında) ve yalnızca yıllık hedefi AŞAN (oran>1) birey/karlılıkta.
//  • Bu çeyrek ödenecek = max(0, yılBaşındanHakEdilen − buÇeyrektenÖnceÖdenen)  → NEGATİF ödeme yok, fazlası devreder.
function personelPrim(person, period){
  const sc = personelScore(person, period);
  if(!sc) return null;
  const name = person.displayName;
  const cfg = sc.cfg;
  const base = cfg.primBase||0;               // Tüm kriterler %100 karşılandığında hak edilen TOPLAM yıllık taban prim.
  const pass = sc.skor >= (cfg.threshold||0); // Eşik altında prim oluşmaz (PACE skoru — hedefe gidişat).
  const overCap = Number(cfg.overCap)||1.5;   // Aşım tavanı: oran en çok bu kadar sayılır (örn. 1.5 = %150).
  const overAccel = (cfg.overAccel!=null?Number(cfg.overAccel):1); // İvme: aşımın ödüllendirme çarpanı.
  const OVER_KODS = ['birey_hedef','karlilik']; // Aşım primi YALNIZCA bireysel hedef ve karlılıkta çalışır.
  const GOAL_KODS = ['birey_hedef','sirket_hedef']; // Yıllık kümülatif hedef kriterleri (elapsed uygulanmaz).
  const year = _periodYear(period);
  const quarter = _periodQuarter(period);
  const elapsed = _elapsedFrac(period);       // geçenSüre = ay/12
  const isQ4 = quarter === 4;

  const breakdown = {};
  let primRatio = 0, overRatio = 0;
  sc.avail.forEach(r=>{
    const wshare = r.weight/sc.wsum;
    let kazanim;
    if(GOAL_KODS.indexOf(r.kod)>=0){
      const ar = personelAnnualRatio(r.kod, name, period);
      kazanim = Math.min(ar!=null?ar:(Number(r.oran)||0), 1);      // hedef: yıllık kümülatif, elapsed YOK
    } else if(r.kod==='karlilik'){
      const ar = personelAnnualRatio('karlilik', name, period);
      kazanim = Math.min(ar!=null?ar:(Number(r.oran)||0), 1) * elapsed; // marj: oran×süre
    } else {
      kazanim = Math.min(Number(r.oran)||0, 1) * elapsed;          // operasyonel/manuel: oran×süre
    }
    primRatio += wshare * kazanim;
    breakdown[r.kod] = pass ? base * wshare * kazanim : 0;
    // AŞIM: yalnız Q4 + yıllık hedefi aşan birey/karlılık
    if(isQ4 && OVER_KODS.indexOf(r.kod)>=0){
      const ar = personelAnnualRatio(r.kod, name, period);
      if(ar!=null && ar>1){
        overRatio += wshare * (Math.min(ar, overCap) - 1) * overAccel;
      }
    }
  });

  const baseAmount = pass ? base*primRatio : 0;   // yıl başından hak edilen TABAN (kümülatif)
  const overAmount = pass ? base*overRatio : 0;   // yıl kapanışı aşım primi
  const earnedToDate = baseAmount + overAmount;   // yıl başından bu döneme kadar TOPLAM hak ediş
  const paidBefore = _paidBeforeQuarter(year, name, quarter); // bu çeyrekten önce ödenen (ledger)
  const thisQuarterPayable = Math.max(0, earnedToDate - paidBefore); // NEGATİF ödeme yok
  const carry = paidBefore > earnedToDate ? (paidBefore - earnedToDate) : 0; // fazla avans → sonraki çeyreğe devir
  const primAmount = earnedToDate;                // geriye dönük uyum: primAmount = toplam hak ediş
  return { ...sc, pass, accel:1, name, year, quarter, elapsed, isQ4,
    primRatio, overRatio, baseAmount, overAmount, breakdown,
    earnedToDate, paidBefore, thisQuarterPayable, carry, primAmount };
}
// Rapor için rakamsal Hedef/Gerçekleşen değerleri (YTD) — yalnızca satış/karlılık kriterleri.
// Diğer kriterlerde null döner → tablo '—' gösterir.
function personelCritNumbers(kod, name, period){
  const O=(state.opportunities||[]);
  const T=targetsForYear(_periodYear(period));  // dönemin YILINA ait hedefler
  if(kod==='birey_hedef' || kod==='sirket_hedef'){
    const annual = kod==='birey_hedef'
      ? Number(T.reps && T.reps[name])||0
      : Number(T.company)||0;
    if(!annual) return null;
    // Kümülatif model: hedef = YILLIK, gerçekleşen = yıl başından bugüne (YTD).
    const won = O.filter(o=>(kod==='sirket_hedef'||o.assignedTo===name)&&o.stage==='KAZANILDI'&&_pWonYtd(o,period)).reduce((a,o)=>a+(Number(o.value)||0),0);
    const kalanVal = annual - won;
    return {
      hedef: eur(annual)+' <span style="color:#94a3b8;font-size:10px">/yıl</span>',
      hedefTable: eur(annual)+' <span style="color:#94a3b8;font-size:10px">/yıl</span>',
      gerc: eur(won)+' <span style="color:#94a3b8;font-size:10px">YTD</span>',
      kalan: kalanVal>0 ? eur(kalanVal) : '<span style="color:#16a34a;font-weight:700">✓ Tamamlandı</span>' };
  }
  if(kod==='karlilik'){
    const cum = _cumMarginPct(name, period);   // yıl başından kümülatif harmanlanmış marj (%)
    const targetPct = Number(T.profitReps && T.profitReps[name]) || 0;
    if(!targetPct) return null;
    const kalan = cum==null ? '—' : (cum>=targetPct ? '<span style="color:#16a34a;font-weight:700">✓ Tamamlandı</span>' : '%'+(Math.round((targetPct-cum)*10)/10));
    return { hedef: '%'+targetPct+' marj', hedefTable: '%'+targetPct+' marj', gerc: cum==null?'—':'%'+(Math.round(cum*10)/10)+' marj <span style="color:#94a3b8;font-size:10px">YTD</span>', kalan };
  }
  return null;
}
// Bir dönemden (YYYY-MM) geriye doğru n ay listesi (trend grafiği için).
function _prevPeriods(period, n){
  const parts = String(period).split('-'); let y=Number(parts[0]), m=Number(parts[1]); const out=[];
  for(let i=0;i<n;i++){ out.unshift(y+'-'+String(m).padStart(2,'0')); m--; if(m<1){ m=12; y--; } }
  return out;
}
// Belirli bir ayda personelin sistemde aktivitesi (iş verisi) olup olmadığını döndürür.
// Trend grafiğinde "veri yok" ile "%0 başarı" ayrımı için kullanılır.
function _personelActivity(name, period){
  const inM = s=>_pInPeriod(s,period);
  const O=state.opportunities||[], P=state.proposals||[], T=state.tasks||[], V=state.visits||[], A=state.appointments||[];
  const wonY = O.some(o=>o.assignedTo===name && o.stage==='KAZANILDI' && _pYtdInPeriod(_pOppDate(o),period));
  const oppM = O.some(o=>o.assignedTo===name && inM(o.createdAt||o.updatedAt));
  const propM = P.some(p=>p.preparedBy===name && inM(p.createdAt||p.sentDate||p.updatedAt));
  const taskM = T.some(t=>t.assignedTo===name && (inM(t.dueDate)||inM(t.completedAt)||inM(t.createdAt)));
  const visitM = V.some(x=>x.assignedTo===name && inM(x.date||x.visitDate||x.createdAt));
  const apptM = A.some(x=>x.assignedTo===name && inM(x.date||x.datetime||x.createdAt));
  const evalM = (state.evaluations||[]).some(e=>e.personName===name && e.period===period);
  return wonY||oppM||propM||taskM||visitM||apptM||evalM;
}

function printPersonelReport(person, period, isAdmin){
  const sc = personelScore(person, period);
  if(!sc){ showToast('⚠ Bu personel için değerlendirme verisi yok.','#dc2626'); return; }
  const ev = personelEvalFor(person.displayName, period);
  const pct = v => (v==null? '—' : Math.round(v*100)+'%');
  const col = v => v==null?'#94a3b8':(v>=1?'#16a34a':v>=0.7?'#d97706':'#dc2626');
  const skorPct = Math.round((sc.skor||0)*100);
  const dept = DEPT_LABEL[person.department]||person.department||'-';

  // Genel değerlendirme yorumu (skora göre)
  let verdict, vColor, vBg;
  if(sc.skor>=1){ verdict='Üstün Performans — dönem hedeflerinin üzerinde sonuç üretti.'; vColor='#166534'; vBg='#dcfce7'; }
  else if(sc.skor>=0.85){ verdict='Beklentileri Karşılıyor — hedeflere büyük ölçüde ulaşıldı, birkaç alanda ivme gerekli.'; vColor='#166534'; vBg='#dcfce7'; }
  else if(sc.skor>=0.70){ verdict='Yeterli / Gelişime Açık — eşik aşıldı ancak belirgin gelişim alanları var.'; vColor='#92400e'; vBg='#fef3c7'; }
  else { verdict='Gelişim Gerekli — dönem hedeflerinin altında kalındı, aksiyon planı önerilir.'; vColor='#991b1b'; vBg='#fee2e2'; }

  // Görev dökümü (dönem içi)
  const myTasks = (state.tasks||[]).filter(t=>t.assignedTo===person.displayName && (_pInPeriod(t.dueDate,period)||_pInPeriod(t.completedAt,period)));
  const tDone = myTasks.filter(t=>t.status==='tamam').length;
  const tOpen = myTasks.filter(t=>t.status!=='tamam').length;
  const tOverdue = myTasks.filter(t=>t.status!=='tamam' && t.dueDate && String(t.dueDate)<today()).length;
  const tTotal = myTasks.length;

  const statusLabel = v => v==null?['Veri yok','#94a3b8']:(v>=1?['Güçlü','#16a34a']:v>=0.7?['Yeterli','#d97706']:['Gelişmeli','#dc2626']);
  const critRows = sc.rows.map(r=>{
    const sl = statusLabel(r.oran);
    const num = personelCritNumbers(r.kod, person.displayName, period);
    return `<tr>
      <td>${(r.auto?'⚙ ':'✎ ')+escapeHtml(r.label)}</td>
      <td style="text-align:right;white-space:nowrap">${num?(num.hedefTable||num.hedef):'<span style="color:#cbd5e1">—</span>'}</td>

      <td style="text-align:center;font-weight:700;color:${col(r.oran)}">${r.oran==null?'veri yok':pct(r.oran)}</td>
      <td style="text-align:center;font-weight:700;color:${sl[1]}">${sl[0]}</td>
    </tr>`;
  }).join('');

  // Prime dahil kazanılan projeler (dönem — YTD): satış hedefi gerçekleşmesini oluşturan kalemler.
  const wonProjects = (state.opportunities||[])
    .filter(o=>o.assignedTo===person.displayName && o.stage==='KAZANILDI' && _pYtdInPeriod(_pOppDate(o),period))
    .sort((a,b)=>String(_pOppDate(b)||'').localeCompare(String(_pOppDate(a)||'')));
  const wonTotal = wonProjects.reduce((a,o)=>a+(Number(o.value)||0),0);

    const dt = String(_pOppDate(o)||'').slice(0,10);

  const wonSection = `

  // Dönem hedefleri özeti (ana menü) — seçili ayın kümülatif (YTD) hedefleri tek bakışta.
  const _mParts = String(period).split('-');
  const _mName = (()=>{ try { return new Date(Number(_mParts[0]), Number(_mParts[1])-1, 1).toLocaleString('tr-TR',{month:'long'}); } catch(e){ return _mParts[1]; } })();
  const _mYear = _mParts[0];
  const bireyN = personelCritNumbers('birey_hedef', person.displayName, period);

      <div style="font-size:11px;color:#475569;margin-top:5px">Gerçekleşen: <b style="color:#0f172a">${n.gerc}</b> &nbsp;·&nbsp; Kalan: ${n.kalan}</div>

  const monthTargetSection = _mCards ? `
  <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:14px 16px;margin-bottom:18px">
    <div style="font-size:14px;font-weight:800;color:#1e3a8a;margin-bottom:10px">🎯 ${escapeHtml(_mYear)} Mali Yılı — Yıllık Hedef <span style="font-size:11px;font-weight:400;color:#64748b">(gerçekleşen: yıl başından ${escapeHtml(_mName)} sonuna kümülatif / YTD)</span></div>

// ═══ TEST MODU — örnek verilerle performans/prim hesabını dener, DB'ye HİÇ yazmaz ═══
function personelTestModeToggle(period){
  if(state.testMode){ personelTestModeExit(); return; }
  // Mevcut veriyi yedekle (çıkışta geri yüklenir) — yıl bazlı hedefler + kümülatif kâr/ciro dahil
  state._testBackup = {
    evaluations: JSON.parse(JSON.stringify(state.evaluations||[])),
    targetsByYear: JSON.parse(JSON.stringify(state.targetsByYear||{})),
    profitByRep: JSON.parse(JSON.stringify(state.profitByRep||{})),
    revenueByRep: JSON.parse(JSON.stringify(state.revenueByRep||{})),
  };
  const P = period || (state.personelPeriod || today().slice(0,7));
  const year = _periodYear(P) || new Date().getFullYear();
  const people = personelPeople();
  // Seçili yılın hedef objesini garanti et ve state.targets'ı ona işaretle (personelAnnualRatio aynı objeyi okur)
  if(!state.targetsByYear) state.targetsByYear = {};
  if(!state.targetsByYear[year]) state.targetsByYear[year] = _emptyTargets();
  const T = state.targetsByYear[year];
  if(!T.reps) T.reps = {}; if(!T.serviceReps) T.serviceReps = {}; if(!T.profitReps) T.profitReps = {};
  state.targets = T;
  if(!state.profitByRep) state.profitByRep = {};
  if(!state.revenueByRep) state.revenueByRep = {};
  const evals = (state.evaluations||[]).slice();
  people.forEach((u,idx)=>{
    const n = u.displayName;
    // Örnek yıllık hedefler (dönüşümlü değerler → farklı skorlar görünsün)
    T.reps[n]        = T.reps[n]        || 1200000;
    T.serviceReps[n] = T.serviceReps[n] || 300000;
    T.profitReps[n]  = T.profitReps[n]  || 20;                                     // hedef %20 marj
    // Kümülatif blended marj için örnek kâr+ciro (tek dönem yeter; _cumMarginPct aynı yıl aylarını toplar)
    const marginPct = [27.7, 18.5, 22.0, 15.0][idx%4];
    const rev = 400000;
    state.revenueByRep[n] = { [P]: rev };
    state.profitByRep[n]  = { [P]: rev*marginPct/100 };
    // Örnek yönetici puanı + manuel kriterler
    const ex = evals.find(e=>e.personName===n && e.period===P);
    const rec = ex ? {...ex, criteria:{...(ex.criteria||{})}} : { id:'test_'+idx, personName:n, department:u.department, period:P, criteria:{}, managerScore:0 };
    rec.managerScore = [4,5,3,4][idx%4];
    ['ilk_cozum','teknik_dogruluk','proje_butce','is_guvenligi','iscilik_kalite','saha_rapor','malzeme_verim','yasal_uyum','evrak_duzen','raporlama'].forEach(k=>{
      if(rec.criteria[k]==null) rec.criteria[k] = [0.9,0.75,1.0,0.85][idx%4];
    });
    const i = evals.findIndex(e=>e.personName===n && e.period===P);
    if(i>=0) evals[i]=rec; else evals.push(rec);
  });
  state.evaluations = evals;
  state.testMode = true;
  showToast('🧪 TEST MODU AÇIK — örnek veriler yüklendi, hiçbir şey kaydedilmez');
  render();
}
function personelTestModeExit(){
  const b = state._testBackup;
  if(b){ state.evaluations=b.evaluations; state.targetsByYear=b.targetsByYear; state.profitByRep=b.profitByRep; state.revenueByRep=b.revenueByRep;
    state.targets = targetsForYear(_currentFY()); }
  state._testBackup = null;
  state.testMode = false;
  showToast('✅ Test modu kapatıldı — gerçek veriler geri yüklendi');
  render();
}

//   fy = sayı → devret, null → devri geri al. Bağlantı/anahtar yoksa veya test modundaysa sessizce atlar.
//   Devir Firebase'de her hâlükârda kaydedilir; bu yalnızca kâr atfını hizalayan additive bir yan etkidir.
async function _syncQuotationFiscalYear(quotationId, fy){
  try{
    if(!quotationId || state.testMode) return { ok:true, skipped:true };
    if(typeof TEKLIF_APP_URL==='undefined' || typeof TEKLIF_API_KEY==='undefined' || !TEKLIF_API_KEY) return { ok:false };
    const res = await fetch(`${TEKLIF_APP_URL}/api/v1/crm/set-fiscal-year`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-crm-key':TEKLIF_API_KEY },
      body: JSON.stringify({ quotationId, fiscalYear: fy==null ? null : Number(fy) }),
    });
    return { ok: res.ok };
  } catch(e){ return { ok:false }; }
}

  const silent = !!(opts && opts.silent);
  const tpl = PROJECT_STAGE_TEMPLATES[stage];
  if(!tpl || !tpl.length){ if(manual) showToast('Bu aşama için şablon görev tanımlı değil.', '#d97706'); return; }
  const people = personelPeople();
  const firstInDept = dept => { const u=people.find(x=>x.department===dept); return u?u.displayName:''; };
  const existing = new Set((state.tasks||[]).map(normTask).filter(t=>t.linkType==='opportunity'&&t.linkId===o.id).map(t=>t.title));
  const toAdd = tpl.filter(x=>!existing.has(x.title)).map(x=>normTask({
    id: genId(), title:x.title, desc:'', assignedTo:firstInDept(x.dept), department:x.dept,
    assignedBy:(state.currentUser&&state.currentUser.displayName)||'', context:'proje',
    linkType:'opportunity', linkId:o.id, linkLabel:o.title||'Proje', execStage:stage,
    dueDate:_offsetDay(x.dueOffset), dueTime:'', startDate:'',
    status:'yapilacak', completedAt:null, priority:x.priority,
    needsApproval:defaultNeedsApproval('proje',x.priority), revisionCount:0, assignmentHistory:[], comments:[],
    autoGenerated:true, createdBy:'şablon', createdAt:today(), fiscalYear:activeFiscalYear()
  }));
  if(!toAdd.length){ if(manual) showToast('Bu aşamanın önerilen görevleri zaten ekli.', '#0891b2'); return; }
  if(!silent && !confirm(PROJECT_STAGE_META[stage].l+' aşaması için '+toAdd.length+' görev oluşturulsun mu?\n\n- '+toAdd.map(t=>t.title).join('\n- '))) return;
  for(const t of toAdd){ await personelSaveDoc('tasks', t); }
  showToast('✅ '+toAdd.length+' görev oluşturuldu.');
}

// Projeyi tamamen sil: fırsat kaydı + bağlı görevler (otomatik + manuel) kaldırılır.
async function projDelete(o){
  if(!confirm('Bu proje/fırsat KALICI olarak silinsin mi?\n\nFırsat kaydı ve bağlı TÜM görevler silinir. Bu işlem geri alınamaz.')) return;
  const r=await cascadeDeleteTasksFor('opportunity', o.id);
  for(const m of (r.manuals||[])){ await deleteDoc('tasks', m.id); }
  if(r.manuals && r.manuals.length) setState({tasks:(state.tasks||[]).filter(x=>!r.manuals.some(mm=>mm.id===x.id))});
  await deleteDoc('opportunities', o.id);
  setState({opportunities:(state.opportunities||[]).filter(x=>x.id!==o.id), modal:null});
  showToast('🗑 Proje silindi'+(r.deletedAuto?(' · '+r.deletedAuto+' otomatik görev'):''));
}

// Periyot seçenekleri (UI + etiket kaynağı).
const MAINT_PERIODS = [
  {v:'',       l:'Takip yok'},
  {v:'aylik',  l:'Aylık'},
  {v:'3aylik', l:'3 Aylık'},
  {v:'6aylik', l:'6 Aylık'},
  {v:'yillik', l:'Yıllık'},
  {v:'ozel',   l:'Özel (gün)'},
];
// Tarih yardımcıları — timezone-safe, baz tarihe göreli (bugüne değil).
function _ymd(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function _addDay(iso, n){ const dt=_toDate(iso); if(!dt) return ''; dt.setDate(dt.getDate()+Number(n)); return _ymd(dt); }
function _addMonth(iso, n){ const dt=_toDate(iso); if(!dt) return ''; const d0=dt.getDate(); dt.setDate(1); dt.setMonth(dt.getMonth()+Number(n)); const last=new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate(); dt.setDate(Math.min(d0, last)); return _ymd(dt); }
// Okuma-anı default'lu güvenli erişimciler (mevcut kayıtları bozmaz).
function maintPeriod(m){ return (m && m.mtPeriod) || ''; }
function maintPeriodDays(m){ return (m && Number(m.mtPeriodDays)) || 0; }
function maintNextDue(m){ return (m && m.mtNextDue) || ''; }
function maintLastDone(m){ return (m && m.mtLastDone) || ''; }
function maintHistory(m){ return (m && Array.isArray(m.mtHistory)) ? m.mtHistory : []; }
function maintIsTracked(m){ return !!(m && m.mtNextDue && (m.mtPeriod || maintHasSystems(m))); }
// Tamamlama yönlendirici: çok-sistemli → ziyaret; eski tekli → bakım.
function maintCompleteAction(m){ return maintHasSystems(m) ? maintVisitDone(m) : maintDone(m); }
function maintPeriodLabel(p){ const o=MAINT_PERIODS.find(x=>x.v===p); return o ? o.l : ''; }
// Periyot + baz tarihten sonraki vadeyi hesaplar (takvim-doğru).
function computeNextDue(baseISO, period, days){
  if(!baseISO) return '';
  switch(period){
    case 'aylik':  return _addMonth(baseISO, 1);
    case '3aylik': return _addMonth(baseISO, 3);
    case '6aylik': return _addMonth(baseISO, 6);
    case 'yillik': return _addMonth(baseISO, 12);
    case 'ozel':   return (Number(days) > 0) ? _addDay(baseISO, Number(days)) : '';
    default:       return '';
  }
}

// ── Çok-sistemli iç-içe (nested) periyodik bakım zamanlaması (NFPA) ──
// Her sistem kendi periyodunda; kayıt vadesi = en erken sistem vadesi.
// Bir ziyarette vadesi gelen tüm sistemler birlikte servis edilir; her biri
// KENDİ vadesinden (bugünden değil) bir periyot ileri sarılır → kayma olmaz.
function mtFreqMonths(freq){ return ({aylik:1,'3aylik':3,'6aylik':6,yillik:12})[freq] || 0; }
function mtSysFirstDue(baseISO, freq){ var m = mtFreqMonths(freq); return (baseISO && m) ? _addMonth(baseISO, m) : ''; }
function mtRecordNextDue(systems){ var ds = (systems||[]).map(function(s){return s.due;}).filter(Boolean).sort(); return ds.length ? ds[0] : ''; }
function mtSystemsDueOn(systems, visitISO){ if(!visitISO) return []; return (systems||[]).filter(function(s){ return s.due && s.due <= visitISO; }); }
function mtAdvanceSystem(sys, base, end){
  var mo = mtFreqMonths(sys.freq);
  if(!mo || !sys.due) return sys;
  var schedule = mtGenerateSchedule(base, end, sys.freq);
  if(schedule.length){
    var doneCount = (sys.doneCount||0) + 1;
    return Object.assign({}, sys, {doneCount:doneCount, due:schedule[doneCount]||'', lastDone:sys.due});
  }
  return Object.assign({}, sys, {due:_addMonth(sys.due, mo), lastDone:sys.due});
}
function mtCompleteVisit(systems, visitISO, base, end){
  return (systems||[]).map(function(s){ return (s.due && visitISO && s.due <= visitISO) ? mtAdvanceSystem(s, base, end) : s; });
}

// Belirli form + sistem (+ alt-tip) için madde listesi. Bilinmeyen → [] (patlamaz).
function clItems(formType, sysKey, subType){
  var T = _clTemplates()[formType]; if(!T) return [];
  var arr = T[sysKey]; if(!arr) return [];
  if(formType !== 'bakim') return arr.map(function(x){ return x; });
  return arr.filter(function(i){ return !i.sub || i.sub === subType; });
}
// Frekans sırası (sık→seyrek). Ziyaret frekansı F seçilince rank(item) <= rank(F) gösterilir.
function clFreqRank(f){ return ({haftalik:0, aylik:1, '3aylik':2, '6aylik':3, yillik:4, '5yillik':5})[f]; }
function clVisitItems(system){
  var items = clItems('bakim', system.sysKey, system.subType || '');
  var vf = system.visitFreq; if(vf === undefined || vf === '') return items;
  var vr = clFreqRank(vf); if(vr === undefined) return items;
  return items.filter(function(i){ var r = clFreqRank(i.freq); return r !== undefined && r <= vr; });
}
// Sonraki bakım vadesi (Faz 3b _addMonth/_addDay desenleri; timezone-safe).
function clComputeNextDue(baseISO, visitFreq){
  if(!baseISO) return '';
  if(visitFreq === 'haftalik') return _addDay(baseISO, 7);
  var m = ({aylik:1, '3aylik':3, '6aylik':6, yillik:12})[visitFreq];
  if(!m) return '';
  return _addMonth(baseISO, m);
}

// Vade durumu: geciken (<0) / yaklasan (0–15 gün) / planli (>15) / '' (takipsiz).
function maintDueStatus(m){
  if(!maintIsTracked(m)) return '';
  const dl = _diffDays(maintNextDue(m));
  if(dl < 0) return 'geciken';
  if(dl <= 15) return 'yaklasan';
  return 'planli';
}
function maintDaysLeft(m){ return maintIsTracked(m) ? _diffDays(maintNextDue(m)) : null; }
// Bakım tamamla: geçmişe ekle, son yapılanı işaretle, sonraki vadeyi ileri sar,
// durumu yeni döngü için "Henüz Verilmedi"ye geri al. Kayıt: saveMaint deseni.
async function maintDone(m){
  if(!maintIsTracked(m)){ showToast('⚠️ Önce periyot ve ilk vade tarihi girin.','#d97706'); return; }
  if(!clHasFreshCompleted('maintenance', m.id, m.mtLastDone||'')){ showToast('⚠️ Bu ziyaret için önce NFPA Checklist doldurulup personel+müşteri imzasıyla tamamlanmalı.','#d97706'); return; }
  const note = prompt('Bakım tamamlandı — yapılan işlem / not (opsiyonel):', '');
  if(note === null) return;
  const me = (state.currentUser && state.currentUser.displayName) || '';
  const now = today();
  const hist = [...maintHistory(m), {at:now, by:me, note:note||''}];
  const nextDue = computeNextDue(now, maintPeriod(m), maintPeriodDays(m));
  const data = {...m, mtLastDone:now, mtHistory:hist, mtNextDue: nextDue || m.mtNextDue, status:'Hizmet Henüz Verilmedi', ...stamp()};
  setState({saving:true});
  await persistMaint(data);
  setState({modal:null, saving:false});
  showToast('✅ Bakım tamamlandı — sonraki vade: ' + (nextDue ? _toTR(nextDue) : '-'));
}

// Otomatik görev üretimi (spec §11.4) — deterministik id ile idempotent, mevcut CRM'e dokunmaz.
async function personelAutoGenerateTasks(){
  try{
    const existing = new Set((state.tasks||[]).map(t=>t.id));
    const people = personelPeople();
    const deptOf = name => { const u=people.find(x=>x.displayName===name); return u?u.department:''; };
    const toAdd = [];
    const push = (id,title,name,due,linkedType,linkedId,desc) => {
      if(existing.has(id) || !name) return;
      existing.add(id);
      toAdd.push({ id, title, desc:desc||'', assignedTo:name, department:deptOf(name), dueDate:due||'', status:'acik', completedAt:null, priority:'orta', linkedType, linkedId, autoGenerated:true, createdBy:'sistem', createdAt:today(), fiscalYear: activeFiscalYear() });
    };
    const offsetDay = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
    const cutoff = offsetDay(-90), soon = offsetDay(30);
    (state.opportunities||[]).forEach(o=>{
      if(o.stage!=='KAZANILDI') return;
      const dt = String(_pOppDate(o)||'').slice(0,10);
      if(dt && dt<cutoff) return;
      push('auto_won_'+o.id, 'Kazanılan iş süreci: '+(o.title||'Fırsat'), o.assignedTo, o.dueDate||today(), 'opportunity', o.id, 'Sözleşme / sipariş / teslim sürecini başlat.');
    });
    (state.maintenances||[]).forEach(m=>{
      const due = String(m.dueDate||m.nextDate||'').slice(0,10);
      if(!due || due>soon || _pIsDone(m.status)) return;
      push('auto_maint_'+m.id, 'Periyodik bakım: '+(m.customer||m.customerName||m.title||'Müşteri'), m.assignedTo, due, 'maintenance', m.id, 'Planlı bakımı gerçekleştir ve raporla.');
    });
    (state.proposals||[]).forEach(p=>{
      if(_pIsDone(p.status)) return;
      push('auto_prop_'+p.id, 'Teklif hazırla/takip: '+(p.title||'Teklif'), p.assignedTo, p.dueDate||'', 'proposal', p.id, 'Teklifi hazırla veya takibini yap.');
    });
    if(!toAdd.length) return;
    for(const t of toAdd){ await saveDoc('tasks', t.id, t); }
    setState({ tasks: [...(state.tasks||[]), ...toAdd] });
  }catch(e){ /* sessiz — otomatik görev üretimi ana CRM akışını etkilemez */ }
}

// Bugün biten / geciken açık görevler için günde bir kez bildirim (localStorage anti-spam).
function taskDueReminders(){
  try{
    const key='taskRemind_'+today();
    if(localStorage.getItem(key)) return;
    const my=(state.currentUser&&state.currentUser.displayName)||'';
    if(!my) return;
    const mine=(state.tasks||[]).map(normTask).filter(t=>t.assignedTo===my && !taskIsClosed(t) && t.dueDate);
    const overdue=mine.filter(t=>String(t.dueDate)<today());
    const dueToday=mine.filter(t=>String(t.dueDate)===today());
    if(overdue.length) showNotification('task_overdue_'+today(),'⏰ Geciken görev',overdue.length+' göreviniz gecikti.','urgent',my);
    else if(dueToday.length) showNotification('task_today_'+today(),'📅 Bugün biten görev',dueToday.length+' göreviniz bugün bitiyor.','warning',my);
    localStorage.setItem(key,'1');
  }catch(e){}
}

// sayılmasını istediklerini elle işaretler → o.fiscalYear = sonrakiYıl. İşaret kaldırılırsa kapanış yılına döner.
const _CARRY_OPEN_STAGES = ['TEKLİF','SICAK-1','SICAK-2','ERTELENDİ'];

// Tek fırsatı sonradan (fırsat bazlı) bir sonraki mali yıla taşı — bulunduğu bölüm yılının +1'ine.
async function carryOverOpp(o){
  const to = recFY(o)+1;
  if(!confirm('"'+(o.title||'Fırsat')+'" fırsatı '+to+' mali yılına taşınsın mı?\n\nBu fırsat '+to+' bölümüne geçer ve '+to+' hedef/primlerine sayılır.')) return;
  const upd = {...o, fiscalYear: to, ...stamp()};
  await saveDoc('opportunities', o.id, upd);
  setState({opportunities: (state.opportunities||[]).map(x=>x.id===o.id?upd:x)});
  if(o.quotationId){ const r=await _syncQuotationFiscalYear(o.quotationId, to); showToast('↦ '+to+' yılına taşındı.'+(r.ok?'':' ⚠ teklif kârı senkronlanamadı'), r.ok?'#16a34a':'#d97706'); }
  else showToast('↦ '+to+' mali yılına taşındı.','#16a34a');
}
function buildCarryoverModal(fromYear){
  fromYear = Number(fromYear); const toYear = fromYear+1;
  const cands = (state.opportunities||[])
    .filter(o=>_CARRY_OPEN_STAGES.indexOf(o.stage)>=0 && (_pOppFY(o)===fromYear || Number(o.fiscalYear)===toYear))
    .sort((a,b)=>String(a.title||'').localeCompare(String(b.title||''),'tr'));
  const boxes = [];
  const container = h('div',{});
  container.appendChild(h('div',{style:{fontSize:'12px',color:'#92400e',lineHeight:'1.6',marginBottom:'12px',background:'#fffbeb',border:'1px solid #fcd34d',borderRadius:'10px',padding:'10px 12px'}},
    'Devam eden (açık) fırsatlardan '+fromYear+' → '+toYear+' mali yılına TAŞINACAK olanları işaretleyin. İşaretliler '+toYear+' hedefine (1. aydan itibaren) sayılır. Hiçbir şey otomatik taşınmaz; yalnızca seçtikleriniz.'));
  if(!cands.length){
    container.appendChild(h('div',{style:{padding:'20px',textAlign:'center',color:T4}},'Taşınabilecek açık fırsat yok.'));
  } else {
    cands.forEach(o=>{
      const cb = h('input',{type:'checkbox',style:{width:'18px',height:'18px',cursor:'pointer',flexShrink:'0'}});
      cb.checked = Number(o.fiscalYear)===toYear;
      boxes.push({o,cb});
      container.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'10px',padding:'8px 10px',borderBottom:'1px solid #eef2f7'}},
        cb,
        h('div',{style:{flex:'1',minWidth:'0'}},
          h('div',{style:{fontWeight:'700',fontSize:'13px',color:'#0f1f35'}},o.title||'(başlıksız)'),
          h('div',{style:{fontSize:'11px',color:T4}},(o.customer||o.customerName||'-')+' · '+o.stage+' · '+eur(Number(o.value)||0)+' · '+(o.assignedTo||'-')+' · Kapanış: '+(_pOppDate(o)||'-')+(Number(o.fiscalYear)?(' · ⤳ '+o.fiscalYear):''))
        )
      ));
    });
  }
  const saveBtn = btn('💾 Devri Kaydet', async()=>{
    let n=0, qWarn=0;
    for(const {o,cb} of boxes){
      const want = cb.checked;
      const isCarried = Number(o.fiscalYear)===toYear;
      if(want && !isCarried){
        await personelSaveDoc('opportunities', {...o, fiscalYear:toYear}); n++;
        // Bağlı teklif varsa kârı da toYear'a hizala (karlılık YTD marjı fırsat devriyle örtüşür).
        if(o.quotationId){ const r=await _syncQuotationFiscalYear(o.quotationId, toYear); if(!r.ok) qWarn++; }
      } else if(!want && Number(o.fiscalYear)){
        const r={...o}; delete r.fiscalYear; await personelSaveDoc('opportunities', r); n++;
        if(o.quotationId){ const rr=await _syncQuotationFiscalYear(o.quotationId, null); if(!rr.ok) qWarn++; }
      }
    }
    showToast((n?('✅ '+n+' fırsat güncellendi.'):'Değişiklik yok.') + (qWarn?(' ⚠ '+qWarn+' teklif kârı senkronlanamadı'):''), qWarn?'#d97706':'#16a34a');
    setState({modal:null});
  },'linear-gradient(135deg,#2563eb,#1d4ed8)','#fff','9px 16px',{flex:'1'});
  container.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'14px'}}, saveBtn, btn('Kapat',()=>setState({modal:null}),'#e8eef7','#4a6080','9px 14px')));
  return modal('🔄 '+fromYear+' → '+toYear+' Fırsat Devri', container, ()=>setState({modal:null}), '640px');
}

// Verideki + mantıksal (geçmiş/şu an/gelecek) tüm mali yılları topla (azalan).
function _allFiscalYears(){
  const set = new Set();
  const cur = activeFiscalYear();
  set.add(cur); set.add(cur-1); set.add(cur+1);
  FY_SCOPED_COLLECTIONS.forEach(coll=>{ (state[coll]||[]).forEach(r=>{ const y=recFY(r); if(y) set.add(y); }); });
  return [...set].filter(y=>y>=2000&&y<=2100).sort((a,b)=>b-a);
}

    h('div',{style:{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}},
      h('span',{style:{fontSize:'12px',color:T3,fontWeight:'600'}},'Dönem:'),
      periodInp,
      // Mali yıl kontrolleri Araçlar → Mali Yıl ekranına taşındı. Buradaki rozet bilgilendirme amaçlı; tıklayınca o ekranı açar.
      isAdmin?btn('📅 Mali Yıl '+fy,()=>openFiscalYearModal(),'#dbeafe','#1e3a6e','5px 11px',{fontSize:'11px',fontWeight:'700',border:'1px solid #b8d4ec'}):h('span',{style:{fontSize:'11px',fontWeight:'700',color:'#1e3a6e',background:'#dbeafe',padding:'4px 9px',borderRadius:'8px'}},'Mali Yıl '+fy),
      isAdmin?btn('⚙ Ayarlar',()=>{PMOD.settingsOpen=!PMOD.settingsOpen;render();},'#e8eef7','#2a5080','9px 14px',{fontSize:'12px',border:'1px solid #b8c8de'}):h('span')
    )

  const settings = (isAdmin && PMOD.settingsOpen) ? renderPersonelSettings() : h('span');

  return h('div',{}, headRow, tabBar, settings, body);

function openTaskModal(taskId){ setState({ modal:{ type:'task', taskId } }); }

async function taskSetStatus(t, status){
  const rec = Object.assign({}, normTask(t), { status, ...stamp() });
  if(status==='tamamlandi') rec.completedAt = rec.completedAt || today();
  await personelSaveDoc('tasks', rec);
  if(status==='tamamlandi' && rec.needsApproval){
    showNotification('task_done_'+rec.id, 'Onay bekliyor', (rec.title||'Görev')+' tamamlandı, onayınızı bekliyor.', 'info', rec.assignedBy);
  }
  showToast('✅ Durum güncellendi: '+(TASK_STATUS_META[status]?TASK_STATUS_META[status].l:status));
}

async function taskApprove(t){
  const who = (state.currentUser && state.currentUser.displayName)||'';
  const rec = Object.assign({}, normTask(t), { status:'onaylandi', approvedAt:today(), approvedBy:who, completedAt: t.completedAt||today(), ...stamp() });
  await personelSaveDoc('tasks', rec);
  showNotification('task_ok_'+rec.id, '✅ Görev onaylandı', (rec.title||'Görev')+' onaylandı.', 'win', rec.assignedTo);
  playBeep('win');
  showToast('✅ Görev onaylandı.');
}

async function taskRevise(t){
  const note = prompt('Revizyon nedeni (zorunlu — neyin düzeltileceğini yazın):');
  if(!note || !note.trim()){ showToast('⚠ Revizyon için açıklama zorunlu.','#dc2626'); return; }
  const who = (state.currentUser && state.currentUser.displayName)||'';
  const base = normTask(t);
  const comments = base.comments.concat([{ by:who, text:'↩ Revizyon: '+note.trim(), at:today() }]);
  const rec = Object.assign({}, base, { status:'devam', revisionCount:(base.revisionCount||0)+1, comments, ...stamp() });
  await personelSaveDoc('tasks', rec);
  showNotification('task_rev_'+rec.id, '↩ Revizyona döndü', (rec.title||'Görev')+' revizyona gönderildi.', 'warning', rec.assignedTo);
  playBeep('warning');
  showToast('↩ Revizyona gönderildi.');
}

async function taskReassign(t, toName, reason, note, newDue){
  const who = (state.currentUser && state.currentUser.displayName)||'';
  const person = personelPeople().find(u=>u.displayName===toName);
  const base = normTask(t);
  const hist = base.assignmentHistory.concat([{ from:base.assignedTo, to:toName, at:today(), by:who, reason:reason||'diger', note:note||'' }]);
  const comments = base.comments.concat([{ by:who, text:'↪ Devredildi → '+toName+(reason?(' ('+(DEVIR_REASONS.find(r=>r.v===reason)||{}).l+')'):'' )+(note?': '+note:''), at:today() }]);
  const rec = Object.assign({}, base, {
    assignedTo: toName, department: person? person.department : base.department,
    assignmentHistory: hist, comments,
    dueDate: newDue || base.dueDate, ...stamp()
  });
  await personelSaveDoc('tasks', rec);
  showNotification('task_reassign_'+rec.id, '↪ Yeni görev', (rec.title||'Görev')+' size devredildi.', 'info', toName);
  playBeep('info');
  showToast('↪ Devredildi: '+toName);
}

async function taskAddComment(t, text){
  if(!text || !text.trim()) return;
  const who = (state.currentUser && state.currentUser.displayName)||'';
  const base = normTask(t);
  const comments = base.comments.concat([{ by:who, text:text.trim(), at:today() }]);
  const rec = Object.assign({}, base, { comments, ...stamp() });
  await personelSaveDoc('tasks', rec);
  const other = who===base.assignedTo ? base.assignedBy : base.assignedTo;
  if(other) showNotification('task_cmt_'+rec.id, '💬 Yorum', (rec.title||'Görev')+' için yeni yorum.', 'info', other);
}

    );

    btn('🗂 Kanban',()=>{PMOD.taskView='kanban';render();},PMOD.taskView==='kanban'?'#1e3a6e':'#e8eef7',PMOD.taskView==='kanban'?'#fff':'#2a5080','7px 13px',{fontSize:'12px'})
  );

function renderTaskDigest(isAdmin, myName){
  const all = filterFY(state.tasks, activeFiscalYear()).map(normTask);
  const mine = all.filter(t=>t.assignedTo===myName && !taskIsClosed(t) && t.dueDate);
  const wkEnd = _offsetDay(7);
  const today0 = today();
  const bugun = mine.filter(t=>String(t.dueDate)<=today0);
  const buHafta = mine.filter(t=>String(t.dueDate)>today0 && String(t.dueDate)<=wkEnd);
  const onayBekleyen = isAdmin
    ? all.filter(t=>t.status==='tamamlandi' && t.needsApproval)
    : all.filter(t=>t.status==='tamamlandi' && t.needsApproval && t.assignedBy===myName);
  const chip=(lbl,n,color,onClick)=> n?h('div',{style:{background:color+'14',border:'1px solid '+color+'55',borderRadius:'10px',padding:'8px 12px',cursor:'pointer',fontSize:'12px',fontWeight:'700',color},onclick:onClick},lbl+': '+n):null;
  const items=[
    chip('⏰ Bugün/Geciken', bugun.length, '#dc2626', ()=>{PMOD.taskFilter='geciken';render();}),
    chip('📅 Bu hafta', buHafta.length, '#b45309', ()=>{PMOD.taskFilter='acik';render();}),
    chip('✅ Onay bekleyen', onayBekleyen.length, '#16a34a', ()=>{PMOD.taskFilter='onay';render();}),
  ].filter(Boolean);
  if(!items.length) return h('span');
  return h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'12px'}}, ...items);
}

function buildProjeModal(oppId){
  const cu=state.currentUser; const isAdmin=!!(cu&&cu.isAdmin); const myName=cu&&cu.displayName;
  const o=(state.opportunities||[]).find(x=>x.id===oppId);
  if(!o) return modal('Proje', h('div',{},'Proje bulunamadı.'), ()=>setState({modal:null}), '640px');
  const st=projStage(o), idx=_projStageIndex(st), closed=!!o.execClosedAt;

  const strip=h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'14px'}},
    ...PROJECT_STAGES.map((s,i)=>{
      const meta=PROJECT_STAGE_META[s];
      const state_ = i<idx?'done':(i===idx?'active':'todo');
      const bg = state_==='active'?meta.color:(state_==='done'?'#16a34a':'#e8eef7');
      const col = (state_==='active'||state_==='done')?'#fff':'#64748b';
      return h('span',{style:{background:bg,color:col,borderRadius:'20px',padding:'5px 11px',fontSize:'12px',fontWeight:'700'}},
        (state_==='done'?'✓ ':meta.icon+' ')+meta.l);
    })
  );

  const acts=[];
  if(!closed && idx<PROJECT_STAGES.length-1) acts.push(btn('Sonraki aşama →',async()=>{await projAdvance(o); render();},'#1e3a6e','#fff','8px 14px',{fontSize:'13px'}));
  if(!closed && idx===PROJECT_STAGES.length-1) acts.push(btn('✓ Projeyi kapat',async()=>{await projClose(o); render();},'linear-gradient(135deg,#10b981,#059669)','#fff','8px 14px',{fontSize:'13px'}));
  if(isAdmin && (closed || idx>0)) acts.push(btn(closed?'↺ Yeniden aç':'← Geri al',async()=>{await projRollback(o); render();},'#fef3c7','#92400e','8px 14px',{fontSize:'13px'}));
  acts.push(btn('+ Bu aşamaya görev öner',async()=>{await suggestStageTasks(o, st, {manual:true, silent:true}); render();},'#eef2ff','#4338ca','8px 14px',{fontSize:'13px'}));
  acts.push(btn('⏹ İcra iptal',()=>projCancelExec(o),'#fff7ed','#c2410c','8px 14px',{fontSize:'13px',border:'1px solid #fed7aa'}));
  if(isAdmin) acts.push(btn('🗑 Sil',()=>projDelete(o),'#fef2f2','#dc2626','8px 14px',{fontSize:'13px',border:'1px solid #fecaca'}));
  const actBar=h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'14px'}}, ...acts);

  const groups=PROJECT_STAGES.map(s=>{
    const ts=projStageTasks(o, s);
    if(!ts.length) return null;

      h('div',{style:{fontWeight:'700',fontSize:'13px',color:PROJECT_STAGE_META[s].color,marginBottom:'6px'}},PROJECT_STAGE_META[s].icon+' '+PROJECT_STAGE_META[s].l),
      ...ts.map(t=>taskCard(t, isAdmin, myName))
    );
  }).filter(Boolean);
  const tasksBox = groups.length? h('div',{}, ...groups)
    : h('div',{style:{padding:'16px',textAlign:'center',color:T4}},'Bu projeye bağlı görev yok. "Bu aşamaya görev öner" ile başlayın.');

  const cust=(state.customers||[]).find(c=>c.id===o.customerId)||null;
  const content=h('div',{},
    cust?h('div',{style:{fontSize:'13px',color:T3,marginBottom:'10px'}},'👤 '+(cust.firmName||cust.name||'')):h('span'),
    strip, actBar,
    h('div',{style:{borderTop:'1px solid #e2e8f0',paddingTop:'12px'}}, tasksBox)
  );
  content.appendChild(clListBlock({ linkType:'project', linkId:o.id, newOpts:{ formType:'devreye', customerId:o.customerId||'', siteName:o.title||((cust&&cust.firmName)||''), projectId:o.id, linkType:'project', linkId:o.id } }));
  return modal((o.title||'Proje')+' — İcra', content, ()=>setState({modal:null}), '720px');
}

    h('h2',{style:{margin:'0',fontSize:'20px',color:'#0f2040'}},'🏗 Projeler'),
    h('span',{style:{color:T3,fontSize:'13px'}},active.length+' aktif · '+awaiting.length+' bekleyen · '+closed.length+' kapanan')
  );

  let mgrBar=h('span');
  if(isAdmin){
    const deptOpts=[{v:'',l:'Tüm departmanlar'},...DEPARTMENTS.map(d=>({v:d.v,l:d.l}))];
    const perOpts=[{v:'',l:'Tüm kişiler'},...personelPeople().map(u=>({v:u.displayName,l:u.displayName}))];
    mgrBar=h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'12px'}},
      sel(deptOpts, PMOD.projDept, v=>{PMOD.projDept=v;render();}),
      sel(perOpts, PMOD.projPerson, v=>{PMOD.projPerson=v;render();})
    );
  }

  const awaitingBox = awaiting.length ? h('div',{style:{marginBottom:'16px'}},
    h('div',{style:{fontWeight:'700',color:'#b45309',fontSize:'14px',marginBottom:'8px'}},'⏳ İcra bekleyen (kazanıldı)'),
    ...awaiting.map(o=>h('div',{style:{background:'#fffbeb',border:'1px solid #fcd34d',borderRadius:'12px',padding:'12px 14px',marginBottom:'8px',display:'flex',flexWrap:'wrap',alignItems:'center',gap:'10px'}},
      h('div',{style:{flex:'1',minWidth:'160px',fontWeight:'700',color:'#0f2040'}},o.title||'(başlıksız)'),
      btn('🏗 İcraya başlat',()=>projStart(o),'linear-gradient(135deg,#10b981,#059669)','#fff','8px 14px',{fontSize:'13px'})
    ))
  ) : h('span');

  const viewBar=h('div',{style:{display:'flex',gap:'6px',marginBottom:'10px'}},
    btn('📋 Liste',()=>{PMOD.projView='liste';render();},PMOD.projView==='liste'?'#1e3a6e':'#e8eef7',PMOD.projView==='liste'?'#fff':'#2a5080','7px 13px',{fontSize:'12px'}),
    btn('🗂 Kanban',()=>{PMOD.projView='kanban';render();},PMOD.projView==='kanban'?'#1e3a6e':'#e8eef7',PMOD.projView==='kanban'?'#fff':'#2a5080','7px 13px',{fontSize:'12px'})
  );
  const isMobile = window.innerWidth<=768;
  const activeBody = (!active.length)
    ? h('div',{style:{padding:'24px',textAlign:'center',color:T4,background:'#fff',borderRadius:'12px',border:'1px solid #d0daea'}},'Aktif proje yok.')
    : ((PMOD.projView==='kanban' && !isMobile) ? renderProjeKanban(active, isAdmin)
        : h('div',{}, ...active.map(o=>projListRow(o,isAdmin))));

  const closedBox = closed.length ? h('div',{style:{marginTop:'16px'}},
    btn((PMOD.projShowClosed?'▾':'▸')+' Kapanan projeler ('+closed.length+')',()=>{PMOD.projShowClosed=!PMOD.projShowClosed;render();},'#eef2f7','#334155','7px 12px',{fontSize:'12px'}),
    PMOD.projShowClosed ? h('div',{style:{marginTop:'8px'}}, ...closed.map(o=>projListRow(o,isAdmin))) : h('span')
  ) : h('span');

  return h('div',{}, header, mgrBar, awaitingBox,
    h('div',{style:{fontWeight:'700',color:'#0f2040',fontSize:'14px',margin:'4px 0 8px'}},'🚀 Aktif projeler'),
    viewBar, activeBody, closedBox);
}

function renderPersonelPerformans(period, isAdmin){
  const people = personelPeople();
  if(!people.length){
    return h('div',{style:{padding:'28px',textAlign:'center',color:T4,background:'#ffffff',borderRadius:'12px',border:'1px solid #d0daea'}},
      'Departman atanmış personel yok. Kullanıcı Yönetimi → ✏️ Düzenle içinden departman atayın.');
  }
  const pct = v => Math.round((v||0)*100)+'%';
  const cards = people.map(u=>{
    const sc = personelScore(u, period);
    if(!sc) return h('span');
    const open = !!PMOD.perfOpen[u.email];
    const barColor = sc.skor>=1?'#16a34a':sc.skor>=0.7?'#d97706':'#dc2626';
    const msSel = sel([{v:'',l:'Yönetici Puanı (1-5)'},{v:'1',l:'1 — Zayıf'},{v:'2',l:'2'},{v:'3',l:'3 — Orta'},{v:'4',l:'4'},{v:'5',l:'5 — Çok iyi'}], String(sc.managerScore||''), async v=>{
      const ev = personelEvalFor(u.displayName, period);
      const rec = ev ? { ...ev } : { id: genId(), personName:u.displayName, department:u.department, period, criteria:{}, managerScore:0 };
      rec.managerScore = Number(v)||0;
      rec.updatedAt = today();
      const sc2 = personelScore(u, period);
      rec.totalScore = sc2 ? sc2.skor : 0;
      await personelSaveDoc('evaluations', rec);
      showToast('✅ Yönetici puanı kaydedildi.');
    }, {maxWidth:'200px'});

    // Yönetici nitel değerlendirme notu (personelle görüşmede kullanılır) — blur'da kaydedilir.
    const evNow = personelEvalFor(u.displayName, period);
    const ta = h('textarea',{
      placeholder:'Yönetici değerlendirme notu — güçlü yönler, gelişim alanları, görüşülecek konular… (raporda görünür)',
      style:{width:'100%',minHeight:'62px',resize:'vertical',border:'1px solid #cbd5e1',borderRadius:'8px',padding:'8px 10px',fontSize:'12px',fontFamily:'inherit',color:'#334155',boxSizing:'border-box'}
    });
    ta.value = (evNow && evNow.notes) || '';
    ta.addEventListener('blur', async()=>{
      const cur = personelEvalFor(u.displayName, period);
      const prev = (cur && cur.notes) || '';
      if(ta.value === prev) return;
      const rec = cur ? { ...cur } : { id: genId(), personName:u.displayName, department:u.department, period, criteria:{}, managerScore:0 };
      rec.notes = ta.value;
      rec.updatedAt = today();
      const sc3 = personelScore(u, period);
      rec.totalScore = sc3 ? sc3.skor : 0;
      await personelSaveDoc('evaluations', rec);
      showToast('✅ Değerlendirme notu kaydedildi.');
    });
    const notesEl = h('div',{style:{marginTop:'10px'}},
      h('div',{style:{fontSize:'11px',fontWeight:'700',color:T3,marginBottom:'5px'}},'📝 Yönetici Değerlendirme Notu'),
      ta
    );

    // Manuel kriter için yönetici giriş alanı (0-100%) — rec.criteria[kod]'e yazar
    const critInput = (r) => {
      const cur = (evNow && evNow.criteria && typeof evNow.criteria[r.kod]==='number') ? evNow.criteria[r.kod] : null;
      const inp = h('input',{type:'number',min:'0',max:'150',step:'1',
        value: cur==null?'':String(Math.round(cur*100)),
        placeholder:'—',
        style:{width:'58px',textAlign:'right',padding:'3px 6px',border:'1px solid #cbd5e1',borderRadius:'6px',fontSize:'12px'}});
      inp.addEventListener('change', async()=>{
        const ev = personelEvalFor(u.displayName, period);
        const rec = ev ? { ...ev, criteria:{ ...(ev.criteria||{}) } } : { id:genId(), personName:u.displayName, department:u.department, period, criteria:{}, managerScore:0 };
        const raw = String(inp.value).trim();
        if(raw==='') delete rec.criteria[r.kod];
        else rec.criteria[r.kod] = Math.max(0,Math.min(150,Number(raw)||0))/100;
        rec.updatedAt = today();
        await personelSaveDoc('evaluations', rec);
        const sc2 = personelScore(u, period);
        if(sc2){ rec.totalScore = sc2.skor; if(!state.testMode) await saveDoc('evaluations', rec.id, rec); }
        showToast(state.testMode?'🧪 Test — kaydedilmedi':'✅ Kriter puanı kaydedildi.');
      });
      return inp;
    };
    const detail = open ? h('div',{style:{marginTop:'10px',borderTop:'1px solid #e2e8f0',paddingTop:'10px'}},
      isAdmin?h('div',{style:{fontSize:'10px',color:T4,marginBottom:'6px'}},'⚙ otomatik (sistemden) · ✎ manuel (yönetici % girer, boş = hesap dışı)'):h('span'),
      ...sc.rows.map(r=>{
        const editable = isAdmin && !r.auto && r.kod!=='yonetici';
        return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'8px',padding:'4px 0',fontSize:'12px'}},
          h('span',{style:{color: r.oran==null && !editable?'#94a3b8':'#334155'}}, (r.auto?'⚙ ':'✎ ')+r.label),
          editable
            ? h('span',{style:{display:'flex',alignItems:'center',gap:'5px'}}, critInput(r), h('span',{style:{color:'#64748b',fontSize:'11px'}},'% · ağırlık '+Math.round(r.weight*100)+'%'))
            : h('span',{style:{fontWeight:'700',color: r.oran==null?'#94a3b8':(r.oran>=1?'#16a34a':r.oran>=0.7?'#d97706':'#dc2626')}}, r.oran==null?'veri yok':pct(r.oran)+' ('+Math.round((r.weight/sc.wsum)*100)+'%)')
        );
      })
    ) : h('span');

    return h('div',{style:{background:'#ffffff',border:'1px solid #d0daea',borderRadius:'12px',padding:'14px',marginBottom:'10px'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:'10px',flexWrap:'wrap'}},
        h('div',{style:{width:'36px',height:'36px',borderRadius:'50%',background:'linear-gradient(135deg,#2563eb,#7c3aed)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'13px',fontWeight:'700',color:'#fff'}},u.displayName.split(' ').map(n=>n[0]).join('').slice(0,2)),
        h('div',{style:{flex:'1',minWidth:'120px'}},
          h('div',{style:{fontWeight:'700',fontSize:'14px',color:'#0f1f35'}},u.displayName),
          h('div',{style:{fontSize:'11px',color:T3}},DEPT_LABEL[u.department]||u.department)
        ),
        h('div',{style:{textAlign:'right'}},
          h('div',{style:{fontSize:'20px',fontWeight:'800',color:barColor}},pct(sc.skor)),
          h('div',{style:{fontSize:'10px',color:T4}},'Toplam Skor')
        )
      ),
      h('div',{style:{height:'7px',background:'#e2e8f0',borderRadius:'4px',overflow:'hidden',margin:'10px 0'}},
        h('div',{style:{height:'100%',width:Math.min(100,(sc.skor||0)*100)+'%',background:barColor,borderRadius:'4px'}})
      ),
      h('div',{style:{display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap'}},
        isAdmin?msSel:h('span',{style:{fontSize:'12px',color:T3}},'Yönetici Puanı: '+(sc.managerScore||'—')),
        btn(open?'▲ Kriterleri gizle':'▼ Kriter detayı',()=>{PMOD.perfOpen[u.email]=!open;render();},'#e8eef7','#2a5080','7px 12px',{fontSize:'12px',border:'1px solid #b8c8de'}),
        btn('🖨️ Rapor',()=>printPersonelReport(u, period, isAdmin),'#eef2ff','#4338ca','7px 12px',{fontSize:'12px',border:'1px solid #c7d2fe'})
      ),
      isAdmin?notesEl:h('span'),
      detail
    );
  });
  // TEST MODU çubuğu (yalnızca yönetici) — örnek verilerle dener, DB'ye yazmaz
  const testBar = isAdmin ? h('div',{style:{display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap',background:state.testMode?'#fef3c7':'#f1f5f9',border:'1px solid '+(state.testMode?'#f59e0b':'#cbd5e1'),borderRadius:'10px',padding:'10px 14px',marginBottom:'12px'}},
      h('div',{style:{flex:'1',minWidth:'220px'}},
        h('div',{style:{fontWeight:'700',fontSize:'13px',color:state.testMode?'#92400e':'#334155'}}, state.testMode?'🧪 TEST MODU AÇIK':'🧪 Test Modu'),
        h('div',{style:{fontSize:'11px',color:state.testMode?'#b45309':'#64748b',marginTop:'2px'}}, state.testMode?'Örnek veriler yüklü — hiçbir giriş veritabanına kaydedilmez. Kapatınca gerçek veriler geri gelir.':'Örnek hedef/gerçekleşme/puanlarla prim hesabını dener; veritabanına yazmaz.')
      ),
      h('button',{onclick:()=>personelTestModeToggle(period),
        style:{background:state.testMode?'#dc2626':'#2563eb',color:'#fff',border:'none',borderRadius:'8px',padding:'8px 16px',fontSize:'13px',fontWeight:'700',cursor:'pointer',whiteSpace:'nowrap'}},
        state.testMode?'Test Modunu Kapat':'Test Modunu Aç')
    ) : h('span');
  return h('div',{}, testBar, ...cards);
}

function renderPersonelPrim(period){
  const people = personelPeople();
  if(!people.length){
    return h('div',{style:{padding:'28px',textAlign:'center',color:T4,background:'#ffffff',borderRadius:'12px',border:'1px solid #d0daea'}},
      'Departman atanmış personel yok.');
  }
  const note = h('div',{style:{background:'#fffbeb',border:'1px solid #fcd34d',borderRadius:'10px',padding:'10px 14px',marginBottom:'12px',fontSize:'12px',color:'#92400e'}},
    '🔒 Prim verileri yalnızca yöneticiye görünür. Primler ÇEYREKLİK ödenir; hak ediş YILLIK hedefe göre kümülatiftir. '
    + '“Bu çeyrek ödenecek” = yıl başından hak edilen − önceki çeyreklerde ödenen (negatif olmaz, fazlası sonraki çeyreğe devreder). '
    + 'Aşım primi yalnızca yıl kapanışında (Q4) yıllık hedefi aşanlara verilir.');

  const cards = people.map(u=>{
    const pr = personelPrim(u, period);
    if(!pr) return h('span');
    const open = !!PMOD.primOpen[u.email];
    const nm = u.displayName;
    const rec = _ledgerRec(pr.year, nm);
    const qPaidRec = rec.quarters && rec.quarters[pr.quarter];
    const alreadyPaid = qPaidRec && Number(qPaidRec.amount)>=0 && qPaidRec.date;
    const detail = open ? h('div',{style:{marginTop:'10px',borderTop:'1px solid #e2e8f0',paddingTop:'10px'}},
      h('div',{style:{fontSize:'11px',fontWeight:'700',color:T3,marginBottom:'6px'}},'Kriter kırılımı (yıl başından hak edilen €)'),
      ...pr.avail.map(r=>h('div',{style:{display:'flex',justifyContent:'space-between',gap:'8px',padding:'3px 0',fontSize:'12px'}},
        h('span',{style:{color:'#334155'}},r.label+' ',h('span',{style:{color:'#94a3b8'}},'%'+Math.round((r.weight/pr.wsum)*100))),
        h('span',{style:{fontWeight:'700',color:'#0f1f35'}},eur(pr.breakdown[r.kod]||0))
      )),
      h('div',{style:{display:'flex',justifyContent:'space-between',gap:'8px',padding:'6px 0 0',marginTop:'4px',borderTop:'1px dashed #e2e8f0',fontSize:'12px'}},
        h('span',{style:{color:'#334155'}},'Taban (kümülatif)'), h('span',{style:{fontWeight:'700'}},eur(pr.baseAmount))),
      pr.overAmount>0 ? h('div',{style:{display:'flex',justifyContent:'space-between',gap:'8px',padding:'3px 0',fontSize:'12px'}},
        h('span',{style:{color:'#7c3aed'}},'⚡ Aşım (Q4)'), h('span',{style:{fontWeight:'700',color:'#7c3aed'}},eur(pr.overAmount))) : h('span'),
      h('div',{style:{display:'flex',justifyContent:'space-between',gap:'8px',padding:'3px 0',fontSize:'12px'}},
        h('span',{style:{color:'#334155'}},'Yıl başından hak edilen'), h('span',{style:{fontWeight:'700'}},eur(pr.earnedToDate))),
      h('div',{style:{display:'flex',justifyContent:'space-between',gap:'8px',padding:'3px 0',fontSize:'12px'}},
        h('span',{style:{color:'#334155'}},'Önceki çeyreklerde ödenen'), h('span',{style:{fontWeight:'700'}},eur(pr.paidBefore))),
      pr.carry>0 ? h('div',{style:{display:'flex',justifyContent:'space-between',gap:'8px',padding:'3px 0',fontSize:'12px'}},
        h('span',{style:{color:'#dc2626'}},'Fazla avans → devir'), h('span',{style:{fontWeight:'700',color:'#dc2626'}},eur(pr.carry))) : h('span')
    ) : h('span');
    return h('div',{style:{background:'#ffffff',border:'1px solid '+(pr.pass?'#bbf7d0':'#e2e8f0'),borderRadius:'12px',padding:'14px',marginBottom:'10px'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:'10px',flexWrap:'wrap'}},
        h('div',{style:{flex:'1',minWidth:'120px'}},
          h('div',{style:{fontWeight:'700',fontSize:'14px',color:'#0f1f35'}},nm),
          h('div',{style:{fontSize:'11px',color:T3}},(DEPT_LABEL[u.department]||u.department)+' · '+pr.year+'-Q'+pr.quarter+' · Skor '+Math.round((pr.skor||0)*100)+'% · Eşik '+Math.round((pr.cfg.threshold||0)*100)+'%')
        ),
        h('div',{style:{textAlign:'right'}},
          h('div',{style:{fontSize:'19px',fontWeight:'800',color:pr.pass?(pr.thisQuarterPayable>0?'#16a34a':'#94a3b8'):'#94a3b8'}}, pr.pass?eur(pr.thisQuarterPayable):'Prim yok'),
          h('div',{style:{fontSize:'10px',color:T4}}, pr.pass?('Q'+pr.quarter+' Ödenecek'):'Eşik altı')
            ,alreadyPaid?h('div',{style:{fontSize:'10px',color:'#16a34a',fontWeight:'700',marginTop:'2px'}},'✓ Kaydedildi ('+_toTR(qPaidRec.date)+')'):h('span')
        )
      ),
      h('div',{style:{display:'flex',gap:'8px',marginTop:'10px',flexWrap:'wrap'}},
        btn(open?'▲ Kırılımı gizle':'▼ Kırılım',()=>{PMOD.primOpen[u.email]=!open;render();},'#e8eef7','#2a5080','7px 12px',{fontSize:'12px',border:'1px solid #b8c8de'}),
        btn('💾 Çeyrek Primini Kaydet', async()=>{
          const year=pr.year, q=pr.quarter;
          const ledger = JSON.parse(JSON.stringify(state.primLedger||{}));
          if(!ledger[year]) ledger[year]={};
          if(!ledger[year][nm]) ledger[year][nm]={paid:0,quarters:{}};
          ledger[year][nm].quarters[q] = { amount: pr.thisQuarterPayable, earned: pr.earnedToDate, skor: pr.skor, date: today() };
          ledger[year][nm].paid = Object.values(ledger[year][nm].quarters).reduce((a,x)=>a+(Number(x.amount)||0),0);
          state.primLedger = ledger;
          await savePrimLedger(ledger);
          showToast(state.testMode?'🧪 Test — kaydedilmedi':'✅ '+year+'-Q'+q+' primi kaydedildi.');
          render();
        },'#eef2ff','#4338ca','7px 12px',{fontSize:'12px',border:'1px solid #c7d2fe'}),
        btn('🖨️ Prim Bordrosu',()=>printPrimBordro(u, period),'#ecfdf5','#065f46','7px 12px',{fontSize:'12px',border:'1px solid #a7f3d0'})
      ),
      detail
    );
  });
  return h('div',{}, note, ...cards);
}

function renderPersonelSettings(){
  const cfg = state.evalConfig || JSON.parse(JSON.stringify(DEFAULT_EVAL_CONFIG));
  const strat = state.strategy || { ...DEFAULT_STRATEGY };
  const nInp = (get,setV,w) => inp('', String(get()), v=>setV(v), 'number', {maxWidth:w||'110px'});

  const deptBlocks = DEPARTMENTS.map(d=>{
    const c = cfg[d.v] || DEFAULT_EVAL_CONFIG[d.v];
    return h('div',{style:{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:'10px',padding:'12px',marginBottom:'8px'}},
      h('div',{style:{fontWeight:'700',fontSize:'13px',color:'#0f1f35',marginBottom:'8px'}},d.l),
      row(
        field('Tam Prim / %100 (€)', nInp(()=>c.primBase||0, v=>c.primBase=Number(v)||0,'130px'), true),
        field('Eşik (0-1)', nInp(()=>c.threshold==null?0.7:c.threshold, v=>c.threshold=Number(v)||0), true)
      ),
      row(
        field('Aşım tavanı (oran)', nInp(()=>c.overCap==null?1.5:c.overCap, v=>c.overCap=Number(v)||1.5), true),
        field('Aşım ivmesi', nInp(()=>c.overAccel==null?1:c.overAccel, v=>c.overAccel=Number(v)||0), true)
      ),
      h('div',{style:{fontSize:'11px',color:'#64748b',marginTop:'6px',lineHeight:'1.5'}},
        'Tam Prim: tüm kriterler %100 karşılandığında hak edilen TOPLAM YILLIK taban prim. Primler ÇEYREKLİK ödenir; hak ediş YILLIK hedefe göre kümülatiftir. '
        + 'Geçiş kapısı: dönem PACE skoru ≥ eşik ise prim oluşur (hedefe gidişat yeterli mi?). '
        + 'Hak ediş = Tam Prim × Σ(ağırlık × kazanım). Hedef kriterleri yıllık orana göre; karlılık ve operasyonel kriterler oran × geçen süre (ay/12) ile birikir. '
        + 'Bu çeyrek ödenecek = yıl başından hak edilen − önceki çeyreklerde ödenen (negatif olmaz; fazla avans sonraki çeyreğe devreder). '
        + 'Aşım Primi: YALNIZCA yıl kapanışında (Q4) ve yalnızca YILLIK hedefi aşan bireysel hedef/karlılıkta verilir. Aşım = Tam Prim × Σ(ağırlık × (min(yıllıkOran, aşım tavanı) − 1) × ivme). '
        + 'Aşım tavanı: oran en çok bu kadar sayılır (1.5 = %150). İvme: aşımın ödül çarpanı (1 = normal). Skor eşiğin altındaysa hiç prim oluşmaz.')
    );
  });

  const sectorList = [...new Set((state.opportunities||[]).map(o=>o.sector).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
  const stratSectors = Array.isArray(strat.targetSectors)?strat.targetSectors.slice():[];
  const allSectors = [...new Set([...stratSectors, ...sectorList])];
  const sectorChips = allSectors.length ? allSectors.map(s=>{
    const on = stratSectors.indexOf(s)>=0;
    return btn((on?'✓ ':'')+s, ()=>{
      const i = strat.targetSectors.indexOf(s);
      if(i>=0) strat.targetSectors.splice(i,1); else strat.targetSectors.push(s);
      state.strategy = { ...strat };
      render();
    }, on?'#1e3a6e':'#e8eef7', on?'#fff':'#2a5080','6px 11px',{fontSize:'11px',border:'1px solid #b8c8de',marginBottom:'6px'});
  }) : [h('span',{style:{fontSize:'12px',color:T4}},'Fırsatlarda sektör verisi yok.')];

  return h('div',{style:{background:'#ffffff',border:'1px solid #6366f1',borderRadius:'12px',padding:'16px',marginBottom:'16px'}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}},
      h('div',{style:{fontWeight:'800',fontSize:'15px',color:'#4338ca'}},'⚙ Personel Modülü Ayarları'),
      btn('✕',()=>{PMOD.settingsOpen=false;render();},'#e8eef7','#4a6080','6px 11px',{fontSize:'13px'})
    ),
    h('div',{style:{fontWeight:'700',fontSize:'13px',color:'#0f1f35',margin:'6px 0 8px'}},'💰 Departman Prim Parametreleri'),
    ...deptBlocks,
    h('div',{style:{fontWeight:'700',fontSize:'13px',color:'#0f1f35',margin:'14px 0 8px'}},'🎯 Stratejik Hedef Sektörler'),

(async function init() {
  const users = await loadUsers();
  state.users = users;
  state.targetsByYear = await loadTargets();          // { '2026': {...}, ... } yıl bazlı
  state.activeFiscalYear = await loadActiveFiscalYear(); // GLOBAL aktif mali yıl (settings, 1 Ocak otomatik ilerler)
  state.fiscalYear = state.activeFiscalYear;           // eski okuyucularla uyum (mercek = aktif yıl)
  state.targets = targetsForYear(state.fiscalYear);    // seçili yılın hedef işaretçisi (mevcut okuyucular bozulmaz)
  state.primLedger = await loadPrimLedger();
  state.strategy = await loadStrategy();
  state.evalConfig = await loadEvalConfig();
  state.profitActuals = await loadProfitActuals();
  state.geminiKey = await loadApiKey();
  state.loading = false;
  render();
  setTimeout(checkMonthlyReport, 3000);
  setTimeout(startNotificationTimer, 5000);
})();

function initPWABanner(){
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone === true;
  const dismissed = sessionStorage.getItem('pwa-dismissed');
  if(!dismissed && isIOS && !isStandalone) {
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#0f1f35;color:#fff;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,.4);font-family:system-ui,sans-serif;';
    const ic = document.createElement('div'); ic.textContent='\u26A1'; ic.style.fontSize='32px';
    const tx = document.createElement('div'); tx.style.flex='1';
    tx.innerHTML = '<div style="font-weight:700;font-size:14px">Ana Ekrana Ekle</div><div style="font-size:12px;opacity:.8;margin-top:2px">Safari: Paylas &#8594; Ana Ekrana Ekle</div>';
    const cl = document.createElement('button');
    cl.textContent = 'Tamam';
    cl.style.cssText = 'background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;';
    cl.onclick = function(){ b.remove(); sessionStorage.setItem('pwa-dismissed','1'); };
    b.appendChild(ic); b.appendChild(tx); b.appendChild(cl);
    document.body.appendChild(b);
  }
  // Android
  var dp;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); dp = e;
    if(dismissed) return;
    const b2 = document.createElement('div');
    b2.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#0f1f35;color:#fff;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,.4);font-family:system-ui,sans-serif;';
    const ic2 = document.createElement('div'); ic2.textContent='\u26A1'; ic2.style.fontSize='32px';
    const tx2 = document.createElement('div'); tx2.style.flex='1';
    tx2.innerHTML = '<div style="font-weight:700;font-size:14px">Uygulamayı Yükle</div><div style="font-size:12px;opacity:.8;margin-top:2px">A-PRO CRM ana ekrana ekle</div>';
    const ib = document.createElement('button');
    ib.textContent='Yükle';
    ib.style.cssText='background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:700;white-space:nowrap;';
    ib.onclick=function(){ b2.remove(); if(dp){dp.prompt();dp=null;} };
    const cl2=document.createElement('button');
    cl2.textContent='✕';
    cl2.style.cssText='background:none;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;padding:4px 8px;';
    cl2.onclick=function(){ b2.remove(); sessionStorage.setItem('pwa-dismissed','1'); };
    b2.appendChild(ic2); b2.appendChild(tx2); b2.appendChild(ib); b2.appendChild(cl2);
    document.body.appendChild(b2);
  });
}


if(!window._notifiedKeys) window._notifiedKeys = new Set();

// Global AudioContext - Mac'te her seferinde yeniden oluşturmak sorun çıkarabilir
if(!window._audioCtx) {
  try { window._audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}

function playBeep(type) {
  try {
    let ctx = window._audioCtx;
    if(!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      window._audioCtx = ctx;
    }
    // Mac Safari/Chrome'da suspended olabilir - resume et
    const play = () => {
      const patterns = {
        urgent:  [{f:880,d:0.15},{f:0,d:0.05},{f:880,d:0.15},{f:0,d:0.05},{f:1100,d:0.3}],
        warning: [{f:660,d:0.2},{f:0,d:0.1},{f:660,d:0.2}],
        info:    [{f:520,d:0.15},{f:0,d:0.08},{f:650,d:0.25}],
        win:     [{f:523,d:0.1},{f:659,d:0.1},{f:784,d:0.1},{f:1047,d:0.3}],
        lose:    [{f:400,d:0.2},{f:0,d:0.05},{f:300,d:0.3}]
      };
      let t = ctx.currentTime + 0.05;
      (patterns[type]||patterns.info).forEach(({f,d})=>{
        if(f>0){
          const o=ctx.createOscillator(); const g=ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value=f; o.type='sine';
          g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
          o.start(t); o.stop(t+d);
        }
        t+=d;
      });
    };
    if(ctx.state === 'suspended') {
      ctx.resume().then(play).catch(e=>console.warn('Audio resume failed:',e));
    } else {
      play();
    }
  } catch(e){ console.warn('playBeep error:', e); }
}

function showNotification(key, title, body, type, targetUser) {
  if(window._notifiedKeys.has(key)) return;
  const cu = state.currentUser;
  if(!cu) return;
  const isAdmin = cu.isAdmin;
  if(targetUser==='admin' && !isAdmin) return;
  if(targetUser==='rep' && isAdmin) return;
  if(targetUser && targetUser!=='all' && targetUser!=='admin' && targetUser!=='rep') {
    if(cu.displayName!==targetUser && !isAdmin) return;
  }
  window._notifiedKeys.add(key);
  playBeep(type||'info');
  const colors={info:'#2563eb',warning:'#d97706',urgent:'#dc2626',win:'#16a34a',lose:'#dc2626'};
  const icons ={info:'🔔',warning:'⚠️',urgent:'🚨',win:'🏆',lose:'❌'};
  const top = 20 + (document.querySelectorAll('.apro-notif').length * 95);

  notif.className = 'apro-notif';
  notif.style.cssText = 'position:fixed;top:'+top+'px;right:20px;background:#fff;border-left:5px solid '+(colors[type]||'#2563eb')+';border-radius:12px;padding:14px 16px;max-width:340px;width:330px;z-index:999999;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:slideInRight .3s ease;font-family:sans-serif;';

    + '<span style="font-size:22px;flex-shrink:0">'+(icons[type]||'🔔')+'</span>'
    + '<div style="flex:1">'
    + '<div style="font-weight:800;font-size:13px;color:#0f1f35;margin-bottom:3px">'+title+'</div>'
    + '<div style="font-size:12px;color:#4a6080;line-height:1.4">'+body+'</div>'

    + '<button onclick="this.closest(\'.apro-notif\').remove()" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:20px;line-height:1;padding:0">×</button>'
    + '</div>';
