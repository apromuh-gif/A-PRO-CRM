async function loadUsers() {
  try {
    const snap = await db.collection('users').get();
    if(snap.empty) {
      // İlk kurulum - kullanıcıları oluştur
      for(const u of DEFAULT_USERS) {
        await db.collection('users').doc(u.email).set({...u, active:true, createdAt: today()});
      }
      return DEFAULT_USERS.map(u=>({...u,active:true}));
    }
    return snap.docs.map(d=>({...d.data(), email:d.id}));
  } catch(e) { return DEFAULT_USERS.map(u=>({...u,active:true})); }
}

async function loadCollection(name) {
  try {
    const snap = await db.collection(name).orderBy('createdAt','asc').get();
    return snap.docs.map(d=>({...d.data(), id:d.id}));
  } catch(e) {
    try {
      const snap = await db.collection(name).get();
      return snap.docs.map(d=>({...d.data(), id:d.id}));
    } catch(e2) { return []; }
  }
}

async function saveDoc(collection, id, data) {
  await db.collection(collection).doc(String(id)).set(data);
}

async function loadTargets() {
  try {
    const snap = await db.collection('settings').doc('targets').get();
    if(snap.exists) return snap.data();
    return { company: 0, reps: {} };
  } catch(e) { return { company: 0, reps: {} }; }
}

async function saveTargets(targets) {
  try {
    // Tüm değerleri Number'a çevir (string kalmasın)
    const clean = {
      company: Number(targets.company)||0,
      serviceCompany: Number(targets.serviceCompany)||0,
      reps: {},
      serviceReps: {}
    };
    Object.keys(targets.reps||{}).forEach(k=>{ clean.reps[k] = Number(targets.reps[k])||0; });
    Object.keys(targets.serviceReps||{}).forEach(k=>{ clean.serviceReps[k] = Number(targets.serviceReps[k])||0; });
    targets = clean;
    await db.collection('settings').doc('targets').set(targets);
    state.targets = targets;
    showToast('✅ Hedefler kaydedildi!');
  } catch(e) { showToast('❌ Hedef kaydedilemedi!','#dc2626'); }
}

async function deleteDoc(collection, id) {

function h(tag, attrs={}, ...children) {
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)) {
    if(k==='style'&&typeof v==='object') Object.assign(el.style, v);
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='className') el.className=v;
    else el.setAttribute(k,v);
  }
  for(const c of children.flat()) {
    if(c==null||c===false||c===undefined) continue;
    el.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(String(c)) : c);
  }
  return el;
}
function badge(lbl, color) {
  return h('span',{style:{background:color+'22',color,padding:'4px 11px',borderRadius:'20px',fontSize:'12px',fontWeight:'700',whiteSpace:'nowrap',border:'1px solid '+color+'44'}},lbl);
}
function tag(lbl) {
  return h('span',{style:{background:'#d8e4f0',color:'#1e3a5f',padding:'4px 10px',borderRadius:'6px',fontSize:'12px',fontWeight:'500',whiteSpace:'nowrap',border:'1px solid #b8c8de'}},lbl);
}
function lbl(text) {
  return h('label',{style:{display:'block',fontSize:'12px',color:'#4a6080',marginBottom:'5px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'.05em'}},text);
}
function btn(text, onClick, bg, fg='#fff', p='10px 18px', extra={}) {
  const el = h('button',{onClick,style:{background:bg,border:'none',borderRadius:'9px',padding:p,color:fg,fontWeight:'600',fontSize:'14px',cursor:'pointer',fontFamily:"'Inter',sans-serif",transition:'filter .15s',...extra}},text);
  el.addEventListener('mouseenter',()=>el.style.filter='brightness(1.1)');
  el.addEventListener('mouseleave',()=>el.style.filter='none');
  return el;
}
function inp(placeholder, value, onChange, type='text', extra={}) {
  const el = h('input',{type,placeholder,value:value||'',style:{width:'100%',padding:'10px 13px',background:'#edf5fc',border:'1.5px solid #90b0cc',borderRadius:'8px',color:'#0f1f35',fontSize:'14px',boxSizing:'border-box',fontFamily:"'Inter',sans-serif",...extra}});
  el.addEventListener('focus',()=>el.style.borderColor=ACC);
  el.addEventListener('blur',()=>el.style.borderColor='#b8c8de');
  el.addEventListener('input', e=>onChange(e.target.value));
  return el;
}
function sel(options, value, onChange, extra={}) {
  const el = h('select',{style:{width:'100%',padding:'10px 13px',background:'#edf5fc',border:'1.5px solid #90b0cc',borderRadius:'8px',color:'#0f1f35',fontSize:'14px',boxSizing:'border-box',fontFamily:"'Inter',sans-serif",...extra}});
  options.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o.v!==undefined?o.v:o;
    opt.textContent = o.l!==undefined?o.l:o;
    if(String(o.v!==undefined?o.v:o)===String(value)) opt.selected=true;
    el.appendChild(opt);
  });
  el.addEventListener('change', e=>onChange(e.target.value));
  return el;
}
function field(labelTxt, child, half=false) {
  return h('div',{style:{marginBottom:'13px',flex:half?'1 1 45%':'1 1 100%',minWidth:half?'150px':'0'}},lbl(labelTxt),child);
}
function row(...children) {
  return h('div',{style:{display:'flex',gap:'12px',flexWrap:'wrap'}},...children);
}
function modal(title, content, onClose, maxWidth='640px') {
  const box = h('div',{style:{background:'#edf5fc',border:'1px solid #b0c8e0',borderRadius:'16px',padding:'28px',width:'100%',maxWidth,maxHeight:'92vh',overflowY:'auto',boxShadow:'0 20px 50px rgba(30,58,95,.2)'}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px',paddingBottom:'16px',borderBottom:'1px solid #d0daea'}},
      h('h3',{style:{margin:'0',color:'#0f1f35',fontSize:'20px',fontWeight:'800',color:'#0f1f35'}},title),
      h('button',{onClick:onClose,style:{background:'#d0e4f4',border:'none',color:'#4a6080',cursor:'pointer',fontSize:'18px',width:'32px',height:'32px',borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center'}},'×')
    ),

  const bg = h('div',{style:{position:'fixed',inset:'0',background:'rgba(15,31,53,.5)',zIndex:'999',display:'flex',alignItems:'center',justifyContent:'center',padding:'16px',backdropFilter:'blur(3px)'}},box);
  bg.addEventListener('click',e=>{if(e.target===bg)onClose();});
  return bg;
}

let loginState = {email:'',pw:'',err:'',attempts:0,locked:false};

function renderLogin() {
  async function doLogin() {
    if(loginState.locked) return;
    const user = state.users.find(u=>
      u.email.toLowerCase()===loginState.email.trim().toLowerCase() &&
      u.password===loginState.pw &&
      u.active!==false
    );
    if(user) {
      setState({currentUser:user, view:'app', loading:true});
      await loadAllData();
      setState({loading:false});
    } else {
      loginState.attempts++;
      const emailExists = state.users.find(u=>u.email.toLowerCase()===loginState.email.trim().toLowerCase());
      const inactive = emailExists && emailExists.active===false;
      loginState.err = inactive ? 'Bu hesap pasif. Yöneticiye başvurun.' : emailExists ? 'Şifre hatalı.' : 'E-posta tanınmıyor.';
      loginState.pw = '';
      if(loginState.attempts>=5) loginState.locked=true;
      renderLoginForm();
    }
  }

  function renderLoginForm() {
    const root = document.getElementById('root');
    root.innerHTML='';

    const emailInp = inp('e-posta@a-pro.com.tr', loginState.email, v=>{loginState.email=v;loginState.err='';});
    const pwInp = inp('••••••', loginState.pw, v=>{loginState.pw=v;loginState.err='';}, 'password', {letterSpacing:'0.18em',textAlign:'center',fontSize:'16px'});
    pwInp.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

    const errDiv = loginState.err ? h('div',{style:{background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:'9px',padding:'10px 14px',color:'#dc2626',fontSize:'13px',marginBottom:'14px',textAlign:'center'}},loginState.err) : null;

    const content = loginState.locked
      ? h('div',{style:{background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:'12px',padding:'20px',textAlign:'center'}},
          h('div',{style:{fontSize:'28px',marginBottom:'8px'}},'🚫'),
          h('div',{style:{color:'#dc2626',fontWeight:'700',fontSize:'15px',marginBottom:'4px'}},'Erişim Engellendi'),
          h('div',{style:{color:'#ef4444',fontSize:'13px'}},'5 hatalı deneme. Sayfayı yenileyip tekrar deneyin.')
        )
      : h('div',{},
          field('E-posta', emailInp),
          field('Şifre', pwInp),
          errDiv||h('span'),
          btn('Giriş Yap', doLogin, 'linear-gradient(135deg,#2563eb,#1d4ed8)', '#fff', '13px 16px', {width:'100%',fontSize:'15px',borderRadius:'10px',fontWeight:'700',boxShadow:'0 4px 12px rgba(37,99,235,.3)'}),
          h('div',{style:{textAlign:'center',marginTop:'16px',fontSize:'12px',color:'#7a90aa'}},'Yetkisiz erişim yasaktır.')
        );

    root.appendChild(
      h('div',{style:{minHeight:'100vh',background:'linear-gradient(160deg,#0f2040 0%,#1e3a6e 50%,#1a3060 100%)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Inter',sans-serif"}},
        h('div',{style:{background:'#ffffff',border:'none',borderRadius:'20px',padding:'44px 40px',width:'100%',maxWidth:'400px',animation:'fu .35s ease',boxShadow:'0 25px 60px rgba(15,31,53,.35)'}},
          h('div',{style:{textAlign:'center',marginBottom:'28px'}},
            h('div',{style:{width:'60px',height:'60px',background:'linear-gradient(135deg,#2563eb,#1d4ed8)',borderRadius:'16px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'28px',margin:'0 auto 16px',boxShadow:'0 6px 16px rgba(37,99,235,.35)'}},'⚡'),
            h('div',{style:{fontWeight:'800',fontSize:'22px',color:'#0f1f35',marginBottom:'6px'}},'A-PRO İş Takip CRM'),
            h('div',{style:{fontSize:'12px',color:'#4a6080',textTransform:'uppercase',letterSpacing:'0.08em'}},'Mühendislik · Satış & Servis')
          ),
          content
        )
      )
    );
    setTimeout(()=>emailInp.focus(),100);
  }

  renderLoginForm();
}

async function delItem(col, id) {
  if(!confirm('Silmek istiyor musunuz?')) return;
  await deleteDoc(col, id);
  if(col==='customers') setState({customers:state.customers.filter(x=>x.id!==id)});
  else if(col==='opportunities') setState({opportunities:state.opportunities.filter(x=>x.id!==id)});
  else if(col==='proposals') setState({proposals:state.proposals.filter(x=>x.id!==id)});
  else if(col==='services') setState({services:state.services.filter(x=>x.id!==id)});
  else if(col==='maintenances') setState({maintenances:state.maintenances.filter(x=>x.id!==id)});
  showToast('🗑 Silindi.');
}

function buildBackupModal() {
  const fileInput = h('input',{type:'file',accept:'.json',style:{display:'none'}});
  const statusDiv = h('div',{style:{display:'none'}});
  let drag = false;

  async function restoreFromJSON(file) {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const d = JSON.parse(e.target.result);
        if(!d.customers) throw new Error('Geçersiz dosya');
        if(!confirm('Mevcut tüm veriler silinip yedekten geri yüklenecek. Emin misiniz?')) return;

        statusDiv.style.display='block';
        statusDiv.style.background='#1a1a0f';
        statusDiv.style.border='1px solid #d97706';
        statusDiv.style.color='#fbbf24';
        statusDiv.textContent='⏳ Yükleniyor…';

        // Firebase'e yaz
        const cols = ['customers','opportunities','proposals','services','maintenances'];
        for(const col of cols) {
          // Önce mevcutları sil
          const snap = await db.collection(col).get();
          for(const doc of snap.docs) await doc.ref.delete();
          // Yenilerini yaz
          for(const item of (d[col]||[])) {
            await db.collection(col).doc(String(item.id)).set(item);
          }
        }
        // State güncelle
        state.customers = d.customers||[];
        state.opportunities = d.opportunities||[];
        state.proposals = d.proposals||[];
        state.services = d.services||[];
        state.maintenances = d.maintenances||[];

        statusDiv.style.background='#0f2a1a';
        statusDiv.style.border='1px solid #10b981';
        statusDiv.style.color='#4ade80';
        statusDiv.textContent='✅ Veri başarıyla geri yüklendi!';
        setTimeout(()=>setState({modal:null}),1500);
      } catch(err) {
        statusDiv.style.display='block';
        statusDiv.style.background='#2a0f0f';
        statusDiv.style.border='1px solid #ef4444';
        statusDiv.style.color='#f87171';
        statusDiv.textContent='❌ Geçersiz dosya. Lütfen doğru JSON yedek dosyasını seçin.';
      }
    };
    reader.readAsText(file);
  }

  fileInput.addEventListener('change', e=>restoreFromJSON(e.target.files[0]));

  const dropZone = h('div',{style:{border:`2px dashed ${G4}`,borderRadius:'10px',padding:'20px',textAlign:'center',cursor:'pointer',background:G,marginBottom:'4px'}},
    h('div',{style:{fontSize:'28px',marginBottom:'6px'}},'📂'),
    h('div',{style:{color:T3,fontSize:'13px'}},'JSON yedek dosyasını sürükleyin veya tıklayın'),
    fileInput
  );
  dropZone.addEventListener('click',()=>fileInput.click());
  dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.style.borderColor='#6366f1';dropZone.style.background='#1c2128';});
  dropZone.addEventListener('dragleave',()=>{dropZone.style.borderColor=G4;dropZone.style.background=G;});
  dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.style.borderColor=G4;dropZone.style.background=G;restoreFromJSON(e.dataTransfer.files[0]);});

  statusDiv.style.padding='10px 14px';
  statusDiv.style.borderRadius='8px';
  statusDiv.style.fontSize='13px';
  statusDiv.style.marginTop='10px';

  const content = h('div',{},
    h('div',{style:{background:'#0f0f0f',borderRadius:'10px',padding:'14px',marginBottom:'16px',border:`1px solid ${G3}`}},
      lbl('Mevcut Veri'),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'6px',marginTop:'8px'}},
        ...[{l:'Firma',v:state.customers.length,c:'#6366f1'},{l:'Fırsat',v:state.opportunities.length,c:'#f97316'},{l:'Teklif',v:state.proposals.length,c:'#3b82f6'},{l:'T.Servis',v:state.services.length,c:'#06b6d4'},{l:'P.Bakım',v:state.maintenances.length,c:'#10b981'}].map(s=>
          h('div',{style:{textAlign:'center',background:G2,borderRadius:'8px',padding:'8px 2px',border:`1px solid ${G4}`}},
            h('div',{style:{fontSize:'18px',fontWeight:'700',color:s.c}},String(s.v)),
            h('div',{style:{fontSize:'10px',color:T3}},s.l)
          )
        )
      )
    ),
    h('div',{style:{fontWeight:'700',color:T1,marginBottom:'10px',fontSize:'13px'}},'📥 Yedek Al'),
    h('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'18px'}},
      h('button',{onClick:dlJSON,style:{display:'flex',alignItems:'center',gap:'10px',background:G,border:`1px solid ${G3}`,borderRadius:'10px',padding:'12px 14px',cursor:'pointer',width:'100%',fontFamily:"'DM Sans',sans-serif"}},
        h('span',{style:{fontSize:'24px'}},'📄'),
        h('div',{},h('div',{style:{color:'#60a5fa',fontWeight:'700',fontSize:'13px'}},'JSON Yedek İndir'),h('div',{style:{color:T3,fontSize:'11px'}},'Geri yüklenebilir'))
      ),
      h('button',{onClick:dlCSV,style:{display:'flex',alignItems:'center',gap:'10px',background:G,border:`1px solid ${G3}`,borderRadius:'10px',padding:'12px 14px',cursor:'pointer',width:'100%',fontFamily:"'DM Sans',sans-serif"}},
        h('span',{style:{fontSize:'24px'}},'📊'),
        h('div',{},h('div',{style:{color:'#4ade80',fontWeight:'700',fontSize:'13px'}},'Excel/CSV İndir'),h('div',{style:{color:T3,fontSize:'11px'}},'Google Sheets veya Excel'))
      )
    ),
    h('div',{style:{fontWeight:'700',color:T1,marginBottom:'10px',fontSize:'13px'}},'📤 Geri Yükle'),
    dropZone,
    statusDiv,
    h('div',{style:{marginTop:'12px'}}),
    btn('Kapat',()=>setState({modal:null}),'#21262d','#8b949e','10px 16px',{width:'100%'})
  );
  return modal('🗄️ Yedekleme & Geri Yükleme', content, ()=>setState({modal:null}), '460px');
}

// Çeyrek dönem hesapla (Q1=0-2, Q2=3-5, Q3=6-8, Q4=9-11)
function getQuarter(date) {
  return Math.floor(date.getMonth()/3);
}
function getQuarterName(year, q) {
  var names = ["Ocak-Mart","Nisan-Haziran","Temmuz-Eylül","Ekim-Aralık"];
  return names[q]+" "+year;
}

// Rapor için veri hazırla
function prepareReportData() {
  var O=state.opportunities, P=state.proposals, S=state.services, C=state.customers;
  var LOST=["KAÇTI","NO GO","FIRSAT ÖLDÜ"];
  var now=new Date();
  var totalWon=O.filter(function(o){return o.stage==="KAZANILDI";}).reduce(function(a,o){return a+(Number(o.value)||0);},0);
  var totalPipe=O.filter(function(o){return !LOST.includes(o.stage)&&o.stage!=="KAZANILDI";}).reduce(function(a,o){return a+(Number(o.value)||0);},0);
  var totalLost=O.filter(function(o){return LOST.includes(o.stage);}).reduce(function(a,o){return a+(Number(o.value)||0);},0);
  var compTarget=(state.targets&&state.targets.company)||0;
  var targetPct=compTarget>0?Math.round(totalWon/compTarget*100):0;
  var propWon=P.filter(function(p){return p.status==="Onaylandı";}).reduce(function(a,p){return a+(Number(p.amount)||0);},0);
  var propPending=P.filter(function(p){return p.status==="Gönderildi"||p.status==="Hazırlanıyor";}).reduce(function(a,p){return a+(Number(p.amount)||0);},0);
  var tenDaysAgo=new Date(); tenDaysAgo.setDate(tenDaysAgo.getDate()-10);
  var needFollow=O.filter(function(o){if(LOST.includes(o.stage)||o.stage==="KAZANILDI")return false;if(!o.updatedAt&&!o.createdAt)return true;return new Date(o.updatedAt||o.createdAt)<tenDaysAgo;}).length;
  var repData=state.users.filter(function(u){return u.active!==false&&!u.isAdmin;}).map(function(u){
    var repO=O.filter(function(o){return o.assignedTo===u.displayName;});
    var won=repO.filter(function(o){return o.stage==="KAZANILDI";});
    var lost=repO.filter(function(o){return LOST.includes(o.stage);});
    var wonVal=won.reduce(function(a,o){return a+(Number(o.value)||0);},0);
    var hitDenom=won.length+lost.length;
    var hitRate=hitDenom>0?Math.round(won.length/hitDenom*100):0;
    var target=(state.targets&&state.targets.reps&&state.targets.reps[u.displayName])||0;
    var targetP=target>0?Math.round(wonVal/target*100):0;
    return {name:u.displayName,total:repO.length,wonCount:won.length,lostCount:lost.length,wonVal:wonVal,hitRate:hitRate,target:target,targetP:targetP};
  });
  var sectorMap={};
  O.forEach(function(o){var s=o.sector||"Diğer";if(!sectorMap[s])sectorMap[s]={val:0,cnt:0};sectorMap[s].val+=Number(o.value)||0;sectorMap[s].cnt++;});
  var topSectors=Object.entries(sectorMap).sort(function(a,b){return b[1].val-a[1].val;}).slice(0,5).map(function(e){return e[0]+": "+e[1].cnt+" firsat EUR "+e[1].val.toLocaleString("tr-TR");}).join("; ");
  var stageText=STAGES.map(function(s){var items=O.filter(function(o){return o.stage===s;});if(!items.length)return "";return s+": "+items.length+" adet EUR "+items.reduce(function(a,o){return a+(Number(o.value)||0);},0).toLocaleString("tr-TR");}).filter(Boolean).join("; ");
  var repLines=repData.map(function(r){return "- "+r.name+": "+r.total+" firsat, "+r.wonCount+" kazanildi, "+r.lostCount+" kacti, Hit Rate: %"+r.hitRate+", Ciro: EUR "+r.wonVal.toLocaleString("tr-TR")+", Hedef: EUR "+r.target.toLocaleString("tr-TR")+" (%"+r.targetP+")";}).join("\n");
  return {O,P,S,C,LOST,now,totalWon,totalPipe,totalLost,compTarget,targetPct,propWon,propPending,needFollow,repData,topSectors,stageText,repLines};
}

}

function printDashboard() {
  const O = state.opportunities;
  const P = state.proposals;
  const S = state.services;
  const LOST = ["KAÇTI","NO GO","FIRSAT ÖLDÜ"];
  const totalWon = O.filter(o=>o.stage==='KAZANILDI').reduce((a,o)=>a+(Number(o.value)||0),0);
  const totalPipe = O.filter(o=>!LOST.includes(o.stage)&&o.stage!=='KAZANILDI').reduce((a,o)=>a+(Number(o.value)||0),0);
  const compTarget = state.targets?.company || 0;
  const pct = compTarget > 0 ? Math.min(100,Math.round(totalWon/compTarget*100)) : 0;

  // Temsilci verileri
  const repRows = state.users.filter(u=>u.active!==false&&!u.isAdmin).map(u=>{
    const repO = O.filter(o=>o.assignedTo===u.displayName);
    const won = repO.filter(o=>o.stage==='KAZANILDI').length;
    const lostC = repO.filter(o=>LOST.includes(o.stage)).length;
    const wonVal = repO.filter(o=>o.stage==='KAZANILDI').reduce((a,o)=>a+(Number(o.value)||0),0);
    const hitDenom = won + lostC;
    const hit = hitDenom > 0 ? Math.round(won/hitDenom*100) : 0;
    const target = state.targets?.reps?.[u.displayName] || 0;
    const targetPct = target > 0 ? Math.min(100,Math.round(wonVal/target*100)) : 0;
    return `<tr>
      <td>${u.displayName}</td>
      <td style="font-weight:700;color:#2563eb">${eur(wonVal)}</td>
      <td>${repO.length}</td>
      <td style="color:#16a34a;font-weight:700">${won}</td>
      <td style="color:#dc2626;font-weight:700">${lostC}</td>
      <td style="font-weight:700">${hit}%</td>
      <td>${eur(target)}</td>
      <td style="font-weight:700;color:${targetPct>=100?'#16a34a':targetPct>=50?'#d97706':'#dc2626'}">${target?targetPct+'%':'-'}</td>
    </tr>`;
  }).join('');

  // Aşama verileri
  const stageRows = STAGES.map(s=>{
    const items = O.filter(o=>o.stage===s);
    const val = items.reduce((a,o)=>a+(Number(o.value)||0),0);
    if(!items.length) return '';
    return `<tr><td>${s}</td><td>${items.length}</td><td style="font-weight:700;color:#2563eb">${eur(val)}</td></tr>`;
  }).join('');

  const printHTML = `<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"/>
<title>A-PRO CRM — Yönetici Raporu</title>
<style>
  body{font-family:Arial,sans-serif;padding:24px;color:#1e293b;font-size:13px}
  h1{color:#1e2d4a;font-size:20px;margin-bottom:4px}
  h2{color:#1e2d4a;font-size:14px;margin:20px 0 10px;border-bottom:2px solid #1e2d4a;padding-bottom:6px}
  .meta{font-size:11px;color:#64748b;margin-bottom:20px}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .kpi{background:#f0f5fc;border:1px solid #b0c8e0;border-radius:8px;padding:12px;text-align:center}
  .kpi-val{font-size:20px;font-weight:800;color:#2563eb}
  .kpi-label{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
  .target-bar{height:16px;background:#e0e7ff;border-radius:8px;overflow:hidden;margin:8px 0}
  .target-fill{height:100%;background:linear-gradient(90deg,#16a34a,#22c55e);border-radius:8px}
  table{width:100%;border-collapse:collapse;margin-bottom:20px}
  th{background:#1e2d4a;color:#fff;padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase}
  td{padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px}
  tr:nth-child(even){background:#f8fafc}
  @media print{body{padding:10px}.no-print{display:none}}
</style></head>
<body>
  <h1>⚡ A-PRO İş Takip CRM — Yönetici Raporu</h1>
  <div class="meta">Yazdırma tarihi: ${new Date().toLocaleString('tr-TR')} · Toplam ${O.length} fırsat · ${state.customers.length} firma</div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-val">${eur(totalWon)}</div><div class="kpi-label">Kazanılan Ciro</div></div>
    <div class="kpi"><div class="kpi-val">${eur(totalPipe)}</div><div class="kpi-label">Pipeline</div></div>
    <div class="kpi"><div class="kpi-val">${eur(compTarget)}</div><div class="kpi-label">Şirket Hedefi</div></div>
    <div class="kpi"><div class="kpi-val" style="color:${pct>=100?'#16a34a':pct>=50?'#d97706':'#dc2626'}">${pct}%</div><div class="kpi-label">Hedefe Ulaşma</div></div>
  </div>
  ${compTarget ? `<div class="target-bar"><div class="target-fill" style="width:${pct}%"></div></div>
  <div style="font-size:11px;color:#64748b;margin-bottom:16px">${eur(totalWon)} kazanıldı / ${eur(compTarget)} hedef</div>` : ''}
  <h2>👥 Satış Temsilcisi Performans Tablosu</h2>
  <table>
    <thead><tr><th>Temsilci</th><th>Ciro</th><th>Fırsat</th><th>Kazanıldı</th><th>Kaçtı</th><th>Hit Rate</th><th>Hedef</th><th>Hedef %</th></tr></thead>
    <tbody>${repRows||'<tr><td colspan="8" style="text-align:center;color:#94a3b8">Veri yok</td></tr>'}</tbody>
  </table>
  <h2>🎯 Aşama Bazlı Fırsat Dağılımı</h2>
  <table>
    <thead><tr><th>Aşama</th><th>Fırsat Sayısı</th><th>Toplam Değer</th></tr></thead>
    <tbody>${stageRows||'<tr><td colspan="3" style="text-align:center;color:#94a3b8">Veri yok</td></tr>'}</tbody>
  </table>
  <div style="margin-top:30px;font-size:10px;color:#94a3b8;text-align:center">A-PRO Mühendislik · CRM Sistemi · Gizlidir</div>
</body></html>`;

  const w = window.open('','_blank');
  w.document.write(printHTML);
  w.document.close();
  w.print();
}

function buildTargetsModal() {
  const targets = JSON.parse(JSON.stringify(state.targets || {company:0, serviceCompany:0, reps:{}, serviceReps:{}}));
  if(!targets.serviceReps) targets.serviceReps = {};
  if(!targets.serviceCompany) targets.serviceCompany = 0;
  const activeReps = state.users.filter(u=>u.active!==false);

  const container = h('div',{});

  function makeNumInput(getValue, setValue, bg, color, fontSize) {
    const initVal = Number(getValue())||0;
    const el = h('input',{type:'text',placeholder:'0',
      value: initVal > 0 ? initVal.toLocaleString('tr-TR') : '',
      style:{flex:'1',padding:'10px 13px',background:bg||'#ffffff',border:'1.5px solid #90bcd8',borderRadius:'9px',
        color:color||'#0f1f35',fontSize:fontSize||'15px',fontWeight:'600',fontFamily:"'Inter',sans-serif",outline:'none'}});
    el.addEventListener('input', e=>{
      // Sadece rakam ve nokta(ayraç) kabul et, değeri hesapla
      const raw = e.target.value.replace(/[^0-9]/g,'');
      setValue(Number(raw)||0);
      // Cursor pozisyonunu koru
      const pos = e.target.selectionStart;
      e.target.value = e.target.value.replace(/[^0-9.]/g,'');
      e.target.setSelectionRange(pos, pos);
    });
    el.addEventListener('blur', e=>{
      const cur = Number(getValue())||0;
      e.target.value = cur > 0 ? cur.toLocaleString('tr-TR') : '';
    });
    return el;
  }

  function rerender() {
    container.innerHTML = '';

    // ── Şirket Satış Hedefi ──

      h('div',{style:{background:'linear-gradient(135deg,#1e2d4a,#2563eb)',borderRadius:'14px',padding:'20px',marginBottom:'16px'}},

              el.style.padding = '12px 14px'; el.style.border = '1.5px solid rgba(255,255,255,.3)';
              return el;

            )
          ),
          // Teknik servis hedefi
          h('div',{},
            h('div',{style:{fontSize:'11px',color:'#4a6080',fontWeight:'600',marginBottom:'5px'}},'🔧 TEKNİK SERVİS HEDEFİ'),
            h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'6px'}},
              makeNumInput(()=>svcTarget, v=>targets.serviceReps[u.displayName]=v),
              h('div',{style:{color:'#4a6080',fontSize:'13px',fontWeight:'600',whiteSpace:'nowrap'}},'€/Yıl'),
              h('span',{style:{fontSize:'13px',fontWeight:'700',color:svcPct>=100?'#16a34a':svcPct>=50?'#d97706':'#dc2626'}},svcTarget?svcPct+'%':'-')

      )
    );
  }

  rerender();
  return modal('🎯 Hedef Yönetimi', container, ()=>setState({modal:null}), '620px');
}

function buildAdminModal() {
  let users = [...state.users];
  let adding = false;
  let editingId = null;
  let editPw = '';
  let newU = {email:'',password:'',displayName:'',isAdmin:false};
  let msgEl = null;

  function flash(txt, ok=true) {
    if(msgEl) { msgEl.textContent=txt; msgEl.style.color=ok?'#4ade80':'#f87171'; msgEl.style.display='block'; setTimeout(()=>{if(msgEl)msgEl.style.display='none';},3000); }
  }

  async function persistUsers(list) {
    for(const u of list) await db.collection('users').doc(u.email).set(u);
    const deleted = users.filter(ou=>!list.find(nu=>nu.email===ou.email));
    for(const u of deleted) await db.collection('users').doc(u.email).delete();
    users = list;
    state.users = list;
    rerender();
  }

  const container = h('div',{});
  msgEl = h('div',{style:{display:'none',padding:'8px 12px',borderRadius:'8px',fontSize:'12px',marginBottom:'8px',background:'#0f2a1a'}});

  function rerender() {
    container.innerHTML='';
    container.appendChild(msgEl);

    // Kullanıcı listesi
    const listDiv = h('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'14px'}});
    users.forEach(u=>{
      const card = h('div',{style:{background:G,border:`1px solid ${u.email===state.currentUser.email?'#6366f1':u.active!==false?G4:'#3b1a1a'}`,borderRadius:'10px',padding:'12px 14px'}});
      const topRow = h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'8px'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:'10px',flex:'1',minWidth:'0'}},
          h('div',{style:{width:'34px',height:'34px',borderRadius:'50%',background:u.active!==false?'linear-gradient(135deg,#6366f1,#8b5cf6)':'#374151',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:'700',color:'#fff',flexShrink:'0'}},u.displayName.slice(0,2).toUpperCase()),
          h('div',{style:{minWidth:'0'}},
            h('div',{style:{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap'}},
              h('span',{style:{fontWeight:'700',fontSize:'13px',color:u.active!==false?T1:T4}},u.displayName),
              u.isAdmin?h('span',{style:{background:'#7c3aed22',color:'#a78bfa',fontSize:'10px',fontWeight:'700',padding:'2px 7px',borderRadius:'9px'}},'YÖNETİCİ'):h('span'),
              u.active===false?h('span',{style:{background:'#3b1a1a',color:'#f87171',fontSize:'10px',fontWeight:'700',padding:'2px 7px',borderRadius:'9px'}},'PASİF'):h('span'),
              u.email===state.currentUser.email?h('span',{style:{background:'#0f2a1a',color:'#4ade80',fontSize:'10px',fontWeight:'700',padding:'2px 7px',borderRadius:'9px'}},'SİZ'):h('span')
            ),
            h('div',{style:{fontSize:'11px',color:T3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},u.email)
          )
        ),
        h('div',{style:{display:'flex',gap:'5px',flexShrink:'0'}},
          btn('🔑',()=>{editingId=editingId===u.email?null:u.email;editPw='';rerender();},'#1c2a3a','#58a6ff','5px 10px',{fontSize:'11px'}),
          btn(u.active!==false?'Pasif':'Aktif',async()=>{
            if(u.email===state.currentUser.email){flash('⚠ Kendi hesabınızı pasife alamazsınız.',false);return;}
            const list=users.map(x=>x.email===u.email?{...x,active:x.active===false}:x);
            await persistUsers(list); flash('✅ Durum güncellendi.');
          },u.active!==false?'#1a2a1a':'#2a1a1a',u.active!==false?'#4ade80':'#f87171','5px 10px',{fontSize:'11px'}),
          u.email!==state.currentUser.email?btn('Sil',async()=>{
            if(!confirm('Silinsin mi?'))return;
            await persistUsers(users.filter(x=>x.email!==u.email)); flash('✅ Silindi.');
          },'#3b1a1a','#f87171','5px 10px',{fontSize:'11px'}):h('span')
        )
      );
      card.appendChild(topRow);
      if(editingId===u.email) {
        const pwInp2 = inp('Yeni şifre',editPw,v=>editPw=v);
        pwInp2.addEventListener('keydown',async e=>{if(e.key==='Enter'){const list=users.map(x=>x.email===u.email?{...x,password:editPw}:x);await persistUsers(list);editingId=null;editPw='';flash('✅ Şifre güncellendi.');}});
        const pwRow = h('div',{style:{marginTop:'10px',display:'flex',gap:'8px',alignItems:'center'}},

      const nEmail=inp('kullanici@a-pro.com.tr',newU.email,v=>newU.email=v,'email');
      const cbAdmin=h('input',{type:'checkbox',style:{accentColor:'#6366f1'}});

// DASHBOARD YARDIMCI FONKSİYONLARI
// ═══════════════════════════════════════════════════════
function kpiCard(label, value, sub, color, icon) {
  return h('div',{style:{background:'#ffffff',border:`2px solid ${color}44`,borderRadius:'14px',padding:'18px 20px',boxShadow:'0 2px 8px rgba(30,58,95,.08)'}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}},
      h('div',{style:{fontSize:'11px',color:T3,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700'}},label),
      h('div',{style:{fontSize:'20px'}},icon)
    ),
    h('div',{style:{fontSize:'24px',fontWeight:'800',color,marginBottom:'4px'}},value),
    h('div',{style:{fontSize:'12px',color:T3}},sub)
  );
}

function card(title, content, extra={}) {
  return h('div',{style:{background:'#edf5fc',border:'1px solid #b0c8e0',borderRadius:'14px',boxShadow:'0 2px 8px rgba(20,40,80,.08)',padding:'20px',...extra}},
    h('h3',{style:{fontSize:'14px',fontWeight:'700',marginBottom:'16px',color:'#1e2d4a',borderBottom:'1px solid #c0d8f0',paddingBottom:'10px'}},title),
    content
  );
}

function barChart(items, maxVal, colorFn, labelFn, valueFn, subFn) {
  const div = h('div',{});
  if(!items.length) { div.appendChild(h('div',{style:{color:T3,fontSize:'13px',textAlign:'center',padding:'20px'}},'Veri yok.')); return div; }
  items.forEach(item => {
    const pct = maxVal > 0 ? (valueFn(item)/maxVal*100) : 0;
    const bar = h('div',{style:{marginBottom:'12px'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'5px'}},
        h('span',{style:{fontSize:'13px',color:T1,fontWeight:'600'}},labelFn(item)),
        h('div',{style:{display:'flex',gap:'12px',alignItems:'center'}},
          subFn ? h('span',{style:{fontSize:'11px',color:T3}},subFn(item)) : h('span'),
          h('span',{style:{fontSize:'13px',fontWeight:'700',color:colorFn(item)}},eur(valueFn(item)))
        )
      ),
      h('div',{style:{height:'8px',background:'#c8daea',borderRadius:'4px',overflow:'hidden'}},
        h('div',{style:{height:'100%',width:pct+'%',background:colorFn(item),borderRadius:'4px',transition:'width .4s ease'}})
      )
    );
    div.appendChild(bar);
  });
  return div;
}

function pieChart(segments, size=120) {
  const total = segments.reduce((a,s)=>a+s.value,0);
  if(!total) return h('div',{style:{color:T3,fontSize:'13px',textAlign:'center',padding:'16px'}},'Veri yok.');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 36 36');
  svg.setAttribute('width',size); svg.setAttribute('height',size);
  svg.style.transform = 'rotate(-90deg)';
  let offset = 0;
  segments.filter(s=>s.value>0).forEach(s => {
    const pct = s.value/total*100;
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx','18'); circle.setAttribute('cy','18'); circle.setAttribute('r','15.9');
    circle.setAttribute('fill','none'); circle.setAttribute('stroke',s.color);
    circle.setAttribute('stroke-width','3.2');
    circle.setAttribute('stroke-dasharray',`${pct} ${100-pct}`);
    circle.setAttribute('stroke-dashoffset',String(-offset));
    svg.appendChild(circle);
    offset += pct;
  });
  const legend = h('div',{style:{display:'flex',flexDirection:'column',gap:'6px',flex:'1'}});
  segments.filter(s=>s.value>0).forEach(s => {
    legend.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
      h('div',{style:{width:'10px',height:'10px',borderRadius:'3px',background:s.color,flexShrink:'0'}}),
      h('div',{style:{flex:'1'}},
        h('div',{style:{fontSize:'12px',fontWeight:'600',color:T1}},s.label),
        h('div',{style:{fontSize:'11px',color:T3}},Math.round(s.value/total*100)+'% · '+eur(s.value))
      )
    ));
  });
  return h('div',{style:{display:'flex',alignItems:'center',gap:'20px',flexWrap:'wrap'}},svg,legend);
}

function miniTable(headers, rows) {
  const thead = h('thead',{},h('tr',{style:{background:'#1e2d4a'}},
    ...headers.map(hh=>h('th',{style:{color:'#fff',padding:'9px 12px',fontSize:'11px',fontWeight:'700',textAlign:'left',whiteSpace:'nowrap'}},hh))
  ));
  const tbody = h('tbody',{});
  if(!rows.length) {
    tbody.appendChild(h('tr',{},h('td',{colspan:String(headers.length),style:{padding:'20px',textAlign:'center',color:T3,fontSize:'13px'}},'Veri yok.')));
  }
  rows.forEach((row,i) => {
    const tr = h('tr',{style:{background:i%2===0?'#ffffff':'#f0f5fc'},className:'rh'});
    row.forEach(cell => tr.appendChild(h('td',{style:{padding:'9px 12px',fontSize:'13px',borderTop:'1px solid #d0daea'}},cell)));
    tbody.appendChild(tr);
  });
  return h('div',{style:{overflowX:'auto'}},h('table',{style:{width:'100%',borderCollapse:'collapse',minWidth:'400px'}},thead,tbody));
}

function renderDashboardAdmin() {
  const O = state.opportunities;

  if(!state.adminDateFrom) state.adminDateFrom = '';
  if(!state.adminDateTo) state.adminDateTo = '';

  // Tarihe göre filtrele
  const OF = O.filter(o=>{
    if(!state.adminDateFrom && !state.adminDateTo) return true;
    const d = new Date(o.createdAt||o.updatedAt||'2020-01-01');
    if(state.adminDateFrom && d < new Date(state.adminDateFrom)) return false;
    if(state.adminDateTo && d > new Date(state.adminDateTo)) return false;

  const lost = OF.filter(o=>LOST.includes(o.stage)).length;
  const totalCount = OF.length;
  const avgDeal = totalCount ? totalAll/totalCount : 0;
  const winRate = totalCount ? Math.round(OF.filter(o=>o.stage==='KAZANILDI').length/totalCount*100) : 0;
  const serviceTotal = S.reduce((a,s)=>a+(Number(s.amount)||0),0);

// ═══════════════════════════════════════════════════════
// B — SATIŞ / PROJE DASHBOARD
// ═══════════════════════════════════════════════════════
function renderDashboardSales() {
  const O = state.opportunities;
  const P = state.proposals;
  const cu = state.currentUser;
  const LOST = ["KAÇTI","NO GO","FIRSAT ÖLDÜ"];

  // Tarih filtresi
  if(!state.salesDateFrom) state.salesDateFrom = '';
  if(!state.salesDateTo) state.salesDateTo = '';

  // Kullanıcı kendi fırsatları + tarih filtresi
  const baseO = cu?.isAdmin ? O : O.filter(o=>o.assignedTo===cu?.displayName);
  const myO = baseO.filter(o=>{
    if(!state.salesDateFrom && !state.salesDateTo) return true;
    const d = new Date(o.createdAt||o.updatedAt||'2020-01-01');
    if(state.salesDateFrom && d < new Date(state.salesDateFrom)) return false;
    if(state.salesDateTo && d > new Date(state.salesDateTo)) return false;
    return true;
  });
  const myP = cu?.isAdmin ? P : P.filter(p=>p.createdBy===cu?.displayName||p.assignedTo===cu?.displayName);

  const myPipeline = myO.filter(o=>!LOST.includes(o.stage)).reduce((a,o)=>a+(Number(o.value)||0),0);
  const myWon = myO.filter(o=>o.stage==='KAZANILDI').length;
  const myLostCount = myO.filter(o=>LOST.includes(o.stage)).length;
  const myTotal = myO.length;
  const hitRateDenom = myWon + myLostCount;
  const hitRate = hitRateDenom > 0 ? Math.round(myWon / hitRateDenom * 100) : 0;
  const myAvg = myTotal ? myO.reduce((a,o)=>a+(Number(o.value)||0),0)/myTotal : 0;
  const myProposalWon = myP.filter(p=>p.status==='Onaylandı').reduce((a,p)=>a+(Number(p.amount)||0),0);

  // ── repTarget: Firebase'den gelen reps objesinde key ara ──
  const cuName = (cu && cu.displayName) ? cu.displayName.trim() : '';
  let repTarget = 0;
  if(cuName && state.targets && state.targets.reps) {
    const reps = state.targets.reps;
    const repsKeys = Object.keys(reps);
    // 1. Birebir eşleşme
    if(reps[cuName] !== undefined) {
      repTarget = Number(reps[cuName]) || 0;
    }
    if(!repTarget) {
      // 2. Trim + lowercase
      const found = repsKeys.find(k => k.trim().toLowerCase() === cuName.toLowerCase());
      if(found) repTarget = Number(reps[found]) || 0;
    }
    if(!repTarget) {
      // 3. İlk kelime eşleşmesi
      const firstName = cuName.split(' ')[0].toLowerCase();
      const found2 = repsKeys.find(k => k.trim().toLowerCase().startsWith(firstName));
      if(found2) repTarget = Number(reps[found2]) || 0;
    }
  }
  const myWonVal = myO.filter(o=>o.stage==='KAZANILDI').reduce((a,o)=>a+(Number(o.value)||0),0);

  // Tarih filtresi kutusu
  const salesDateBox = h('div',{style:{background:'#ffffff',border:'1px solid #d0daea',borderRadius:'12px',padding:'14px 18px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap'}},
    h('span',{style:{fontSize:'13px',fontWeight:'600',color:'#1e2d4a'}},'📅 Tarih Aralığı:'),
    h('input',{type:'date',value:state.salesDateFrom||'',style:{padding:'7px 10px',border:'1.5px solid #b8d4ec',borderRadius:'8px',fontSize:'13px',fontFamily:"'Inter',sans-serif",color:'#0f1f35',outline:'none'},oninput:e=>{state.salesDateFrom=e.target.value;render();}}),
    h('span',{style:{color:'#64748b',fontSize:'13px'}},'—'),
    h('input',{type:'date',value:state.salesDateTo||'',style:{padding:'7px 10px',border:'1.5px solid #b8d4ec',borderRadius:'8px',fontSize:'13px',fontFamily:"'Inter',sans-serif",color:'#0f1f35',outline:'none'},oninput:e=>{state.salesDateTo=e.target.value;render();}}),
    btn('Temizle',()=>{state.salesDateFrom='';state.salesDateTo='';render();},'#f1f5f9','#4a6080','7px 14px',{fontSize:'12px',border:'1px solid #b0c8e0',borderRadius:'8px'}),
    (state.salesDateFrom||state.salesDateTo)?h('span',{style:{fontSize:'12px',color:'#2563eb',fontWeight:'600'}},myO.length+' / '+baseO.length+' fırsat gösteriliyor'):h('span')
  );

  // KPI
  const kpiGrid = h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'14px',marginBottom:'20px'}});
  [
    {l:'Toplam Pipeline',v:eur(myPipeline),s:myO.filter(o=>!LOST.includes(o.stage)).length+' aktif fırsat',c:'#2563eb',i:'🎯'},
    {l:'Hit Rate — Sonuçlanan İşlerin Satışa Dönme Oranı',v:hitRate+'%',s:'Sonuçlanan '+hitRateDenom+' işten '+myWon+' satışa dönüştü',c:hitRate>=50?'#16a34a':'#dc2626',i:'🏹'},
    {l:'Bireysel Hedef',v:repTarget>0?eur(repTarget):'Hedef yok',s:repTarget>0?'Gerçekleşen: '+eur(myWonVal)+' ('+Math.min(100,Math.round(myWonVal/repTarget*100))+'%)':'Hedef girilmedi',c:'#7c3aed',i:'🎯'},
    {l:'Şirket Yıllık Hedef',v:eur(state.targets?.company||0),s:(()=>{const t=state.targets?.company||0;const w=O.filter(o=>o.stage==='KAZANILDI').reduce((a,o)=>a+(Number(o.value)||0),0);return t>0?'Hedefe ulaşma: '+Math.min(100,Math.round(w/t*100))+'%':'Hedef girilmedi'})(),c:'#0891b2',i:'🏢'},
    {l:'Ortalama Satış Tutarı',v:eur(myAvg),s:'Kişisel ortalama',c:'#7c3aed',i:'📊'},
    {l:'Devam Eden Fırsat',v:String(myO.filter(o=>!LOST.includes(o.stage)&&o.stage!=='KAZANILDI').length),s:'Pipeline\'da aktif',c:'#ea580c',i:'⏳'},
    {l:'Kaybedilen Fırsat',v:String(myO.filter(o=>LOST.includes(o.stage)).length),s:'KAÇTI + NO GO + ÖLDÜ',c:'#dc2626',i:'❌'},
  ].forEach(k=>kpiGrid.appendChild(kpiCard(k.l,k.v,k.s,k.c,k.i)));

  // Takip gereken fırsatlar (son 10 günde güncellenmemiş)
  const tenDaysAgo = new Date(); tenDaysAgo.setDate(tenDaysAgo.getDate()-10);
  const needFollow = myO.filter(o=>{
    if(LOST.includes(o.stage)) return false;
    if(!o.updatedAt&&!o.createdAt) return true;
    const d = new Date(o.updatedAt||o.createdAt);
    return d < tenDaysAgo;
  }).sort((a,b)=>new Date(a.updatedAt||a.createdAt||0)-new Date(b.updatedAt||b.createdAt||0));

  const followRows = needFollow.map(o=>[
    h('span',{style:{fontWeight:'700',color:T1}},o.title||'-'),
    h('span',{},state.customers.find(c=>c.id===o.customerId)?.firmName||'-'),
    h('span',{style:{background:SC[o.stage]+'22',color:SC[o.stage],padding:'3px 9px',borderRadius:'10px',fontSize:'11px',fontWeight:'700'}},o.stage),
    h('span',{style:{fontWeight:'700',color:'#2563eb'}},eur(Number(o.value)||0)),
    h('span',{style:{color:'#dc2626',fontWeight:'600'}},o.updatedAt||o.createdAt||'Bilinmiyor'),
  ]);
  const followTable = miniTable(['Fırsat','Müşteri','Aşama','Değer','Son Güncelleme'],followRows);

  // Kişisel Aşama Dağılımı
  const myStageItems = STAGES.map(s=>({stage:s,val:myO.filter(o=>o.stage===s).reduce((a,o)=>a+(Number(o.value)||0),0),cnt:myO.filter(o=>o.stage===s).length})).filter(x=>x.cnt>0);
  const maxMS = Math.max(1,...myStageItems.map(x=>x.val));
  const myStageChart = barChart(myStageItems, maxMS, x=>SC[x.stage]||'#6366f1', x=>x.stage, x=>x.val, x=>x.cnt+'x');

  // Teklif durumları
  const propSeg = Object.keys(PS).map(s=>({label:s,value:myP.filter(p=>p.status===s).reduce((a,p)=>a+(Number(p.amount)||0),0),color:PS[s]})).filter(s=>s.value>0);

  // Hit Rate görsel
  const hitDiv = h('div',{style:{textAlign:'center',padding:'10px 0'}},
    h('div',{style:{fontSize:'56px',fontWeight:'900',color:hitRate>=50?'#16a34a':'#dc2626',lineHeight:'1'}},hitRate+'%'),
    h('div',{style:{fontSize:'12px',color:T4,marginBottom:'16px'}},`${hitRateDenom} sonuçlanan iş: ${myWon} Kazanıldı + ${myLostCount} Kaçtı`),
    h('div',{style:{height:'14px',background:'#e0e7ff',borderRadius:'7px',overflow:'hidden'}},
      h('div',{style:{height:'100%',width:hitRate+'%',background:hitRate>=50?'linear-gradient(90deg,#16a34a,#22c55e)':'linear-gradient(90deg,#dc2626,#f87171)',borderRadius:'7px',transition:'width .6s ease'}})
    ),
    h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'11px',color:T4,marginTop:'4px'}},
      h('span',{},'0%'), h('span',{},'Hedef: 50%'), h('span',{},'100%')
    )
  );

  return h('div',{style:{animation:'fu .3s ease'}},
    h('div',{style:{marginBottom:'16px'}},
      h('h2',{style:{fontSize:'18px',fontWeight:'800',color:'#1e2d4a'}},'📈 Satış / Proje Dashboard')
    ),
    salesDateBox,
    kpiGrid,
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',marginBottom:'16px'}},
      card('🎯 Hit Rate — Teklife Dönüşüm Oranı', hitDiv),
      card('📊 Kişisel Aşama & Ciro Dağılımı', myStageChart)
    ),
    h('div',{style:{marginBottom:'16px'}},
      card('⚠️ Takip Gereken Fırsatlar (10+ Gün Güncellenmemiş)', followTable,
        needFollow.length ? {border:'2px solid #f97316'} : {})
    ),
    h('div',{style:{marginBottom:'16px'}},
      card('🏢 Toplam Ciro & Şirket Yıllık Hedefi', (()=>{
        const compTarget = state.targets?.company || 0;
        const totalWon = O.filter(o=>o.stage==='KAZANILDI').reduce((a,o)=>a+(Number(o.value)||0),0);
        const totalPipe = O.filter(o=>!LOST.includes(o.stage)&&o.stage!=='KAZANILDI').reduce((a,o)=>a+(Number(o.value)||0),0);
        const pct = compTarget > 0 ? Math.min(100,Math.round(totalWon/compTarget*100)) : 0;
        const pctPipe = compTarget > 0 ? Math.min(100-pct,Math.round(totalPipe/compTarget*100)) : 0;
        const div = h('div',{});
        if(!compTarget) {
          div.appendChild(h('div',{style:{textAlign:'center',padding:'20px',color:'#d97706',fontSize:'14px',background:'#fffbeb',borderRadius:'10px',border:'1px solid #fde68a'}},'⚠️ Şirket hedefi henüz girilmemiş.'));
          return div;
        }
        div.appendChild(h('div',{style:{marginBottom:'16px'}},
          h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'8px'}},
            h('div',{},
              h('div',{style:{fontSize:'28px',fontWeight:'900',color:pct>=100?'#16a34a':pct>=70?'#d97706':'#2563eb'}},pct+'%'),
              h('div',{style:{fontSize:'12px',color:'#4a6080'}},'Hedefe Ulaşma Oranı')
            ),
            h('div',{style:{textAlign:'right'}},
              h('div',{style:{fontSize:'14px',fontWeight:'700',color:'#16a34a'}},eur(totalWon)+' Kazanıldı'),
              h('div',{style:{fontSize:'12px',color:'#4a6080'}},'Hedef: '+eur(compTarget))
            )
          ),
          h('div',{style:{height:'20px',background:'#e0e7ff',borderRadius:'10px',overflow:'hidden',display:'flex'}},
            h('div',{style:{width:pct+'%',background:'linear-gradient(90deg,#16a34a,#22c55e)',borderRadius:'10px 0 0 10px',transition:'width .6s ease'}}),
            h('div',{style:{width:pctPipe+'%',background:'linear-gradient(90deg,#f59e0b,#fbbf24)',transition:'width .6s ease'}})
          ),
          h('div',{style:{display:'flex',gap:'16px',marginTop:'8px',fontSize:'12px',flexWrap:'wrap'}},
            h('div',{style:{display:'flex',alignItems:'center',gap:'5px'}},h('div',{style:{width:'10px',height:'10px',borderRadius:'3px',background:'#16a34a'}}),h('span',{style:{color:'#4a6080'}},'Kazanıldı: '+eur(totalWon))),
            h('div',{style:{display:'flex',alignItems:'center',gap:'5px'}},h('div',{style:{width:'10px',height:'10px',borderRadius:'3px',background:'#f59e0b'}}),h('span',{style:{color:'#4a6080'}},'Pipeline: '+eur(totalPipe))),
            h('div',{style:{display:'flex',alignItems:'center',gap:'5px'}},h('div',{style:{width:'10px',height:'10px',borderRadius:'3px',background:'#e0e7ff',border:'1px solid #b0c8e0'}}),h('span',{style:{color:'#4a6080'}},'Kalan: '+eur(Math.max(0,compTarget-totalWon-totalPipe))))
          )
        ));
        // Temsilci bazlı ilerleme

        state.users.filter(u=>u.active!==false&&!u.isAdmin).forEach(u=>{
          const repsObj = (state.targets&&state.targets.reps)||{};

          const w = O.filter(o=>o.assignedTo===u.displayName&&o.stage==='KAZANILDI').reduce((a,o)=>a+(Number(o.value)||0),0);

          )
        ));
        return div;
      })())
    ),
    h('div',{style:{marginBottom:'16px'}},
      card('🔧 Temsilci Bazlı T.Servis Hedef Gerçekleşme', (()=>{
        const svcDiv = h('div',{});

            if(k===u.displayName||k.toLowerCase()===u.displayName.toLowerCase()||k.replace(/\s+/g,'')===u.displayName.replace(/\s+/g,'')) { t=v; break; }
          }

          const p3 = t>0?Math.min(100,Math.round(w2/t*100)):0;

// ═══════════════════════════════════════════════════════
// C — PAZARLAMA / İŞ GELİŞTİRME DASHBOARD
// ═══════════════════════════════════════════════════════
function renderDashboardMarketing() {
  const O_ALL = state.opportunities;
  const C = state.customers;
  const LOST = ["KAÇTI","NO GO","FIRSAT ÖLDÜ"];

  // Tarih filtresi
  if(!state.mktDateFrom) state.mktDateFrom = '';
  if(!state.mktDateTo) state.mktDateTo = '';
  const O = O_ALL.filter(o=>{
    if(!state.mktDateFrom && !state.mktDateTo) return true;
    const d = new Date(o.createdAt||o.updatedAt||'2020-01-01');
    if(state.mktDateFrom && d < new Date(state.mktDateFrom)) return false;
    if(state.mktDateTo && d > new Date(state.mktDateTo)) return false;
    return true;
  });

  // Tarih filtresi kutusu
  const mktDateBox = h('div',{style:{background:'#ffffff',border:'1px solid #d0daea',borderRadius:'12px',padding:'14px 18px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap'}},
    h('span',{style:{fontSize:'13px',fontWeight:'600',color:'#1e2d4a'}},'📅 Tarih Aralığı:'),
    h('input',{type:'date',value:state.mktDateFrom||'',style:{padding:'7px 10px',border:'1.5px solid #b8d4ec',borderRadius:'8px',fontSize:'13px',fontFamily:"'Inter',sans-serif",color:'#0f1f35',outline:'none'},oninput:e=>{state.mktDateFrom=e.target.value;render();}}),
    h('span',{style:{color:'#64748b',fontSize:'13px'}},'—'),
    h('input',{type:'date',value:state.mktDateTo||'',style:{padding:'7px 10px',border:'1.5px solid #b8d4ec',borderRadius:'8px',fontSize:'13px',fontFamily:"'Inter',sans-serif",color:'#0f1f35',outline:'none'},oninput:e=>{state.mktDateTo=e.target.value;render();}}),
    btn('Temizle',()=>{state.mktDateFrom='';state.mktDateTo='';render();},'#f1f5f9','#4a6080','7px 14px',{fontSize:'12px',border:'1px solid #b0c8e0',borderRadius:'8px'}),
    (state.mktDateFrom||state.mktDateTo)?h('span',{style:{fontSize:'12px',color:'#2563eb',fontWeight:'600'}},O.length+' / '+O_ALL.length+' fırsat gösteriliyor'):h('span')
  );

  // KPI
  const totalFirms = C.length;
  const newFirms = C.filter(c=>c.createdAt&&new Date(c.createdAt)>=new Date(Date.now()-30*86400000)).length;
  const activePipeline = O.filter(o=>!LOST.includes(o.stage)).reduce((a,o)=>a+(Number(o.value)||0),0);
  const lostCount = O.filter(o=>LOST.includes(o.stage)).length;
  const totalCount = O.length;
  const lostRate = totalCount ? Math.round(lostCount/totalCount*100) : 0;
  const pubSector = O.filter(o=>o.adminId&&state.customers.find(c=>c.id===o.customerId)?.sector==='KAMU').length;

  const kpiGrid = h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'14px',marginBottom:'20px'}});
  [
    {l:'Toplam Firma',v:String(totalFirms),s:newFirms+' yeni (son 30 gün)',c:'#2563eb',i:'🏢'},
    {l:'Aktif Pipeline',v:eur(activePipeline),s:O.filter(o=>!LOST.includes(o.stage)).length+' fırsat',c:'#7c3aed',i:'🎯'},
    {l:'Kayıp Oranı',v:lostRate+'%',s:lostCount+' kaybedilen / '+totalCount+' toplam',c:'#dc2626',i:'📉'},
    {l:'Toplam Fırsat',v:String(totalCount),s:'Tüm zamanlar',c:'#16a34a',i:'📊'},
    {l:'Sektör Çeşitliliği',v:String(new Set(O.map(o=>o.sector)).size),s:'Farklı sektör',c:'#0891b2',i:'🌐'},
    {l:'Teknik Servis Kayıt',v:String(state.services.length),s:'Toplam servis kaydı',c:'#ea580c',i:'🔧'},
  ].forEach(k=>kpiGrid.appendChild(kpiCard(k.l,k.v,k.s,k.c,k.i)));

  // Sektör bazlı dağılım
  const sectorMap = {};
  O.forEach(o=>{ const s=o.sector||'Diğer'; if(!sectorMap[s]) sectorMap[s]={val:0,cnt:0}; sectorMap[s].val+=Number(o.value)||0; sectorMap[s].cnt++; });
  const sectorItems = Object.entries(sectorMap).sort((a,b)=>b[1].val-a[1].val).map(([s,d])=>({sector:s,...d}));
  const maxSec = Math.max(1,...sectorItems.map(x=>x.val));
  const SECT_COLORS = ['#2563eb','#7c3aed','#ea580c','#16a34a','#0891b2','#dc2626','#d97706','#475569'];
  const sectorChart = barChart(sectorItems, maxSec, (x,i)=>SECT_COLORS[sectorItems.indexOf(x)%SECT_COLORS.length], x=>x.sector, x=>x.val, x=>x.cnt+'x');
  const sectorPie = pieChart(sectorItems.slice(0,6).map((x,i)=>({label:x.sector, value:x.val, color:SECT_COLORS[i%SECT_COLORS.length]})));

  // Kayıp analizi
  const lostReasons = {};
  O.filter(o=>LOST.includes(o.stage)).forEach(o=>{ const s=o.stage; lostReasons[s]=(lostReasons[s]||0)+1; });
  const lostPie = pieChart(Object.entries(lostReasons).map(([s,v])=>({label:s,value:v,color:SC[s]||'#94a3b8'})));

  // İdare bazlı dağılım (Kamu/Özel)
  const adminMap = {};
  O.forEach(o=>{ const a=o.sector||'Belirsiz'; if(!adminMap[a]) adminMap[a]={val:0,cnt:0}; adminMap[a].val+=Number(o.value)||0; adminMap[a].cnt++; });
  const ADMIN_COLORS = ['#1d4ed8','#0891b2','#16a34a','#d97706','#7c3aed','#dc2626','#475569','#0f766e'];
  const adminPie = pieChart(
    Object.entries(adminMap).sort((a,b)=>b[1].val-a[1].val).slice(0,5).map(([s,d],i)=>({label:s,value:d.val,color:ADMIN_COLORS[i%ADMIN_COLORS.length]}))
  );

  // Yeni müşteri kazanımı (son 6 ay) — firma isimleriyle
  const months = [];
  for(let i=5;i>=0;i--) { const d=new Date(); d.setMonth(d.getMonth()-i); months.push({label:d.toLocaleString('tr-TR',{month:'short',year:'2-digit'}),year:d.getFullYear(),month:d.getMonth()}); }
  const newCustByMonth = months.map(m=>{
    const firms = C.filter(c=>{ if(!c.createdAt) return false; const d=new Date(c.createdAt); return d.getFullYear()===m.year&&d.getMonth()===m.month; });
    return {label:m.label, cnt:firms.length, firms:firms.map(f=>f.firmName||f.name||'?')};
  });
  const maxCust = Math.max(1,...newCustByMonth.map(x=>x.cnt));

  // Özel müşteri grafiği — firma isimleriyle
  const custChartDiv = h('div',{});
  newCustByMonth.forEach(item=>{
    const pct = item.cnt/maxCust*100;
    const bar = h('div',{style:{marginBottom:'14px'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'5px'}},
        h('span',{style:{fontSize:'13px',color:T1,fontWeight:'600'}},item.label),
        h('div',{style:{display:'flex',gap:'8px',alignItems:'center'}},
          item.firms.length ? h('span',{style:{fontSize:'11px',color:'#2563eb',fontWeight:'500'}},item.firms.join(', ')) : h('span',{style:{fontSize:'11px',color:T4}},'—'),
          h('span',{style:{fontSize:'13px',fontWeight:'700',color:'#2563eb'}},item.cnt+' Ad.')
        )
      ),
      h('div',{style:{height:'8px',background:'#c8daea',borderRadius:'4px',overflow:'hidden'}},
        h('div',{style:{height:'100%',width:pct+'%',background:'linear-gradient(90deg,#2563eb,#60a5fa)',borderRadius:'4px',transition:'width .4s ease'}})
      )
    );
    custChartDiv.appendChild(bar);
  });

  return h('div',{style:{animation:'fu .3s ease'}},
    h('div',{style:{marginBottom:'16px'}},
      h('h2',{style:{fontSize:'18px',fontWeight:'800',color:'#1e2d4a'}},'🌐 Pazarlama / İş Geliştirme Dashboard')
    ),
    mktDateBox,
    kpiGrid,
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',marginBottom:'16px'}},
      card('🏭 Sektör Bazlı Ciro Dağılımı (Bar) — Kazanılan İşler', (()=>{
        const wonMap = {};
        O.filter(o=>o.stage==='KAZANILDI').forEach(o=>{const s=o.sector||'Diğer';if(!wonMap[s])wonMap[s]={val:0,cnt:0};wonMap[s].val+=Number(o.value)||0;wonMap[s].cnt++;});
        const wonItems = Object.entries(wonMap).sort((a,b)=>b[1].val-a[1].val).map(([s,d])=>({sector:s,...d}));
        const maxW = Math.max(1,...wonItems.map(x=>x.val));
        return wonItems.length ? barChart(wonItems, maxW, (x,i)=>SECT_COLORS[wonItems.indexOf(x)%SECT_COLORS.length], x=>x.sector, x=>x.val, x=>x.cnt+'x') : h('div',{style:{color:T3,textAlign:'center',padding:'20px',fontSize:'13px'}},'Henüz kazanılan iş yok.');
      })()),
      card('🥧 Sektör Bazlı Dağılım (Pasta) — Kazanılan İşler', (()=>{
        const wonMap2 = {};
        O.filter(o=>o.stage==='KAZANILDI').forEach(o=>{const s=o.sector||'Diğer';if(!wonMap2[s])wonMap2[s]=0;wonMap2[s]+=Number(o.value)||0;});
        const segs = Object.entries(wonMap2).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([s,v],i)=>({label:s,value:v,color:SECT_COLORS[i%SECT_COLORS.length]}));
        return segs.length ? pieChart(segs) : h('div',{style:{color:T3,textAlign:'center',padding:'20px',fontSize:'13px'}},'Henüz kazanılan iş yok.');
      })())
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',marginBottom:'16px'}},
      card('📉 Kayıp Fırsat Analizi', lostPie),
      card('🏢 Sektör Bazlı Tüm Pipeline Dağılımı', sectorPie)
    ),
    h('div',{},
      card('📅 Aylık Yeni Müşteri Kazanımı (Son 6 Ay)', custChartDiv)
    )
  );
}

// ═══════════════════════════════════════════════════════
// DASHBOARD — ANA FONKSİYON (3 TAB)
// ═══════════════════════════════════════════════════════
function renderDashboard() {
  const cu = state.currentUser;
  if(!state.dashTab) state.dashTab = cu?.isAdmin ? 'admin' : 'sales';
  const tabs = [
    {id:'admin', l:'🏢 Yönetici', admin:true},
    {id:'sales', l:'📈 Satış / Proje', admin:false},
    {id:'marketing', l:'🌐 Pazarlama / İş Geliştirme', admin:false},
  ];
  const tabBar = h('div',{style:{display:'flex',gap:'6px',marginBottom:'20px',flexWrap:'wrap'}});
  tabs.forEach(t=>{
    if(t.admin && !cu?.isAdmin) return;
    const active = state.dashTab===t.id;
    const b = btn(t.l, ()=>{ state.dashTab=t.id; render(); },
      active?'#1e2d4a':'#ffffff',
      active?'#ffffff':'#4a6080',
      '10px 18px',
      {fontSize:'13px',fontWeight:active?'700':'500',border:active?'none':'1px solid #b0c8e0',borderRadius:'10px',boxShadow:active?'0 2px 8px rgba(30,45,74,.2)':'none'}
    );
    tabBar.appendChild(b);
  });
  let content;
  if(state.dashTab==='admin') content = cu?.isAdmin ? renderDashboardAdmin() : renderDashboardSales();
  else if(state.dashTab==='sales') content = renderDashboardSales();
  else content = renderDashboardMarketing();
  return h('div',{style:{animation:'fu .3s ease'}},tabBar,content);
}

      contGrid.appendChild(h('div',{style:{background:'#edf5fc',border:'1px solid #b0c8e0',borderRadius:'9px',padding:'10px 14px'}},
        h('div',{style:{fontWeight:'600',fontSize:'13px',color:T2,marginBottom:'4px'}},ct.name+(ct.title?' — '+ct.title:'')),

// ═══════════════════════════════════════════════════════
// ANA RENDER

function render() {
  if(state.view==='login') { renderLogin(); return; }

  const root = document.getElementById('root');
  root.innerHTML='';

  if(state.loading) {
    root.appendChild(h('div',{style:{minHeight:'100vh',background:'#d0e4f4',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'16px'}},
      h('div',{style:{width:'44px',height:'44px',border:'3px solid #b8c8de',borderTop:'3px solid '+ACC,borderRadius:'50%',animation:'spin .8s linear infinite'}}),
      h('div',{style:{color:'#4a6080',fontSize:'15px',fontWeight:'500'}},'Yükleniyor…')
    ));
    return;
  }

  const TABS=[{id:'dashboard',l:'📊 Dashboard'},{id:'customers',l:'👥 Müşteriler'},{id:'opportunities',l:'🎯 Fırsatlar'},{id:'proposals',l:'📄 Teklifler'},{id:'services',l:'🔧 Teknik Servis'},{id:'serviceopps',l:'🎯 T.Servis Fırsatları'},{id:'maintenance',l:'⚙️ Periyodik Bakım'}];
  const cu = state.currentUser;

  // NAVBAR
  const navbar = h('div',{style:{background:'#b0cce8',borderBottom:'1px solid #90b4d4',padding:'0 24px',boxShadow:'0 2px 8px rgba(15,31,53,.3)'}},
    h('div',{style:{maxWidth:'1400px',margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between',height:'60px'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
        h('div',{style:{width:'36px',height:'36px',background:'linear-gradient(135deg,#2563eb,#1d4ed8)',borderRadius:'9px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px',boxShadow:'0 2px 6px rgba(37,99,235,.4)'}},'⚡'),
        h('div',{},h('div',{style:{fontWeight:'800',fontSize:'15px',color:'#0f1f35'}},'A-PRO İş Takip CRM'),h('div',{style:{fontSize:'11px',color:'#0f2a50',letterSpacing:'.05em'}},'SATIŞ & SERVİS YÖNETİMİ'))
      ),
      h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:'8px',background:'rgba(255,255,255,.3)',border:'1px solid rgba(15,31,53,.2)',borderRadius:'8px',padding:'5px 13px'}},
          h('div',{style:{width:'26px',height:'26px',borderRadius:'50%',background:'linear-gradient(135deg,#2563eb,#1d4ed8)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:'700',color:'#fff'}},(cu?.displayName||'?').slice(0,2).toUpperCase()),
          h('span',{style:{fontSize:'13px',color:'#0f1f35',fontWeight:'700'}},cu?.displayName||'')
        ),
        cu?.isAdmin ? btn('📅 Aylık Rapor',()=>generateMonthlyReport(),'rgba(37,99,235,.25)','#0f1f35','7px 14px',{fontSize:'13px',border:'1px solid rgba(37,99,235,.4)',borderRadius:'8px',fontWeight:'700'}) : h('span'),
        cu?.isAdmin ? btn('📊 3 Aylık Rapor',()=>generateQuarterlyReport(),'rgba(124,58,237,.25)','#0f1f35','7px 14px',{fontSize:'13px',border:'1px solid rgba(124,58,237,.4)',borderRadius:'8px',fontWeight:'700'}) : h('span'),
        cu?.isAdmin ? btn('📋 Geçmiş',()=>setState({modal:{type:'reports'}}),'rgba(255,255,255,.2)','#0f1f35','7px 14px',{fontSize:'13px',border:'1px solid rgba(0,0,0,.15)',borderRadius:'8px',fontWeight:'700'}) : h('span'),
        cu?.isAdmin ? btn('🎯 Hedefler',()=>setState({modal:{type:'targets',item:null}}),'rgba(255,255,255,.3)','#0f1f35','7px 14px',{fontSize:'13px',border:'1px solid rgba(15,31,53,.25)',borderRadius:'8px',fontWeight:'700'}) : h('span'),
        cu?.isAdmin ? btn('🖨️ Yazdır',()=>printDashboard(),'rgba(255,255,255,.3)','#0f1f35','7px 14px',{fontSize:'13px',border:'1px solid rgba(15,31,53,.25)',borderRadius:'8px',fontWeight:'700'}) : h('span'),
        cu?.isAdmin ? btn('👥 Kullanıcılar',()=>setState({modal:{type:'admin',item:null}}),'rgba(255,255,255,.3)','#0f1f35','7px 14px',{fontSize:'13px',border:'1px solid rgba(15,31,53,.25)',borderRadius:'8px',fontWeight:'700'}) : h('span'),
        cu?.isAdmin ? btn('🗄️ Yedekleme',()=>setState({modal:{type:'backup',item:null}}),'rgba(255,255,255,.3)','#0f1f35','7px 14px',{fontSize:'13px',border:'1px solid rgba(15,31,53,.25)',borderRadius:'8px',fontWeight:'700'}) : h('span'),
        btn('Çıkış',()=>{state.currentUser=null;state.view='login';loginState={email:'',pw:'',err:'',attempts:0,locked:false};render();},'#dc2626','#ffffff','7px 14px',{fontSize:'13px',border:'none',borderRadius:'8px',fontWeight:'700'})
      )
    )
  );

  // INFO BAR
  const infobar = h('div',{style:{background:'#b0cce8',borderBottom:'1px solid #90b4d4',padding:'6px 24px'}},
    h('div',{style:{maxWidth:'1400px',margin:'0 auto',display:'flex',alignItems:'center',gap:'9px'}},
      h('span',{},'🌐'),h('span',{style:{fontSize:'12px',color:'#0f2040',fontWeight:'700'}},'Firebase Veritabanı'),h('span',{style:{fontSize:'12px',color:'#2a5080'}},'— Gerçek zamanlı senkronizasyon'),
      h('span',{style:{marginLeft:'auto',fontSize:'12px',color:'#2a5080',fontWeight:'500'}},state.customers.length+' firma · '+state.opportunities.length+' fırsat · '+state.proposals.length+' teklif · '+state.services.length+' servis · '+state.maintenances.length+' bakım')
    )
  );

  // TABS
  const tabBar = h('div',{style:{background:'#c0daf0',borderBottom:'1px solid #a8c8e4',padding:'0 24px',overflowX:'auto'}},
    h('div',{style:{maxWidth:'1400px',margin:'0 auto',display:'flex',gap:'2px',minWidth:'max-content'}},
      ...TABS.map(t=>h('button',{onClick:()=>setState({tab:t.id}),style:{padding:'11px 17px',background:'none',border:'none',cursor:'pointer',fontSize:'13px',fontWeight:'600',fontFamily:"'DM Sans',sans-serif",color:state.tab===t.id?'#0f2040':'#2a5080',borderBottom:state.tab===t.id?'2.5px solid #1e3a6e':'2.5px solid transparent',whiteSpace:'nowrap',fontWeight:state.tab===t.id?'700':'500'}},t.l))
    )
  );

  // CONTENT
  let content;
  if(state.tab==='dashboard') content=renderDashboard();
  else if(state.tab==='customers') content=renderCustomers();
  else if(state.tab==='opportunities') content=renderOpportunities();
  else if(state.tab==='proposals') content=renderProposals();
  else if(state.tab==='services') content=renderServices();
  else if(state.tab==='serviceopps') content=renderServiceOpps();
  else if(state.tab==='maintenance') content=renderMaintenances();

  const main = h('div',{style:{maxWidth:'1400px',margin:'0 auto',padding:'20px'}},content);

  root.appendChild(h('div',{style:{minHeight:'100vh',background:'#d0e4f4'}},navbar,infobar,tabBar,main));

  // TOAST
  if(state.toast) {
    root.appendChild(h('div',{style:{position:'fixed',bottom:'20px',right:'20px',zIndex:'2000',background:'#ffffff',border:`2px solid ${state.toast.color}`,borderRadius:'11px',padding:'11px 16px',color:state.toast.color,fontSize:'14px',fontWeight:'600',animation:'si .25s ease',boxShadow:'0 8px 24px rgba(0,0,0,.5)'}},state.toast.msg));
  }

  // MODAL
  if(state.modal) {
    const {type,item} = state.modal;
    let m;
    if(type==='customer') m=buildCustomerModal(item);
    else if(type==='opportunity') m=buildOppModal(item);
    else if(type==='serviceopp') m=buildServiceOppModal(item);
    else if(type==='proposal') m=buildPropModal(item);
    else if(type==='service') m=buildServModal(item);
    else if(type==='maintenance') m=buildMaintModal(item);
    else if(type==='backup') m=buildBackupModal();
    else if(type==='admin') m=buildAdminModal();
    else if(type==='targets') m=buildTargetsModal();
    else if(type==='reports') { buildReportsModal().then(function(el){if(el&&root)root.appendChild(el);}); }
    if(m) root.appendChild(m);
  }
}

(async function init() {
  const users = await loadUsers();
  state.users = users;
  state.targets = await loadTargets();
  state.loading = false;
  render();
  setTimeout(checkMonthlyReport, 3000);
})();
</script>
