    try{ new Notification(title,{body}); }catch(e){}
  }
  setTimeout(()=>{ if(notif.parentNode) notif.remove(); }, 8000);
}

function _toTR(d) {
  if(!d) return '';
  d = d.trim();
  // Zaten TR: dd.mm.yyyy
  if(/^\d{2}\.\d{2}\.\d{4}/.test(d)) return d;
  // ISO: yyyy-mm-dd → dd.mm.yyyy
  const p=d.split('-');
  if(p.length===3) return p[2]+'.'+p[1]+'.'+p[0];
  return d;
}

function _toISO(d) {
  if(!d) return null;
  d = d.trim();
  // Zaten ISO formatı: yyyy-mm-dd
  if(/^\d{4}-\d{2}-\d{2}/.test(d)) return d.substring(0,10);
  // Türkçe format: dd.mm.yyyy
  const p=d.split('.');
  if(p.length===3) return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');
  return d;
}

// Timezone-safe Date oluşturucu - new Date("yyyy-mm-dd") UTC sorununu önler
function _toDate(d) {
  const iso = _toISO(d);
  if(!iso) return null;
  const parts = iso.split('-');
  if(parts.length!==3) return null;
  // new Date(year, month-1, day) → LOCAL time, UTC offset yok
  return new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
}

// Gün farkı hesabı - timezone-safe
function _diffDaysDate(d) {
  const date = _toDate(d);
  if(!date) return 9999;
  const today = new Date(); today.setHours(0,0,0,0);
  date.setHours(0,0,0,0);
  return Math.round((date-today)/(1000*60*60*24));
}
function _todayISO() {
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function _tomorrowISO() {
  const d=new Date(); d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function _nowMin() {
  const d=new Date(); return d.getHours()*60+d.getMinutes();
}
function _hm2min(t) {
  if(!t) return -1;
  const p=t.split(':'); return parseInt(p[0])*60+parseInt(p[1]);
}
function _diffDays(d) {
  return _diffDaysDate(d);
}
function _custName(id) {
  return (state.customers.find(x=>x.id===id)||{}).firmName||'';
}

function checkAllNotifications() {
  const now   = _nowMin();
  const today = _todayISO();
  const tmrw  = _tomorrowISO();
  if(!state.currentUser) return;

  // ── RANDEVULAR ─────────────────────────────────────
  (state.appointments||[]).forEach(a=>{
    if(a.status==='İptal'||a.status==='Tamamlandı') return;
    const iso = _toISO(a.apptDate); if(!iso) return;
    const cn = _custName(a.customerId);
    // Yarın 16:30
    if(iso===tmrw && now>=990 && now<=994) {
      showNotification('appt_tmrw_'+a.id,'📅 Yarın Randevu',cn+' · '+a.apptDate+(a.apptTime?' · '+a.apptTime:'')+' · '+a.assignedTo,'warning',a.assignedTo);
      showNotification('appt_tmrw_adm_'+a.id,'📅 Yarın Randevu',cn+' · '+a.apptDate+(a.apptTime?' · '+a.apptTime:'')+' · '+a.assignedTo,'warning','admin');
    }
    // Bugün 90dk önce
    if(iso===today && a.apptTime) {
      const tgt=_hm2min(a.apptTime)-90;
      if(now>=tgt && now<=tgt+4) {
        showNotification('appt_now_'+a.id,'🚨 Randevu 90 Dk Sonra!',cn+' · Saat '+a.apptTime+' · '+a.assignedTo,'urgent',a.assignedTo);
        showNotification('appt_now_adm_'+a.id,'🚨 Randevu 90 Dk Sonra!',cn+' · Saat '+a.apptTime+' · '+a.assignedTo,'urgent','admin');
      }
    }
  });

  // ── ZİYARETLER ─────────────────────────────────────
  (state.visits||[]).forEach(v=>{
    const iso = _toISO(v.visitDate); if(!iso) return;
    const cn = _custName(v.customerId);
    // Yarın 16:30
    if(iso===tmrw && now>=990 && now<=994) {
      showNotification('vis_tmrw_'+v.id,'📝 Yarın Ziyaret',cn+(v.projectInfo?' · '+v.projectInfo:'')+(v.visitTime?' · '+v.visitTime:''),'warning',v.assignedTo);
    }
    // Bugün 90dk önce
    if(iso===today && v.visitTime) {
      const tgt=_hm2min(v.visitTime)-90;
      if(now>=tgt && now<=tgt+4) {
        showNotification('vis_now_'+v.id,'🚨 Ziyaret 90 Dk Sonra!',cn+(v.projectInfo?' · '+v.projectInfo:'')+' · Saat '+v.visitTime,'urgent',v.assignedTo);
      }
    }
    // Not girilmedi - ertesi gün 14:00
    if(iso<today && !v.notes && now>=840 && now<=844) {
      const nxtD=_toDate(iso); if(!nxtD) return; nxtD.setDate(nxtD.getDate()+1);
      const nxtISO=nxtD.getFullYear()+'-'+String(nxtD.getMonth()+1).padStart(2,'0')+'-'+String(nxtD.getDate()).padStart(2,'0');
      if(nxtISO===today) {
        showNotification('vis_nonote_'+v.id,'⚠️ Ziyaret Notu Eksik',cn+' ziyareti ('+v.visitDate+') için not eklenmedi.','warning',v.assignedTo);
      }
    }
  });

  // ── FIRSATLAR ──────────────────────────────────────
  const LOST=['KAÇTI','NO GO','FIRSAT ÖLDÜ'];
  (state.opportunities||[]).forEach(o=>{
    const cn=_custName(o.customerId);
    // Kazanıldı - anında (son 2 dk)
    if(o.stage==='KAZANILDI' && o.updatedAt && (new Date()-new Date(o.updatedAt))<120000) {
      showNotification('opp_win_'+o.id,'🏆 Fırsat Kazanıldı!',o.title+' · '+cn,'win','admin');
    }
    // Kaybedildi - anında
    if(LOST.includes(o.stage) && o.updatedAt && (new Date()-new Date(o.updatedAt))<120000) {
      showNotification('opp_lose_'+o.id,'❌ Fırsat Kaybedildi',o.title+' · '+cn+' ('+o.stage+')','lose','admin');
    }
    // Sipariş tarihi 7 gün kaldı - 09:00
    if(o.dueDate && !LOST.includes(o.stage) && o.stage!=='KAZANILDI') {
      if(_diffDays(_toISO(o.dueDate))===7 && now>=540 && now<=544) {
        showNotification('opp_due7_'+o.id,'⏰ Sipariş Tarihi 7 Gün Kaldı',o.title+' · '+cn+' · '+o.dueDate,'warning',o.assignedTo);
      }
    }
    // 10+ gün güncellenmemiş - Pazartesi 09:00
    if(new Date().getDay()===1 && now>=540 && now<=544 && !LOST.includes(o.stage) && o.stage!=='KAZANILDI') {
      const days=Math.floor((new Date()-new Date(o.updatedAt||o.createdAt||0))/(86400000));
      if(days>=10) {
        showNotification('opp_stale_'+o.id+'_'+today(),'⚠️ Fırsat '+days+' Gündür Bekliyor',o.title+' · '+cn,'warning',o.assignedTo);
        showNotification('opp_stale_adm_'+o.id+'_'+today(),'⚠️ Güncellenmemiş Fırsat',o.title+' · '+cn+' ('+days+' gün)','warning','admin');
      }
    }
  });

  // ── TEKLİFLER ──────────────────────────────────────
  (state.proposals||[]).forEach(p=>{
    const cn=_custName(p.customerId);
    // Anında durum değişimi
    if((p.status==='Onaylandı'||p.status==='Reddedildi') && p.updatedAt && (new Date()-new Date(p.updatedAt))<120000) {
      const win=p.status==='Onaylandı';
      showNotification('prop_st_'+p.id+'_'+p.status,(win?'✅':'❌')+' Teklif '+(win?'Onaylandı':'Reddedildi'),(p.title||'Teklif')+' · '+cn,win?'win':'lose',p.preparedBy);
      showNotification('prop_st_adm_'+p.id+'_'+p.status,(win?'✅':'❌')+' Teklif '+(win?'Onaylandı':'Reddedildi'),(p.title||'Teklif')+' · '+cn,win?'win':'lose','admin');
      return;
    }
    if(p.status==='Onaylandı'||p.status==='Reddedildi') return;
    if(!p.validUntil) return;
    const diff=_diffDays(_toISO(p.validUntil));
    // 1 gün önce 08:00
    if(diff===1 && now>=480 && now<=484) {
      showNotification('prop_dl1_'+p.id,'⏰ Teklif Dead Line Yarın!',(p.title||'Teklif')+' · '+cn+' · '+p.validUntil,'urgent',p.preparedBy);
    }
    // Süresi geçti - her gün 09:00
    if(diff<0 && now>=540 && now<=544) {
      showNotification('prop_over_'+p.id+'_'+today(),'🚨 Teklif Süresi Geçti!',(p.title||'Teklif')+' · '+cn+' · '+Math.abs(diff)+' gün','urgent',p.preparedBy);
      showNotification('prop_over_adm_'+p.id+'_'+today(),'🚨 Teklif Süresi Geçti',(p.title||'Teklif')+' · '+cn,'urgent','admin');
    }
  });

  // ── TEKNİK SERVİS ──────────────────────────────────
  (state.services||[]).forEach(s=>{
    const cn=_custName(s.customerId);
    // Onaylandı - anında
    if(s.status==='Onaylandı' && s.updatedAt && (new Date()-new Date(s.updatedAt))<120000) {
      showNotification('svc_appr_'+s.id,'✅ Servis Onaylandı!',(s.jobName||'Servis')+' · '+cn,'win',s.preparedBy);
      showNotification('svc_appr_adm_'+s.id,'✅ Servis Onaylandı!',(s.jobName||'Servis')+' · '+cn,'win','admin');
    }
    // Randevu 1 gün önce 16:30
    if(s.appointmentDate) {
      const iso=_toISO(s.appointmentDate);
      if(iso===tmrw && now>=990 && now<=994) {
        showNotification('svc_appt_'+s.id,'🔧 Yarın Servis Randevusu',(s.jobName||'Servis')+' · '+cn+' · '+s.appointmentDate,'warning',s.preparedBy);
      }
    }
    // Dead line 1 gün önce 08:00
    if(s.validUntil && _diffDays(_toISO(s.validUntil))===1 && now>=480 && now<=484) {
      showNotification('svc_dl_'+s.id,'⏰ Servis Dead Line Yarın',(s.jobName||'Servis')+' · '+cn,'warning',s.preparedBy);
    }
  });

  // ── PERİYODİK BAKIM ────────────────────────────────
  (state.maintenances||[]).forEach(m=>{
    const due=maintNextDue(m);
    if(!due) return;
    const cn=_custName(m.customerId);
    const iso=_toISO(due);
    const diff=_diffDays(iso);
    const tgt=m.serviceContact||m.preparedBy;
    // 7 gün - 09:00
    if(diff===7 && now>=540 && now<=544) {
      showNotification('maint_7d_'+m.id,'⚙️ Bakım 7 Gün Sonra',(m.jobName||'Bakım')+' · '+cn+' · '+_toTR(due),'warning',tgt);
    }
    // Geçti - her gün 09:00
    if(diff<0 && now>=540 && now<=544) {
      showNotification('maint_over_'+m.id+'_'+today(),'🚨 Bakım Vadesi Geçti!',(m.jobName||'Bakım')+' · '+cn+' · '+Math.abs(diff)+' gün geçti','urgent',tgt);
      showNotification('maint_over_adm_'+m.id+'_'+today(),'🚨 Bakım Vadesi Geçti',(m.jobName||'Bakım')+' · '+cn,'urgent','admin');
    }
  });
}

window.addEventListener('resize', function(){
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(function(){
    if(state.currentUser) render();
  }, 150);
});
window.addEventListener('orientationchange', function(){
  setTimeout(function(){
    if(state.currentUser) render();
  }, 300);
});

function startNotificationTimer() {
  if(window._notifInterval) clearInterval(window._notifInterval);
  if('Notification' in window && Notification.permission==='default') {
    Notification.requestPermission();
  }
  checkAllNotifications();
  window._notifInterval = setInterval(checkAllNotifications, 60000);
  // Mail sistemi — İSTEMCİ-TARAFLI GÖNDERİM DEVRE DIŞI.
  // Hatırlatma mailleri artık sunucu cron'undan gönderiliyor:
  // nextaura-admin → /api/cron/crm-reminders (her gün 07:00 TR).
  // Tarayıcı açık olsa da checkAllMails çağrılmıyor → çift mail önlenir.
  // (Ekran içi bildirim ve ses checkAllNotifications ile devam ediyor.)
  // Teklif programı referans senkronu (atanan teklif no → fırsat REF.)
  if(window._qrefInterval) clearInterval(window._qrefInterval);
  window._qrefInterval = setInterval(syncQuotationRefs, 300000);
  setTimeout(syncQuotationRefs, 10000);
}

const EMAILJS_SERVICE  = 'service_xm7vpad';
const EMAILJS_TEMPLATE = 'template_tfhbxqv';
const EMAILJS_KEY      = 'aFlqv_CSdq9QliGtN';

if(!window._mailSentKeys) window._mailSentKeys = new Set();

function initEmailJS() {
  try {
    if(typeof emailjs !== 'undefined') {
      emailjs.init(EMAILJS_KEY);
      console.log('✅ EmailJS hazır');
    }
  } catch(e) { console.warn('EmailJS init:', e); }
}

// Kullanıcının mail adresini bul
function getUserEmail(nameOrRole) {
  if(!nameOrRole) return null;
  if(nameOrRole === 'admin') {
    const admin = state.users.find(u => u.isAdmin && u.active !== false);
    return admin?.email || null;
  }
  const user = state.users.find(u => u.displayName === nameOrRole && u.active !== false);
  return user?.email || null;
}

function sendMail(key, toEmail, subject, bodyHtml) {
  if(window._mailSentKeys.has(key)) return;
  if(!toEmail || !toEmail.includes('@')) return;
  if(typeof emailjs === 'undefined') { console.warn('EmailJS yüklenmedi'); return; }
  window._mailSentKeys.add(key);
  emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
    subject: subject,
    body: bodyHtml,
    to_email: toEmail,
  }).then(()=>{
    console.log('✅ Mail gönderildi:', subject, '→', toEmail);
  }).catch(e=>{
    console.warn('❌ Mail hatası:', e);
    window._mailSentKeys.delete(key); // Hata olursa tekrar denenebilsin
  });
}

// Teklif programındaki bağlı tekliflerin durum/numara/tutarını arka planda çekip
// fırsatların REF. (tenderRef), durum, değer ve satış temsilcisi alanlarını günceller.
// Atanan teklif numarası (number, örn. A-Pro-T-26-0036) REF.'e otomatik yazılır.
// Yalnız DEĞİŞEN kayıtlar Firebase'e yazılır (gereksiz yazma yok).
async function syncQuotationRefs() {
  try {
    if (typeof TEKLIF_APP_URL === 'undefined' || typeof TEKLIF_API_KEY === 'undefined' || !TEKLIF_API_KEY) return;
    let updatedOpps = [...state.opportunities];
    let updatedProps = [...state.proposals];
    let changed = false, clearedCount = 0, restoredCount = 0, relinkedCount = 0;

    // Bağlantısı tamamen kopmuş fırsatları REF. numarasından kurtar.
    // (Eski sürüm, teklif silindiğinde quotationId'yi siliyordu; teklif geri alınsa bile
    // CRM onu bulamıyordu. Elde yalnızca REF. numarası kalıyor — onunla eşleştiriyoruz.)
    const orphans = updatedOpps.filter(o => !o.quotationId && o.tenderRef);
    for (const o of orphans) {
      const num = String(o.tenderRef).trim().replace(/-R\d+$/i, ''); // "-R2" revizyon eki
      if (!/^[\w.-]{3,60}$/.test(num) || !/-T-\d/.test(num)) continue; // serbest metin REF.'leri atla
      const r = await fetch(
        `${TEKLIF_APP_URL}/api/v1/crm/quotation-status?number=${encodeURIComponent(num)}`,
        { headers: { 'x-crm-key': TEKLIF_API_KEY } }
      ).catch(() => null);
      if (!r || !r.ok) continue;
      const rd = (await r.json().catch(() => null))?.data;
      if (rd?.exists !== true || !rd.id) continue;
      const upd = { ...o, quotationId: rd.id, quotationDeleted: false,
        ...(rd.status ? { quotationStatus: rd.status } : {}) };
      await saveDoc('opportunities', o.id, upd);
      updatedOpps = updatedOpps.map(x => x.id === o.id ? upd : x);
      changed = true; relinkedCount++;
    }

    // Bağlı tekliflerin benzersiz id'leri — kurtarma adımında yeniden bağlananlar dahil,
    // böylece onların durum/tutar bilgisi de bu turda tazelenir.
    const ids = [...new Set([
      ...updatedOpps.filter(o => o.quotationId).map(o => o.quotationId),
      ...updatedProps.filter(p => p.quotationId).map(p => p.quotationId),
    ])];
    for (const qid of ids) {
      const res = await fetch(
        `${TEKLIF_APP_URL}/api/v1/crm/quotation-status?id=${encodeURIComponent(qid)}`,
        { headers: { 'x-crm-key': TEKLIF_API_KEY } }
      ).catch(() => null);
      if (!res || !res.ok) continue; // geçici hata → dokunma
      const body = await res.json().catch(() => null);
      const d = body && body.data;
      if (!d) continue;

      // HTTP 200 + exists:false = teklif KESİN silinmiş (geçici erişim sorunu bu bloğa
      // hiç ulaşmaz; o durumda yanıt !res.ok olur ve yukarıda continue edilir).
      // → CRM bağlantısını otomatik temizle: buton "📋 Teklif Oluştur"a döner.
      // Fırsat/teklif talebi kaydı korunur, yalnız teklif bağlantı alanları sıfırlanır.
      if (d.exists === false) {
        for (const o of updatedOpps.filter(x => x.quotationId === qid && !x.quotationDeleted)) {
          const upd = { ...o, quotationDeleted: true, quotationStatus: '' };
          await saveDoc('opportunities', o.id, upd);
          updatedOpps = updatedOpps.map(x => x.id === o.id ? upd : x);
          changed = true;
          clearedCount++;
        }
        for (const p of updatedProps.filter(x => x.quotationId === qid && !x.quotationDeleted)) {
          const upd = { ...p, quotationDeleted: true, quotationStatus: '' };
          await saveDoc('proposals', p.id, upd);
          updatedProps = updatedProps.map(x => x.id === p.id ? upd : x);
          changed = true;
        }
        continue;
      }
      if (d.exists !== true) continue; // beklenmeyen yanıt → dokunma

      // Teklif (yeniden) mevcut → daha önce "silinmiş" işareti konduysa bağlantıyı onar.
      for (const o of updatedOpps.filter(x => x.quotationId === qid && x.quotationDeleted)) {
        const upd = { ...o, quotationDeleted: false };
        await saveDoc('opportunities', o.id, upd);
        updatedOpps = updatedOpps.map(x => x.id === o.id ? upd : x);
        changed = true; restoredCount++;
      }
      for (const p of updatedProps.filter(x => x.quotationId === qid && x.quotationDeleted)) {
        const upd = { ...p, quotationDeleted: false };
        await saveDoc('proposals', p.id, upd);
        updatedProps = updatedProps.map(x => x.id === p.id ? upd : x);
        changed = true;
      }

      const ref   = tpRefWithRev(d);     // revizyon ≥2 → "...-R2"
      const total = tpValueEur(d);       // daima EUR
      const lastEditor = d.lastEditor ?? null; // gerçek teklif düzenleyicisi (Son Düzenleyen)
      // Fırsatlar: durum (hazırlandı/gönderildi) + REF + değer + temsilci
      for (const o of updatedOpps.filter(x => x.quotationId === qid)) {
        const patch = {};
        if (d.status != null && d.status !== o.quotationStatus) patch.quotationStatus = d.status;
        if (ref != null && ref !== o.tenderRef) patch.tenderRef = ref;
        if (total != null && total > 0 && total !== o.value) patch.value = total;
        if (d.salesRep && d.salesRep !== o.assignedTo) patch.assignedTo = d.salesRep;
        if (Object.keys(patch).length === 0) continue;
        const upd = { ...o, ...patch, ...syncStamp(lastEditor) };
        await saveDoc('opportunities', o.id, upd);
        updatedOpps = updatedOpps.map(x => x.id === o.id ? upd : x);
        changed = true;
      }
      // Teklif talepleri: durum senkronu (buton/rapor durumları taze kalsın)
      for (const p of updatedProps.filter(x => x.quotationId === qid)) {
        if (d.status == null || d.status === p.quotationStatus) continue;
        const pupd = { ...p, quotationStatus: d.status, ...syncStamp(lastEditor) };
        await saveDoc('proposals', p.id, pupd);
        updatedProps = updatedProps.map(x => x.id === p.id ? pupd : x);
        changed = true;
      }
    }

    if (changed) {
      const _scrollSave = [...document.querySelectorAll('.apro-no-sb')].map(el => el.scrollLeft);
      setState({ opportunities: updatedOpps, proposals: updatedProps });
      requestAnimationFrame(() => {
        [...document.querySelectorAll('.apro-no-sb')].forEach((el, i) => { if (_scrollSave[i]) el.scrollLeft = _scrollSave[i]; });
      });
    }
    if (clearedCount > 0) showToast('🧹 ' + clearedCount + ' teklif teklif programında silinmiş — buton "Teklif Oluştur"a döndü. Teklif geri alınırsa bağlantı kendiliğinden onarılır.');
    if (restoredCount > 0) showToast('↩️ ' + restoredCount + ' teklif geri alınmış — CRM bağlantısı otomatik onarıldı.');
    if (relinkedCount > 0) showToast('🔗 ' + relinkedCount + ' fırsat REF. numarasından mevcut teklifle yeniden eşleştirildi.');
  } catch {}
}

function checkAllMails() {
  const now   = _nowMin();
  const today = _todayISO();
  const tmrw  = _tomorrowISO();
  if(!state.currentUser) return;

  // ── 📅 RANDEVULAR - yarın 16:30 ──────────────────────────────
  if(now >= 990 && now <= 994) {
    (state.appointments||[]).forEach(a => {
      if(a.status==='İptal'||a.status==='Tamamlandı') return;
      const iso = _toISO(a.apptDate); if(!iso) return;
      if(iso !== tmrw) return;
      const cn = _custName(a.customerId);
      const mailKey = 'mail_appt_tmrw_' + a.id;
      const subject = '📅 Yarın Randevu: ' + cn;
      const body = mailBody('📅', 'Yarın Randevunuz Var', [
        ['Firma', cn],
        ['Tarih', _toTR(a.apptDate)],
        ['Saat', a.apptTime || '-'],
        ['Temsilci', a.assignedTo || '-'],
        ['Not', a.notes || '-'],
      ]);
      // İlgili temsilci
      const repEmail = getUserEmail(a.assignedTo);
      if(repEmail) sendMail(mailKey + '_rep', repEmail, subject, body);
    });
  }

  // ── 📝 ZİYARETLER - yarın 16:30 ────────────────────────────
  if(now >= 990 && now <= 994) {
    (state.visits||[]).forEach(v => {
      const iso = _toISO(v.visitDate); if(!iso) return;
      if(iso !== tmrw) return;
      const cn = _custName(v.customerId);
      const mailKey = 'mail_visit_tmrw_' + v.id;
      const subject = '📝 Yarın Ziyaret: ' + cn;
      const body = mailBody('📝', 'Yarın Ziyaretiniz Var', [
        ['Firma', cn],
        ['Tarih', _toTR(v.visitDate)],
        ['Saat', v.visitTime || '-'],
        ['Proje', v.projectInfo || '-'],
        ['Temsilci', v.assignedTo || '-'],
      ]);
      const repEmail = getUserEmail(v.assignedTo);
      if(repEmail) sendMail(mailKey, repEmail, subject, body);
    });
  }

  // ── 🎯 FIRSATLAR - Sipariş tarihi 1 gün önce ─────────────────
  const LOST = ['KAÇTI','NO GO','FIRSAT ÖLDÜ'];
  (state.opportunities||[]).forEach(o => {
    if(!o.dueDate || LOST.includes(o.stage) || o.stage==='KAZANILDI') return;
    const diff = _diffDays(_toISO(o.dueDate));
    if(diff === 1 && now >= 480 && now <= 484) {
      const cn = _custName(o.customerId);
      const mailKey = 'mail_opp_due1_' + o.id;
      const subject = '⏰ Sipariş Tarihi Yarın: ' + o.title;
      const body = mailBody('⏰', 'Ön Görülen Sipariş Tarihi Yarın!', [
        ['Fırsat', o.title || '-'],
        ['Firma', cn],
        ['Sipariş Tarihi', _toTR(o.dueDate)],
        ['Değer', 'EUR ' + Number(o.value||0).toLocaleString('tr-TR')],
        ['Temsilci', o.assignedTo || '-'],
      ]);
      const repEmail = getUserEmail(o.assignedTo);
      if(repEmail) sendMail(mailKey, repEmail, subject, body);
    }
  });

  // ── 🔧 TEKNİK SERVİS - randevu 2 gün önce 16:30 ─────────────
  if(now >= 990 && now <= 994) {
    (state.services||[]).forEach(s => {
      if(!s.appointmentDate) return;
      const diff = _diffDays(_toISO(s.appointmentDate));
      if(diff === 2) {
        const cn = _custName(s.customerId);
        const mailKey = 'mail_svc_appt2_' + s.id;
        const subject = '🔧 Servis Randevusu 2 Gün Sonra: ' + (s.jobName||'Servis');
        const body = mailBody('🔧', 'Servis Randevusu 2 Gün Sonra', [
          ['İşin Adı', s.jobName || '-'],
          ['Firma', cn],
          ['Randevu Tarihi', _toTR(s.appointmentDate)],
          ['İlgili', s.preparedBy || '-'],
        ]);
        const repEmail = getUserEmail(s.preparedBy);
        if(repEmail) sendMail(mailKey, repEmail, subject, body);
      }
    });
  }

  // ── ⚙️ PERİYODİK BAKIM - 7 gün önce ─────────────────────────
  (state.maintenances||[]).forEach(m => {
    const due = maintNextDue(m);
    if(!due) return;
    const diff = _diffDays(_toISO(due));
    if(diff === 7 && now >= 540 && now <= 544) {
      const cn = _custName(m.customerId);
      const tgt = m.serviceContact || m.preparedBy;
      const mailKey = 'mail_maint_7d_' + m.id;
      const subject = '⚙️ Bakım 7 Gün Sonra: ' + (m.jobName||'Bakım');
      const body = mailBody('⚙️', 'Periyodik Bakım 7 Gün Sonra', [
        ['İşin Adı', m.jobName || '-'],
        ['Firma', cn],
        ['Bakım Vadesi', _toTR(due)],
        ['İlgili', tgt || '-'],
      ]);
      const repEmail = getUserEmail(tgt);
      if(repEmail) sendMail(mailKey, repEmail, subject, body);
    }
  });
}

// Tedarikçi CRUD
async function saveSupplier(form, isEdit) {
  setState({saving:true});
  const id = isEdit ? form.id : genId();
  const data = {...form, id, ...stamp(), createdAt: form.createdAt||today()};
  await saveDoc('suppliers', id, data);
  const list = isEdit ? state.suppliers.map(s=>s.id===id?data:s) : [...state.suppliers, data];
  setState({suppliers:list, modal:null, saving:false});
  showToast('✅ Tedarikçi kaydedildi!');
}

<script>
// Global Yazdir butonu — her ekranda sag-altta sabit.
// Iki secenek: tum sayfa, veya fareyle secilen bolum (sayfa-bagimsiz).
(function(){
  if(window.__aproPrintInit) return; window.__aproPrintInit=true;
  function ensureContainer(){
    var c=document.getElementById('apro-print-selection');
    if(!c){c=document.createElement('div');c.id='apro-print-selection';document.body.appendChild(c);}
    return c;
  }
  function printWhole(){
    document.body.classList.remove('apro-printing-selection');
    window.print();
  }
  function printSelection(){
    var sel=window.getSelection();
    if(!sel||sel.isCollapsed||sel.rangeCount===0){
      alert('Önce yazdırmak istediğiniz bölümü fareyle seçin, sonra tekrar “Seçili bölüm”e basın.');
      return;
    }
    var c=ensureContainer(); c.innerHTML='';
    for(var i=0;i<sel.rangeCount;i++){ c.appendChild(sel.getRangeAt(i).cloneContents()); }
    document.body.classList.add('apro-printing-selection');
    function cleanup(){ document.body.classList.remove('apro-printing-selection'); c.innerHTML=''; window.removeEventListener('afterprint',cleanup); }
    window.addEventListener('afterprint',cleanup);
    window.print();
  }
  function build(){
    if(document.getElementById('apro-print-fab')) return;
    var fab=document.createElement('div'); fab.id='apro-print-fab';
    var menu=document.createElement('div'); menu.className='apro-print-menu';
    var b1=document.createElement('button'); b1.textContent='🖨️ Tüm sayfa'; b1.onclick=function(){fab.classList.remove('open');printWhole();};
    var b2=document.createElement('button'); b2.textContent='✂️ Seçili bölüm'; b2.onclick=function(){fab.classList.remove('open');printSelection();};
    menu.appendChild(b1); menu.appendChild(b2);
    var tog=document.createElement('button'); tog.className='apro-print-toggle'; tog.title='Yazdır'; tog.setAttribute('aria-label','Yazdır'); tog.textContent='🖨️';
    tog.onclick=function(e){e.stopPropagation();fab.classList.toggle('open');};
    fab.appendChild(menu); fab.appendChild(tog);
    document.body.appendChild(fab);
    document.addEventListener('click',function(){fab.classList.remove('open');});
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',build);}else{build();}
})();
</script>
