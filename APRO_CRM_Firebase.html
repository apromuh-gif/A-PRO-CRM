function buildImportModal() {
  let step = 1; // 1: dosya seç, 2: modül seç, 3: sütun eşleştir, 4: önizleme
  let rawData = [];
  let headers = [];
  let selectedModule = 'customers';
  let mapping = {};
  let parsedRows = [];

  const MODULES = {
    customers: {
      label: '👥 Müşteriler',
      fields: [
        {key:'firmName',  label:'Firma Adı *', required:true},
        {key:'sector',    label:'Sektör'},
        {key:'phone',     label:'Telefon'},
        {key:'email',     label:'E-posta'},
        {key:'address',   label:'Adres'},
        {key:'web',       label:'Web Adresi'},
        {key:'notes',     label:'Notlar'},
      ]
    },
    suppliers: {
      label: '🏭 Tedarikçiler',
      fields: [
        {key:'firmName',     label:'Firma Adı *', required:true},
        {key:'supplierType', label:'Tedarikçi Türü'},
        {key:'phone',        label:'Telefon'},
        {key:'email',        label:'E-posta'},
        {key:'address',      label:'Adres'},
        {key:'notes',        label:'Notlar'},
      ]
    },
    opportunities: {
      label: '🎯 Fırsatlar',
      fields: [
        {key:'title',      label:'Başlık *', required:true},
        {key:'value',      label:'Değer (EUR)'},
        {key:'stage',      label:'Aşama'},
        {key:'sector',     label:'Sektör'},
        {key:'assignedTo', label:'Satış Temsilcisi'},
        {key:'dueDate',    label:'Sipariş Tarihi'},
        {key:'notes',      label:'Notlar'},
      ]
    },
    proposals: {
      label: '📄 Teklif Talepleri',
      fields: [
        {key:'title',       label:'Başlık *', required:true},
        {key:'amount',      label:'Tutar (EUR)'},
        {key:'status',      label:'Durum'},
        {key:'preparedBy',  label:'Hazırlayan'},
        {key:'validUntil',  label:'Dead Line'},
        {key:'notes',       label:'Notlar'},
      ]
    },
  };

  const wrap = h('div',{});

  function render() {
    wrap.innerHTML = '';

    // STEP 1: Dosya seç
    if(step===1) {
      const fi = document.createElement('input');
      fi.type='file'; fi.accept='.xlsx,.xls,.csv'; fi.style.display='none';

      fi.addEventListener('change', e => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            let rows = [];
            if(file.name.endsWith('.csv')) {
              // CSV parse
              const text = ev.target.result;
              const lines = text.split('\n').filter(l=>l.trim());
              rows = lines.map(l => l.split(',').map(v=>v.trim().replace(/^"|"$/g,'')));
            } else {
              // Excel parse via SheetJS
              const wb = XLSX.read(ev.target.result, {type:'array'});
              const ws = wb.Sheets[wb.SheetNames[0]];
              rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
            }
            if(rows.length < 2) { showToast('⚠️ Dosya boş veya geçersiz','#d97706'); return; }
            headers = rows[0].map(String);
            rawData = rows.slice(1).filter(r=>r.some(v=>String(v).trim()));
            step=2; render();
          } catch(err) {
            showToast('❌ Dosya okunamadı: '+err.message,'#dc2626');
          }
        };
        if(file.name.endsWith('.csv')) reader.readAsText(file, 'UTF-8');
        else reader.readAsArrayBuffer(file);
      });

      const dropZone = h('div',{
        style:{border:`2px dashed ${G4}`,borderRadius:'14px',padding:'40px 20px',textAlign:'center',cursor:'pointer',background:G,transition:'all .2s'}
      },
        h('div',{style:{fontSize:'48px',marginBottom:'12px'}},'📊'),
        h('div',{style:{fontSize:'16px',fontWeight:'700',color:T1,marginBottom:'6px'}},'Excel veya CSV dosyası seçin'),
        h('div',{style:{fontSize:'13px',color:T3,marginBottom:'20px'}},'.xlsx, .xls, .csv formatları desteklenir'),
        btn('📁 Dosya Seç',()=>fi.click(),'linear-gradient(135deg,#6366f1,#8b5cf6)','#fff','10px 24px',{fontSize:'14px'})
      );
      dropZone.appendChild(fi);
      dropZone.addEventListener('click',e=>{ if(e.target===dropZone||e.target.tagName==='DIV') fi.click(); });
      dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.style.borderColor='#6366f1';dropZone.style.background='rgba(99,102,241,.05)';});
      dropZone.addEventListener('dragleave',()=>{dropZone.style.borderColor=G4;dropZone.style.background=G;});
      dropZone.addEventListener('drop',e=>{
        e.preventDefault();dropZone.style.borderColor=G4;dropZone.style.background=G;
        fi.files=e.dataTransfer.files; fi.dispatchEvent(new Event('change'));
      });

      const tipBox = h('div',{style:{background:G,border:`1px solid ${G4}`,borderRadius:'10px',padding:'14px',marginTop:'16px'}},
        h('div',{style:{fontSize:'12px',fontWeight:'700',color:T2,marginBottom:'8px'}},'💡 Excel nasıl hazırlanmalı?'),
        h('div',{style:{fontSize:'12px',color:T3,lineHeight:'1.6'}},
          '• 1. satır başlıklar olmalı (Firma Adı, Sektör, Telefon...)',h('br'),
          '• 2. satırdan itibaren veriler olmalı',h('br'),
          '• Tarih alanları: GG.AA.YYYY veya YYYY-AA-GG formatında',h('br'),
          '• Türkçe karakterler için dosyayı UTF-8 kaydedin'
        )
      );
      wrap.appendChild(dropZone);
      wrap.appendChild(tipBox);
    }

    // STEP 2: Modül seç
    else if(step===2) {
      wrap.appendChild(h('div',{style:{marginBottom:'16px'}},
        h('div',{style:{fontSize:'13px',color:T3,marginBottom:'4px'}},'✅ Dosya okundu:'),
        h('div',{style:{background:G,border:`1px solid ${G4}`,borderRadius:'8px',padding:'10px 14px',fontSize:'13px',color:T1}},
          h('strong',{},rawData.length+' satır'),', ',headers.length+' sütun bulundu.',
          h('div',{style:{fontSize:'11px',color:T3,marginTop:'4px'}},'Sütunlar: '+headers.slice(0,6).join(', ')+(headers.length>6?' ...':''))
        )
      ));
      wrap.appendChild(h('div',{style:{fontWeight:'700',color:T1,marginBottom:'12px',fontSize:'14px'}},'Hangi modüle aktarılsın?'));
      const grid = h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}});
      Object.entries(MODULES).forEach(([key,mod])=>{
        const card = h('div',{
          style:{background:selectedModule===key?'linear-gradient(135deg,#6366f1,#8b5cf6)':'#f8fafc',border:`2px solid ${selectedModule===key?'#6366f1':'#e2e8f0'}`,borderRadius:'12px',padding:'16px',cursor:'pointer',textAlign:'center',transition:'all .2s'},
          onClick:()=>{selectedModule=key; render();}
        },
          h('div',{style:{fontSize:'28px',marginBottom:'6px'}},mod.label.split(' ')[0]),
          h('div',{style:{fontSize:'13px',fontWeight:'700',color:selectedModule===key?'#fff':T1}},mod.label.split(' ').slice(1).join(' '))
        );
        grid.appendChild(card);
      });
      wrap.appendChild(grid);
      wrap.appendChild(h('div',{style:{height:'16px'}}));
      wrap.appendChild(h('div',{style:{display:'flex',gap:'10px'}},
        btn('← Geri',()=>{step=1;render();},'#21262d','#8b949e','10px 16px'),
        btn('Devam →',()=>{
          mapping={};
          // Otomatik eşleştir: benzer isimler
          const fields=MODULES[selectedModule].fields;
          fields.forEach(f=>{
            const match=headers.find(h=>h.toLowerCase().includes(f.label.toLowerCase().replace(' *','').split(' ')[0]));
            if(match) mapping[f.key]=match;
          });
          step=3; render();
        },'linear-gradient(135deg,#6366f1,#8b5cf6)','#fff','10px 16px',{flex:'1'})
      ));
    }

    // STEP 3: Sütun eşleştir
    else if(step===3) {
      const fields = MODULES[selectedModule].fields;
      wrap.appendChild(h('div',{style:{fontSize:'13px',color:T3,marginBottom:'14px'}},
        'Exceldeki sütunları CRM alanlarıyla eşleştirin. Yıldızlı alanlar zorunludur.'
      ));
      const fieldGrid = h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});
      fields.forEach(f=>{
        const sel = document.createElement('select');
        sel.style.cssText=`flex:1;padding:8px 10px;background:#fff;border:1px solid ${G4};border-radius:8px;font-size:13px;color:${T1};outline:none;`;
        [{v:'',l:'— Eşleştirme Yok —'},...headers.map(h=>({v:h,l:h}))].forEach(opt=>{
          const o=document.createElement('option');
          o.value=opt.v; o.textContent=opt.l;
          if(mapping[f.key]===opt.v) o.selected=true;
          sel.appendChild(o);
        });
        sel.onchange=e=>{ if(e.target.value) mapping[f.key]=e.target.value; else delete mapping[f.key]; };
        fieldGrid.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
          h('div',{style:{width:'160px',fontSize:'13px',fontWeight:f.required?'700':'400',color:f.required?T1:T3,flexShrink:'0'}},f.label),
          h('div',{style:{color:T4,flexShrink:'0'}},'→'),
          sel
        ));
      });
      wrap.appendChild(fieldGrid);
      wrap.appendChild(h('div',{style:{height:'16px'}}));
      wrap.appendChild(h('div',{style:{display:'flex',gap:'10px'}},
        btn('← Geri',()=>{step=2;render();},'#21262d','#8b949e','10px 16px'),
        btn('Önizle →',()=>{
          const fields=MODULES[selectedModule].fields;
          const reqField=fields.find(f=>f.required&&!mapping[f.key]);
          if(reqField){showToast('⚠️ "'+reqField.label+'" alanını eşleştirin','#d97706');return;}
          // Parse
          parsedRows=rawData.slice(0,500).map(row=>{
            const obj={id:genId(),createdAt:today()};
            Object.entries(mapping).forEach(([key,col])=>{
              const ci=headers.indexOf(col);
              if(ci>=0) obj[key]=String(row[ci]||'').trim();
            });
            return obj;
          }).filter(r=>r[Object.keys(mapping).find(k=>MODULES[selectedModule].fields.find(f=>f.key===k&&f.required))]);
          step=4; render();
        },'linear-gradient(135deg,#6366f1,#8b5cf6)','#fff','10px 16px',{flex:'1'})
      ));
    }

    // STEP 4: Önizleme ve import
    else if(step===4) {
      const fields=MODULES[selectedModule].fields;
      const mapped=fields.filter(f=>mapping[f.key]);
      wrap.appendChild(h('div',{style:{background:'#f0fdf4',border:'1px solid #86efac',borderRadius:'10px',padding:'12px 14px',marginBottom:'16px',fontSize:'13px'}},
        h('strong',{style:{color:'#15803d'}},parsedRows.length+' kayıt'),
        h('span',{style:{color:'#166534'}},' aktarılmaya hazır → '+MODULES[selectedModule].label)
      ));
      // Mini tablo önizleme (ilk 5 kayıt)
      const previewWrap=h('div',{style:{overflowX:'auto',marginBottom:'16px',border:`1px solid ${G4}`,borderRadius:'10px'}});
      const table=h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'12px'}});
      const thead=h('thead',{});
      const headerRow=h('tr',{style:{background:G}});
      mapped.forEach(f=>{
        headerRow.appendChild(h('th',{style:{padding:'8px 12px',textAlign:'left',fontWeight:'700',color:T2,borderBottom:`1px solid ${G4}`,whiteSpace:'nowrap'}},f.label.replace(' *','')));
      });
      thead.appendChild(headerRow); table.appendChild(thead);
      const tbody=h('tbody',{});
      parsedRows.slice(0,5).forEach((row,i)=>{
        const tr=h('tr',{style:{background:i%2?G:'transparent'}});
        mapped.forEach(f=>{
          tr.appendChild(h('td',{style:{padding:'8px 12px',color:T1,borderBottom:`1px solid ${G4}`,maxWidth:'150px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},String(row[f.key]||'')));
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      previewWrap.appendChild(table);
      if(parsedRows.length>5) previewWrap.appendChild(h('div',{style:{padding:'8px 12px',fontSize:'11px',color:T3}},'... ve '+(parsedRows.length-5)+' kayıt daha'));
      wrap.appendChild(previewWrap);

      // Mükerrer kontrol - firmName bazında
      const DUPE_KEY = {customers:'firmName', suppliers:'firmName', opportunities:'title', proposals:'title'};
      const dupeField = DUPE_KEY[selectedModule]||'firmName';
      const existingNames = new Set((state[selectedModule]||[]).map(x=>(x[dupeField]||'').trim().toLowerCase()));
      const toImport = parsedRows.filter(r=>(r[dupeField]||'').trim());
      const newRows   = toImport.filter(r=>!existingNames.has((r[dupeField]||'').trim().toLowerCase()));
      const skipRows  = toImport.filter(r=> existingNames.has((r[dupeField]||'').trim().toLowerCase()));

      // Özet kutusu
      const summaryBox = h('div',{style:{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:'10px',padding:'12px 14px',marginBottom:'12px',fontSize:'13px'}},
        h('div',{style:{display:'flex',gap:'16px',flexWrap:'wrap'}},
          h('div',{},h('span',{style:{fontWeight:'700',color:'#16a34a'}},newRows.length+' yeni'),h('span',{style:{color:'#4a6080'}},' kayıt eklenecek')),
          skipRows.length ? h('div',{},h('span',{style:{fontWeight:'700',color:'#d97706'}},skipRows.length+' kayıt'),h('span',{style:{color:'#4a6080'}},' zaten var, atlanacak')) : h('span')
        ),
        skipRows.length ? h('div',{style:{marginTop:'8px',fontSize:'11px',color:'#94a3b8'}},
          'Atlananlar: '+skipRows.slice(0,5).map(r=>r[dupeField]).join(', ')+(skipRows.length>5?' ...':'')
        ) : h('span')
      );
      wrap.appendChild(summaryBox);

      const statusDiv=h('div',{style:{display:'none'}});
      wrap.appendChild(h('div',{style:{display:'flex',gap:'10px'}},
        btn('← Geri',()=>{step=3;render();},'#21262d','#8b949e','10px 16px'),
        btn((newRows.length?'✅ '+newRows.length+' Kaydı Ekle':'Eklenecek Kayıt Yok'),async()=>{
          if(!newRows.length){showToast('⚠️ Eklenecek yeni kayıt yok — tümü zaten mevcut.','#d97706');return;}
          statusDiv.style.cssText='display:block;background:#0f2a1a;border:1px solid #10b981;border-radius:8px;padding:12px 14px;color:#4ade80;font-size:13px;margin-top:10px;';
          statusDiv.textContent='⏳ Aktarılıyor...';
          try {
            let count=0;
            for(const row of newRows) {
              await db.collection(selectedModule).doc(row.id).set({...row,...stamp()});
              count++;
              if(count%10===0) statusDiv.textContent=`⏳ ${count}/${newRows.length} kayıt eklendi...`;
            }
            const newDocs=await db.collection(selectedModule).get();
            state[selectedModule]=newDocs.docs.map(d=>({...d.data(),id:d.id}));
            statusDiv.textContent=`✅ ${count} yeni kayıt eklendi${skipRows.length?' · '+skipRows.length+' mükerrer atlandı':''}.`;
            setTimeout(()=>{setState({modal:null});render();},2000);
          } catch(err) {
            statusDiv.style.background='#2a0f0f'; statusDiv.style.borderColor='#ef4444'; statusDiv.style.color='#f87171';
            statusDiv.textContent='❌ Hata: '+err.message;
          }
        },newRows.length?'linear-gradient(135deg,#10b981,#059669)':'#94a3b8','#fff','10px 16px',{flex:'1'})
      ));
      wrap.appendChild(statusDiv);
    }
  }

  render();
  return modal('📥 Excel / CSV İçe Aktar', wrap, ()=>setState({modal:null}), '620px');
}


function buildBackupModal() {
  const fileInput = h('input',{type:'file',accept:'.json',style:{display:'none'}});
  const statusDiv = h('div',{style:{display:'none'}});
  let drag = false;

  async function restoreFromJSON(file) {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const d = JSON.parse(e.target.result);
        if(!d.customers) throw new Error('Geçersiz dosya');
        if(!confirm('Mevcut tüm veriler silinip yedekten geri yüklenecek. Emin misiniz?')) return;

        statusDiv.style.display='block';
        statusDiv.style.background='#1a1a0f';
        statusDiv.style.border='1px solid #d97706';
        statusDiv.style.color='#fbbf24';
        statusDiv.textContent='⏳ Yükleniyor…';

        // Firebase'e yaz
        const cols = ['customers','opportunities','proposals','services','maintenances'];
        for(const col of cols) {
          // Önce mevcutları sil
          const snap = await db.collection(col).get();
          for(const doc of snap.docs) await doc.ref.delete();
          // Yenilerini yaz
          for(const item of (d[col]||[])) {
            await db.collection(col).doc(String(item.id)).set(item);
          }
        }
        // State güncelle
        state.customers = d.customers||[];
        state.opportunities = d.opportunities||[];
        state.proposals = d.proposals||[];
        state.services = d.services||[];
        state.maintenances = d.maintenances||[];

        statusDiv.style.background='#0f2a1a';
        statusDiv.style.border='1px solid #10b981';
        statusDiv.style.color='#4ade80';
        statusDiv.textContent='✅ Veri başarıyla geri yüklendi!';
        setTimeout(()=>setState({modal:null}),1500);
      } catch(err) {
        statusDiv.style.display='block';
        statusDiv.style.background='#2a0f0f';
        statusDiv.style.border='1px solid #ef4444';
        statusDiv.style.color='#f87171';
        statusDiv.textContent='❌ Geçersiz dosya. Lütfen doğru JSON yedek dosyasını seçin.';
      }
    };
    reader.readAsText(file);
  }

  fileInput.addEventListener('change', e=>restoreFromJSON(e.target.files[0]));

  const dropZone = h('div',{style:{border:`2px dashed ${G4}`,borderRadius:'10px',padding:'20px',textAlign:'center',cursor:'pointer',background:G,marginBottom:'4px'}},
    h('div',{style:{fontSize:'28px',marginBottom:'6px'}},'📂'),
    h('div',{style:{color:T3,fontSize:'13px'}},'JSON yedek dosyasını sürükleyin veya tıklayın'),
    fileInput
  );
  dropZone.addEventListener('click',()=>fileInput.click());
  dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.style.borderColor='#6366f1';dropZone.style.background='#1c2128';});
  dropZone.addEventListener('dragleave',()=>{dropZone.style.borderColor=G4;dropZone.style.background=G;});
  dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.style.borderColor=G4;dropZone.style.background=G;restoreFromJSON(e.dataTransfer.files[0]);});

  statusDiv.style.padding='10px 14px';
  statusDiv.style.borderRadius='8px';
  statusDiv.style.fontSize='13px';
  statusDiv.style.marginTop='10px';

  const content = h('div',{},
    h('div',{style:{background:'#0f0f0f',borderRadius:'10px',padding:'14px',marginBottom:'16px',border:`1px solid ${G3}`}},
      lbl('Mevcut Veri'),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'6px',marginTop:'8px'}},
        ...[{l:'Firma',v:state.customers.length,c:'#6366f1'},{l:'Fırsat',v:state.opportunities.length,c:'#f97316'},{l:'Teklif',v:state.proposals.length,c:'#3b82f6'},{l:'T.Servis',v:state.services.length,c:'#06b6d4'},{l:'P.Bakım',v:state.maintenances.length,c:'#10b981'}].map(s=>
          h('div',{style:{textAlign:'center',background:G2,borderRadius:'8px',padding:'8px 2px',border:`1px solid ${G4}`}},
            h('div',{style:{fontSize:'18px',fontWeight:'700',color:s.c}},String(s.v)),
            h('div',{style:{fontSize:'10px',color:T3}},s.l)
          )
        )
      )
    ),
    h('div',{style:{fontWeight:'700',color:T1,marginBottom:'10px',fontSize:'13px'}},'📥 Yedek Al'),
    h('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'18px'}},
      h('button',{onClick:dlJSON,style:{display:'flex',alignItems:'center',gap:'10px',background:G,border:`1px solid ${G3}`,borderRadius:'10px',padding:'12px 14px',cursor:'pointer',width:'100%',fontFamily:"'DM Sans',sans-serif"}},
        h('span',{style:{fontSize:'24px'}},'📄'),
        h('div',{},h('div',{style:{color:'#60a5fa',fontWeight:'700',fontSize:'13px'}},'JSON Yedek İndir'),h('div',{style:{color:T3,fontSize:'11px'}},'Geri yüklenebilir'))
      ),

// Çeyrek dönem hesapla (Q1=0-2, Q2=3-5, Q3=6-8, Q4=9-11)
function getQuarter(date) {
  return Math.floor(date.getMonth()/3);
}
function getQuarterName(year, q) {
  var names = ["Ocak-Mart","Nisan-Haziran","Temmuz-Eylül","Ekim-Aralık"];
  return names[q]+" "+year;
}

// Rapor için veri hazırla
function prepareReportData() {
  var O=state.opportunities, P=state.proposals, S=state.services, C=state.customers;
  var LOST=["KAÇTI","NO GO","FIRSAT ÖLDÜ"];
  var now=new Date();
  var totalWon=O.filter(function(o){return o.stage==="KAZANILDI";}).reduce(function(a,o){return a+(Number(o.value)||0);},0);
  var totalPipe=O.filter(function(o){return !LOST.includes(o.stage)&&o.stage!=="KAZANILDI";}).reduce(function(a,o){return a+(Number(o.value)||0);},0);
  var totalLost=O.filter(function(o){return LOST.includes(o.stage);}).reduce(function(a,o){return a+(Number(o.value)||0);},0);
  var compTarget=(state.targets&&state.targets.company)||0;
  var targetPct=compTarget>0?Math.round(totalWon/compTarget*100):0;
  var propWon=P.filter(function(p){return p.status==="Onaylandı";}).reduce(function(a,p){return a+(Number(p.amount)||0);},0);
  var propPending=P.filter(function(p){return p.status==="Gönderildi"||p.status==="Hazırlanıyor";}).reduce(function(a,p){return a+(Number(p.amount)||0);},0);
  var tenDaysAgo=new Date(); tenDaysAgo.setDate(tenDaysAgo.getDate()-10);
  var needFollow=O.filter(function(o){if(LOST.includes(o.stage)||o.stage==="KAZANILDI")return false;if(!o.updatedAt&&!o.createdAt)return true;return new Date(o.updatedAt||o.createdAt)<tenDaysAgo;}).length;
  var repData=state.users.filter(function(u){return u.active!==false&&u.hasTarget!==false;}).map(function(u){
    var repO=O.filter(function(o){return o.assignedTo===u.displayName;});
    var won=repO.filter(function(o){return o.stage==="KAZANILDI";});
    var lost=repO.filter(function(o){return LOST.includes(o.stage);});
    var wonVal=won.reduce(function(a,o){return a+(Number(o.value)||0);},0);
    var hitDenom=won.length+lost.length;
    var hitRate=hitDenom>0?Math.round(won.length/hitDenom*100):0;
    var target=(state.targets&&state.targets.reps&&state.targets.reps[u.displayName])||0;
    var targetP=target>0?Math.round(wonVal/target*100):0;
    return {name:u.displayName,total:repO.length,wonCount:won.length,lostCount:lost.length,wonVal:wonVal,hitRate:hitRate,target:target,targetP:targetP};
  });
  var sectorMap={};
  O.forEach(function(o){var s=o.sector||"Diğer";if(!sectorMap[s])sectorMap[s]={val:0,cnt:0,won:0,lost:0};sectorMap[s].val+=Number(o.value)||0;sectorMap[s].cnt++;if(o.stage==="KAZANILDI")sectorMap[s].won++;if(LOST.includes(o.stage))sectorMap[s].lost++;});
  var topSectors=Object.entries(sectorMap).sort(function(a,b){return b[1].val-a[1].val;}).slice(0,7).map(function(e){var winRate=e[1].cnt>0?Math.round(e[1].won/e[1].cnt*100):0;return e[0]+": "+e[1].cnt+" firsat, EUR "+e[1].val.toLocaleString("tr-TR")+", "+e[1].won+" kazanildi, "+e[1].lost+" kacti, win-rate %"+winRate;}).join("\n");
  var stageText=STAGES.map(function(s){var items=O.filter(function(o){return o.stage===s;});if(!items.length)return "";return s+": "+items.length+" adet EUR "+items.reduce(function(a,o){return a+(Number(o.value)||0);},0).toLocaleString("tr-TR");}).filter(Boolean).join("\n");
  var repLines=repData.map(function(r){return "- "+r.name+": "+r.total+" firsat, "+r.wonCount+" kazanildi, "+r.lostCount+" kacti, Hit Rate: %"+r.hitRate+", Pipeline Ciro: EUR "+r.wonVal.toLocaleString("tr-TR")+", Hedef: EUR "+r.target.toLocaleString("tr-TR")+" (%"+r.targetP+")";}).join("\n");
  // Proje büyüklük analizi
  var small=O.filter(function(o){return (Number(o.value)||0)<50000;}).length;
  var mid=O.filter(function(o){var v=Number(o.value)||0;return v>=50000&&v<200000;}).length;
  var large=O.filter(function(o){return (Number(o.value)||0)>=200000;}).length;
  var avgDeal=O.length>0?Math.round(O.reduce(function(a,o){return a+(Number(o.value)||0);},0)/O.length):0;
  var projSize="Kucuk (<50K EUR): "+small+" adet | Orta (50K-200K EUR): "+mid+" adet | Buyuk (>200K EUR): "+large+" adet | Ortalama: EUR "+avgDeal.toLocaleString("tr-TR");
  // Müşteri segmentasyonu
  var custWithOpp=C.filter(function(cu){return O.some(function(o){return o.customerId===cu.id;});}).length;
  var custNoOpp=C.length-custWithOpp;
  var custSegment="Aktif musteri (firmasi var): "+custWithOpp+" | Pasif musteri (firsat yok): "+custNoOpp+" | Toplam firma: "+C.length;
  // Kayıp analizi
  var lostOpps=O.filter(function(o){return LOST.includes(o.stage);});
  var lostBySector={};
  lostOpps.forEach(function(o){var s=o.sector||"Diger";if(!lostBySector[s])lostBySector[s]=0;lostBySector[s]++;});
  var lostSectors=Object.entries(lostBySector).sort(function(a,b){return b[1]-a[1];}).map(function(e){return e[0]+": "+e[1];}).join(", ");
  // Takip analizi
  var stalePipe=O.filter(function(o){if(LOST.includes(o.stage)||o.stage==="KAZANILDI")return false;var d2=new Date(o.updatedAt||o.createdAt||0);return (now-d2)/(1000*60*60*24)>10;});
  var staleVal=stalePipe.reduce(function(a,o){return a+(Number(o.value)||0);},0);
  // Servis analizi
  var svcTotal=S.reduce(function(a,s){return a+(Number(s.amount)||0);},0);
  var svcApproved=S.filter(function(s){return s.status==="Onaylandı";}).reduce(function(a,s){return a+(Number(s.amount)||0);},0);
  return {O,P,S,C,LOST,now,totalWon,totalPipe,totalLost,compTarget,targetPct,propWon,propPending,needFollow,repData,topSectors,stageText,repLines,projSize,custSegment,lostSectors,stalePipe,staleVal,svcTotal,svcApproved,avgDeal,small,mid,large};
}

// ── Gemini (Google Search grounding ile) rapor çağrısı ──
// Dönüş: {text, sources} ya da hata durumunda null (toast gösterir)
async function callGeminiReport(systemText, userText, temperature){
  var apiKey=state.geminiKey||"";
  if(!apiKey){showToast("❌ Gemini API Key eksik — 🎯 Hedefler panelinden girin","#dc2626");return null;}
  var url="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+encodeURIComponent(apiKey);
  var resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    systemInstruction:{parts:[{text:systemText}]},
    contents:[{role:"user",parts:[{text:userText}]}],
    tools:[{google_search:{}}],
    generationConfig:{temperature:temperature,maxOutputTokens:8192,thinkingConfig:{thinkingBudget:0}}
  })});
  var data=await resp.json();
  if(data.error){showToast("❌ Gemini API: "+(data.error.message||"hata"),"#dc2626");return null;}
  var cand=(data.candidates||[])[0]||{};
  var parts=(cand.content&&cand.content.parts)||[];
  var text=parts.map(function(p){return p.text||"";}).join("").trim();
  // ```html ... ``` sarmalını temizle
  text=text.replace(/^```html\s*/i,"").replace(/^```\s*/,"").replace(/```\s*$/,"").trim();
  // Google Search kaynaklarını topla
  var sources="";
  var gm=cand.groundingMetadata;
  if(gm&&gm.groundingChunks&&gm.groundingChunks.length){
    var seen={},items=[];
    gm.groundingChunks.forEach(function(c){
      var w=c.web;if(w&&w.uri&&!seen[w.uri]){seen[w.uri]=1;
        items.push("<li style='margin-bottom:6px;font-size:12px;line-height:1.5'><a href='"+w.uri+"' target='_blank' rel='noopener' style='color:#2563eb;text-decoration:none'>"+(w.title||w.uri)+"</a></li>");}
    });
    if(items.length)sources="<section style='margin-top:28px;padding-top:16px;border-top:1px solid #e2e8f0'><h2 style='color:#1e3a5f;font-size:14px;margin-bottom:10px'>📚 Araştırma Kaynakları (Google)</h2><ul style='padding-left:20px;margin:0'>"+items.join("")+"</ul></section>";
  }
  return {text:text,sources:sources};
}

function checkMonthlyReport(){
  if(!state.currentUser||!state.currentUser.isAdmin)return;
  var now=new Date();
  if(now.getDate()>3)return;
  var isQ=[0,3,6,9].includes(now.getMonth());
  var key=(isQ?"q_":"m_")+now.getFullYear()+"_"+now.getMonth();
  if(localStorage.getItem(key))return;
  setTimeout(function(){
    var notifId='apro-monthly-notif';
    if(document.getElementById(notifId))return;
    var notif=document.createElement("div");
    notif.id=notifId;
    notif.style.cssText="position:fixed;bottom:80px;right:20px;background:#fff;border:2px solid "+(isQ?"#7c3aed":"#2563eb")+";border-radius:14px;padding:16px 20px;box-shadow:0 8px 30px rgba(37,99,235,.2);z-index:9998;max-width:300px;font-family:'Inter',sans-serif;animation:fu .3s ease";

    var titleEl=document.createElement("div");
    titleEl.style.cssText="font-weight:700;font-size:14px;color:#1e2d4a;margin-bottom:6px";
    titleEl.textContent=isQ?"📊 3 Aylık Rapor Zamanı":"📅 Aylık Rapor Zamanı";
    notif.appendChild(titleEl);

    var descEl=document.createElement("div");
    descEl.style.cssText="font-size:12px;color:#64748b;margin-bottom:12px";
    descEl.textContent=isQ?"Yeni çeyrek başladı. Stratejik 3 aylık raporunuzu oluşturun.":"Yeni ay başladı. Aylık raporunuzu oluşturun.";
    notif.appendChild(descEl);

    var rowEl=document.createElement("div");
    rowEl.style.cssText="display:flex;gap:8px";

    function dismiss(){var el=document.getElementById(notifId);if(el)el.remove();}

    var btnOlustur=document.createElement("button");
    btnOlustur.style.cssText="flex:1;background:linear-gradient(135deg,"+(isQ?"#7c3aed,#a855f7":"#2563eb,#1d4ed8")+");color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit";
    btnOlustur.textContent="Oluştur";
    btnOlustur.addEventListener("click",function(){
      dismiss();
      localStorage.setItem(key,"1");
      if(isQ) generateQuarterlyReport(); else generateMonthlyReport();
    });

    var btnSonra=document.createElement("button");
    btnSonra.style.cssText="background:#f1f5f9;color:#4a6080;border:1px solid #b0c8e0;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit";
    btnSonra.textContent="Sonra";
    btnSonra.addEventListener("click",function(){dismiss();localStorage.setItem(key,"skip");});

    rowEl.appendChild(btnOlustur);
    rowEl.appendChild(btnSonra);
    notif.appendChild(rowEl);
    document.body.appendChild(notif);
  },2500);
}

function printDashboard() {
  const O = state.opportunities;
  const P = state.proposals;
  const S = state.services;
  const LOST = ["KAÇTI","NO GO","FIRSAT ÖLDÜ"];
  const totalWon = O.filter(o=>o.stage==='KAZANILDI').reduce((a,o)=>a+(Number(o.value)||0),0);
  const totalPipe = O.filter(o=>!LOST.includes(o.stage)&&o.stage!=='KAZANILDI').reduce((a,o)=>a+(Number(o.value)||0),0);
  const compTarget = state.targets?.company || 0;
  const pct = compTarget > 0 ? Math.min(100,Math.round(totalWon/compTarget*100)) : 0;

  // Temsilci verileri
  const repRows = state.users.filter(u=>u.active!==false&&u.hasTarget!==false).map(u=>{
    const repO = O.filter(o=>o.assignedTo===u.displayName);
    const won = repO.filter(o=>o.stage==='KAZANILDI').length;
    const lostC = repO.filter(o=>LOST.includes(o.stage)).length;
    const wonVal = repO.filter(o=>o.stage==='KAZANILDI').reduce((a,o)=>a+(Number(o.value)||0),0);
    const hitDenom = won + lostC;
    const hit = hitDenom > 0 ? Math.round(won/hitDenom*100) : 0;
    const target = state.targets?.reps?.[u.displayName] || 0;
    const targetPct = target > 0 ? Math.min(100,Math.round(wonVal/target*100)) : 0;
    return `<tr>
      <td>${escapeHtml(u.displayName)}</td>
      <td style="font-weight:700;color:#2563eb">${eur(wonVal)}</td>
      <td>${repO.length}</td>
      <td style="color:#16a34a;font-weight:700">${won}</td>
      <td style="color:#dc2626;font-weight:700">${lostC}</td>
      <td style="font-weight:700">${hit}%</td>
      <td>${eur(target)}</td>
      <td style="font-weight:700;color:${targetPct>=100?'#16a34a':targetPct>=50?'#d97706':'#dc2626'}">${target?targetPct+'%':'-'}</td>
    </tr>`;
  }).join('');

  // Aşama verileri
  const stageRows = STAGES.map(s=>{
    const items = O.filter(o=>o.stage===s);
    const val = items.reduce((a,o)=>a+(Number(o.value)||0),0);
    if(!items.length) return '';
    return `<tr><td>${s}</td><td>${items.length}</td><td style="font-weight:700;color:#2563eb">${eur(val)}</td></tr>`;
  }).join('');

  const printHTML = `<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"/>
<title>A-PRO CRM — Yönetici Raporu</title>
<style>
  body{font-family:Arial,sans-serif;padding:24px;color:#1e293b;font-size:13px}

  h2{color:#1e2d4a;font-size:14px;margin:20px 0 10px;border-bottom:2px solid #1e2d4a;padding-bottom:6px}
  .meta{font-size:11px;color:#64748b;margin-bottom:20px}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .kpi{background:#f0f5fc;border:1px solid #b0c8e0;border-radius:8px;padding:12px;text-align:center}
  .kpi-val{font-size:20px;font-weight:800;color:#2563eb}

async function openTargetsModal() {
  // Modal açılmadan önce kullanıcı ve hedef verilerini Firebase'den taze çek
  try {
    const [usSnap, tSnap] = await Promise.all([
      db.collection('users').get(),
      db.collection('settings').doc('targets').get()
    ]);
    if(!usSnap.empty) state.users = usSnap.docs.map(d=>({...d.data(), email:d.id}));
    if(tSnap.exists) {
      const raw = tSnap.data() || {};
      const keys = Object.keys(raw);
      const looksYearly = keys.length>0 && keys.every(k=>/^\d{4}$/.test(k));
      // Yıl bazlı yapı → doğrudan; eski düz yapı → içinde bulunulan yıla sar (geriye dönük uyum).
      state.targetsByYear = looksYearly ? raw : { [String(new Date().getFullYear())]: { ..._emptyTargets(), ...raw } };
    }
    // NOT: state.targets'a dokunma — dashboard onu içinde bulunulan takvim yılı için okur.
    // Hedef modalı düzenlenecek yılı targetsForYear() ile buildTargetsModal içinde taze alır.
  } catch(e) { /* bağlantı yoksa mevcut state kullanılır */ }
  setState({modal:{type:'targets', item:null}});
}

function buildAdminModal() {
  let users = [...state.users];
  let adding = false;
  let editingId = null;
  let editPw = '';
  let editingUser = null; // tam düzenleme modu
  let newU = {email:'',password:'',displayName:'',isAdmin:false};
  let msgEl = null;

  function flash(txt, ok=true) {
    if(msgEl) { msgEl.textContent=txt; msgEl.style.color=ok?'#4ade80':'#f87171'; msgEl.style.display='block'; setTimeout(()=>{if(msgEl)msgEl.style.display='none';},3000); }
  }

  async function persistUsers(list) {
    try {
      // Kalan kullanıcıları kaydet (şifre Firestore'a YAZILMAZ — Firebase Auth tutar)
      for(const u of list) { const {password, ...rest} = u; await db.collection('users').doc(u.email).set(rest); }
      // Silinenleri Firebase'den kaldır
      const deleted = users.filter(ou=>!list.find(nu=>nu.email===ou.email));
      for(const u of deleted) {
        await db.collection('users').doc(u.email).delete();
        // Silme doğrulaması: belge hâlâ varsa hata fırlat
        const check = await db.collection('users').doc(u.email).get({source:'server'});
        if(check.exists) throw new Error('Kullanici silinemedi: '+u.email);
        // Teklif programı erişimini iptal et (fire-and-forget)
        fetch(TEKLIF_USERS_URL, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json', 'x-crm-key': TEKLIF_API_KEY },
          body: JSON.stringify({ email: u.email }),
        }).catch(() => {});
      }
      users = list;
      state.users = list;
      rerender();
    } catch(e) {
      flash('❌ Firebase hatası: '+e.message, false);

function kpiCard(label, value, sub, color, icon) {
  return h('div',{style:{background:'#ffffff',border:`2px solid ${color}44`,borderRadius:'14px',padding:'18px 20px',boxShadow:'0 2px 8px rgba(30,58,95,.08)'}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}},
      h('div',{style:{fontSize:'11px',color:T3,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700'}},label),
      h('div',{style:{fontSize:'20px'}},icon)
    ),
    h('div',{style:{fontSize:'24px',fontWeight:'800',color,marginBottom:'4px'}},value),
    h('div',{style:{fontSize:'12px',color:T3}},sub)
  );
}

function card(title, content, extra={}) {
  return h('div',{style:{background:'#edf5fc',border:'1px solid #b0c8e0',borderRadius:'14px',boxShadow:'0 2px 8px rgba(20,40,80,.08)',padding:'20px',...extra}},
    h('h3',{style:{fontSize:'14px',fontWeight:'700',marginBottom:'16px',color:'#1e2d4a',borderBottom:'1px solid #c0d8f0',paddingBottom:'10px'}},title),
    content
  );
}

function barChart(items, maxVal, colorFn, labelFn, valueFn, subFn) {
  const div = h('div',{});
  if(!items.length) { div.appendChild(h('div',{style:{color:T3,fontSize:'13px',textAlign:'center',padding:'20px'}},'Veri yok.')); return div; }
  items.forEach(item => {
    const pct = maxVal > 0 ? (valueFn(item)/maxVal*100) : 0;
    const bar = h('div',{style:{marginBottom:'12px'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'5px'}},
        h('span',{style:{fontSize:'13px',color:T1,fontWeight:'600'}},labelFn(item)),
        h('div',{style:{display:'flex',gap:'12px',alignItems:'center'}},
          subFn ? h('span',{style:{fontSize:'11px',color:T3}},subFn(item)) : h('span'),
          h('span',{style:{fontSize:'13px',fontWeight:'700',color:colorFn(item)}},eur(valueFn(item)))
        )
      ),
      h('div',{style:{height:'8px',background:'#c8daea',borderRadius:'4px',overflow:'hidden'}},
        h('div',{style:{height:'100%',width:pct+'%',background:colorFn(item),borderRadius:'4px',transition:'width .4s ease'}})
      )
    );
    div.appendChild(bar);
  });
  return div;
}

function pieChart(segments, size=120) {
  const total = segments.reduce((a,s)=>a+s.value,0);
  if(!total) return h('div',{style:{color:T3,fontSize:'13px',textAlign:'center',padding:'16px'}},'Veri yok.');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 36 36');
  svg.setAttribute('width',size); svg.setAttribute('height',size);
  svg.style.transform = 'rotate(-90deg)';
  let offset = 0;
  segments.filter(s=>s.value>0).forEach(s => {
    const pct = s.value/total*100;
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx','18'); circle.setAttribute('cy','18'); circle.setAttribute('r','15.9');
    circle.setAttribute('fill','none'); circle.setAttribute('stroke',s.color);
    circle.setAttribute('stroke-width','3.2');
    circle.setAttribute('stroke-dasharray',`${pct} ${100-pct}`);
    circle.setAttribute('stroke-dashoffset',String(-offset));
    svg.appendChild(circle);
    offset += pct;
  });
  const legend = h('div',{style:{display:'flex',flexDirection:'column',gap:'6px',flex:'1'}});
  segments.filter(s=>s.value>0).forEach(s => {
    legend.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
      h('div',{style:{width:'10px',height:'10px',borderRadius:'3px',background:s.color,flexShrink:'0'}}),
      h('div',{style:{flex:'1'}},
        h('div',{style:{fontSize:'12px',fontWeight:'600',color:T1}},s.label),
        h('div',{style:{fontSize:'11px',color:T3}},Math.round(s.value/total*100)+'% · '+eur(s.value))
      )
    ));
  });
  return h('div',{style:{display:'flex',alignItems:'center',gap:'20px',flexWrap:'wrap'}},svg,legend);
}

function miniTable(headers, rows) {
  const thead = h('thead',{},h('tr',{style:{background:'#1e2d4a'}},
    ...headers.map(hh=>h('th',{style:{color:'#fff',padding:'9px 12px',fontSize:'11px',fontWeight:'700',textAlign:'left',whiteSpace:'nowrap'}},hh))
  ));
  const tbody = h('tbody',{});
  if(!rows.length) {
    tbody.appendChild(h('tr',{},h('td',{colspan:String(headers.length),style:{padding:'20px',textAlign:'center',color:T3,fontSize:'13px'}},'Veri yok.')));
  }
  rows.forEach((row,i) => {
    const tr = h('tr',{style:{background:i%2===0?'#ffffff':'#f0f5fc'},className:'rh'});
    row.forEach(cell => tr.appendChild(h('td',{style:{padding:'9px 12px',fontSize:'13px',borderTop:'1px solid #d0daea'}},cell)));
    tbody.appendChild(tr);
  });
  return h('div',{style:{overflowX:'auto'}},h('table',{style:{width:'100%',borderCollapse:'collapse',minWidth:'400px'}},thead,tbody));
}

// ═══════════════════════════════════════════════════════
// C — PAZARLAMA / İŞ GELİŞTİRME DASHBOARD
// ═══════════════════════════════════════════════════════
function renderDashboardMarketing() {
  const O_ALL = filterFY(state.opportunities, activeFiscalYear());  // yıl merceği
  const C = state.customers;                                        // ORTAK — mercek yok
  const LOST = ["KAÇTI","NO GO","FIRSAT ÖLDÜ"];

  // Tarih filtresi
  if(!state.mktDateFrom) state.mktDateFrom = '';
  if(!state.mktDateTo) state.mktDateTo = '';
  const O = O_ALL.filter(o=>{
    if(!state.mktDateFrom && !state.mktDateTo) return true;
    const d = new Date(o.createdAt||o.updatedAt||'2020-01-01');
    if(state.mktDateFrom && d < _toDate(state.mktDateFrom)) return false;
    if(state.mktDateTo && d > _toDate(state.mktDateTo)) return false;
    return true;
  });

  // Tarih filtresi kutusu
  const mktDateBox = h('div',{style:{background:'#ffffff',border:'1px solid #d0daea',borderRadius:'12px',padding:'14px 18px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap'}},
    h('span',{style:{fontSize:'13px',fontWeight:'600',color:'#1e2d4a'}},'📅 Tarih Aralığı:'),
    h('input',{type:'date',value:state.mktDateFrom||'',style:{padding:'7px 10px',border:'1.5px solid #b8d4ec',borderRadius:'8px',fontSize:'13px',fontFamily:"'Inter',sans-serif",color:'#0f1f35',outline:'none'},oninput:e=>{state.mktDateFrom=e.target.value;render();}}),
    h('span',{style:{color:'#64748b',fontSize:'13px'}},'—'),
    h('input',{type:'date',value:state.mktDateTo||'',style:{padding:'7px 10px',border:'1.5px solid #b8d4ec',borderRadius:'8px',fontSize:'13px',fontFamily:"'Inter',sans-serif",color:'#0f1f35',outline:'none'},oninput:e=>{state.mktDateTo=e.target.value;render();}}),
    btn('Temizle',()=>{state.mktDateFrom='';state.mktDateTo='';render();},'#f1f5f9','#4a6080','7px 14px',{fontSize:'12px',border:'1px solid #b0c8e0',borderRadius:'8px'}),
    (state.mktDateFrom||state.mktDateTo)?h('span',{style:{fontSize:'12px',color:'#2563eb',fontWeight:'600'}},O.length+' / '+O_ALL.length+' fırsat gösteriliyor'):h('span')
  );

  // KPI
  const totalFirms = C.length;
  const newFirms = C.filter(c=>c.createdAt&&new Date(c.createdAt)>=new Date(Date.now()-30*86400000)).length;
  const activePipeline = O.filter(o=>!LOST.includes(o.stage)).reduce((a,o)=>a+(Number(o.value)||0),0);
  const lostCount = O.filter(o=>LOST.includes(o.stage)).length;
  const totalCount = O.length;
  const lostRate = totalCount ? Math.round(lostCount/totalCount*100) : 0;
  const pubSector = O.filter(o=>o.adminId&&state.customers.find(c=>c.id===o.customerId)?.sector==='KAMU').length;

  const kpiGrid = h('div',{style:{display:'grid',gridTemplateColumns:window.innerWidth<=480?'1fr 1fr':'repeat(auto-fit,minmax(180px,1fr))',gap:window.innerWidth<=768?'10px':'14px',marginBottom:window.innerWidth<=768?'14px':'20px'}});
  [
    {l:'Toplam Firma',v:String(totalFirms),s:newFirms+' yeni (son 30 gün)',c:'#2563eb',i:'🏢'},
    {l:'Aktif Pipeline',v:eur(activePipeline),s:O.filter(o=>!LOST.includes(o.stage)).length+' fırsat',c:'#7c3aed',i:'🎯'},
    {l:'Kayıp Oranı',v:lostRate+'%',s:lostCount+' kaybedilen / '+totalCount+' toplam',c:'#dc2626',i:'📉'},
    {l:'Toplam Fırsat',v:String(totalCount),s:'Tüm zamanlar',c:'#16a34a',i:'📊'},
    {l:'Sektör Çeşitliliği',v:String(new Set(O.map(o=>o.sector)).size),s:'Farklı sektör',c:'#0891b2',i:'🌐'},
    {l:'Teknik Servis Kayıt',v:String(state.services.length),s:'Toplam servis kaydı',c:'#ea580c',i:'🔧'},
  ].forEach(k=>kpiGrid.appendChild(kpiCard(k.l,k.v,k.s,k.c,k.i)));

  // Sektör bazlı dağılım
  const sectorMap = {};
  O.forEach(o=>{ const s=o.sector||'Diğer'; if(!sectorMap[s]) sectorMap[s]={val:0,cnt:0}; sectorMap[s].val+=Number(o.value)||0; sectorMap[s].cnt++; });
  const sectorItems = Object.entries(sectorMap).sort((a,b)=>b[1].val-a[1].val).map(([s,d])=>({sector:s,...d}));
  const maxSec = Math.max(1,...sectorItems.map(x=>x.val));
  const SECT_COLORS = ['#2563eb','#7c3aed','#ea580c','#16a34a','#0891b2','#dc2626','#d97706','#475569'];
  const sectorChart = barChart(sectorItems, maxSec, (x,i)=>SECT_COLORS[sectorItems.indexOf(x)%SECT_COLORS.length], x=>x.sector, x=>x.val, x=>x.cnt+'x');
  const sectorPie = pieChart(sectorItems.slice(0,6).map((x,i)=>({label:x.sector, value:x.val, color:SECT_COLORS[i%SECT_COLORS.length]})));

  // Kayıp analizi
  const lostReasons = {};
  O.filter(o=>LOST.includes(o.stage)).forEach(o=>{ const s=o.stage; lostReasons[s]=(lostReasons[s]||0)+1; });
  const lostPie = pieChart(Object.entries(lostReasons).map(([s,v])=>({label:s,value:v,color:SC[s]||'#94a3b8'})));

  // İdare bazlı dağılım (Kamu/Özel)
  const adminMap = {};
  O.forEach(o=>{ const a=o.sector||'Belirsiz'; if(!adminMap[a]) adminMap[a]={val:0,cnt:0}; adminMap[a].val+=Number(o.value)||0; adminMap[a].cnt++; });
  const ADMIN_COLORS = ['#1d4ed8','#0891b2','#16a34a','#d97706','#7c3aed','#dc2626','#475569','#0f766e'];
  const adminPie = pieChart(
    Object.entries(adminMap).sort((a,b)=>b[1].val-a[1].val).slice(0,5).map(([s,d],i)=>({label:s,value:d.val,color:ADMIN_COLORS[i%ADMIN_COLORS.length]}))
  );

  // Yeni müşteri kazanımı (son 6 ay) — firma isimleriyle
  const months = [];
  for(let i=5;i>=0;i--) { const d=new Date(); d.setMonth(d.getMonth()-i); months.push({label:d.toLocaleString('tr-TR',{month:'short',year:'2-digit'}),year:d.getFullYear(),month:d.getMonth()}); }
  const newCustByMonth = months.map(m=>{
    const firms = C.filter(c=>{ if(!c.createdAt) return false; const d=new Date(c.createdAt); return d.getFullYear()===m.year&&d.getMonth()===m.month; });
    return {label:m.label, cnt:firms.length, firms:firms.map(f=>f.firmName||f.name||'?')};
  });
  const maxCust = Math.max(1,...newCustByMonth.map(x=>x.cnt));

  // Müşteri grafiği — tıklanabilir
  const custChartDiv = h('div',{});
  if(!state.custMonthOpen) state.custMonthOpen = {};
  newCustByMonth.forEach(item=>{
    const pct = item.cnt/maxCust*100;
    const isOpen = !!state.custMonthOpen[item.label];
    const toggleOpen = () => { state.custMonthOpen[item.label] = !isOpen; render(); };
    const firmPanel = isOpen && item.firms.length ? h('div',{style:{background:'#f0f7ff',border:'1px solid #b8d4ec',borderRadius:'10px',padding:'12px 16px',marginTop:'8px'}},
      h('div',{style:{fontWeight:'700',fontSize:'12px',color:'#1e2d4a',marginBottom:'8px'}},'📋 '+item.label+' — Yeni Firmalar ('+item.cnt+'):'),
      h('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px'}},
        ...item.firms.map(f=>h('span',{style:{background:'#dbeafe',color:'#1d4ed8',borderRadius:'7px',padding:'4px 10px',fontSize:'12px',fontWeight:'600'}},f))
      )
    ) : null;
    const bar = h('div',{style:{marginBottom:'8px'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'5px',cursor:item.cnt?'pointer':'default',padding:'8px 10px',borderRadius:'9px',background:isOpen?'#e8f0fb':'transparent'},
        onClick:item.cnt?toggleOpen:null},
        h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
          h('span',{style:{fontSize:'13px',color:'#2563eb'}},item.cnt?'▶':'—'),
          h('span',{style:{fontSize:'13px',color:T1,fontWeight:'600'}},item.label)
        ),
        h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
          item.cnt?h('span',{style:{fontSize:'12px',color:'#2563eb'}},isOpen?'Gizle ▲':'Firmaları Gör ▼'):h('span'),
          h('span',{style:{fontSize:'14px',fontWeight:'800',color:item.cnt?'#2563eb':T4}},item.cnt?item.cnt+' Firma':'0')
        )
      ),
      h('div',{style:{height:'8px',background:'#c8daea',borderRadius:'4px',overflow:'hidden'}},
        h('div',{style:{height:'100%',width:pct+'%',background:'linear-gradient(90deg,#2563eb,#60a5fa)',borderRadius:'4px',transition:'width .4s ease'}})
      ),
      firmPanel||h('span')
    );
    custChartDiv.appendChild(bar);
  });

  return h('div',{style:{animation:'fu .3s ease'}},
    h('div',{style:{marginBottom:'16px'}},
      h('h2',{style:{fontSize:window.innerWidth<=768?'15px':'18px',fontWeight:'800',color:'#1e2d4a'}},window.innerWidth<=768?'🌐 Pazarlama Dashboard':'🌐 Pazarlama / İş Geliştirme Dashboard')
    ),
    mktDateBox,
    kpiGrid,
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',marginBottom:'16px'}},
      card('🏭 Sektör Bazlı Ciro Dağılımı (Bar) — Kazanılan İşler', (()=>{
        const wonMap = {};
        O.filter(o=>o.stage==='KAZANILDI').forEach(o=>{const s=o.sector||'Diğer';if(!wonMap[s])wonMap[s]={val:0,cnt:0};wonMap[s].val+=Number(o.value)||0;wonMap[s].cnt++;});
        const wonItems = Object.entries(wonMap).sort((a,b)=>b[1].val-a[1].val).map(([s,d])=>({sector:s,...d}));
        const maxW = Math.max(1,...wonItems.map(x=>x.val));
        return wonItems.length ? barChart(wonItems, maxW, (x,i)=>SECT_COLORS[wonItems.indexOf(x)%SECT_COLORS.length], x=>x.sector, x=>x.val, x=>x.cnt+'x') : h('div',{style:{color:T3,textAlign:'center',padding:'20px',fontSize:'13px'}},'Henüz kazanılan iş yok.');
      })()),
      card('🥧 Sektör Bazlı Dağılım (Pasta) — Kazanılan İşler', (()=>{
        const wonMap2 = {};
        O.filter(o=>o.stage==='KAZANILDI').forEach(o=>{const s=o.sector||'Diğer';if(!wonMap2[s])wonMap2[s]=0;wonMap2[s]+=Number(o.value)||0;});
        const segs = Object.entries(wonMap2).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([s,v],i)=>({label:s,value:v,color:SECT_COLORS[i%SECT_COLORS.length]}));
        return segs.length ? pieChart(segs) : h('div',{style:{color:T3,textAlign:'center',padding:'20px',fontSize:'13px'}},'Henüz kazanılan iş yok.');
      })())
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',marginBottom:'16px'}},
      card('📉 Kayıp Fırsat Analizi', lostPie),
      card('🏢 Sektör Bazlı Tüm Pipeline Dağılımı', sectorPie)
    ),
    h('div',{},
      card('📅 Aylık Yeni Müşteri Kazanımı (Son 6 Ay)', custChartDiv)
    )
  );
}

function renderDashboard() {
  const cu = state.currentUser;
  if(!state.dashTab) state.dashTab = cu?.isAdmin ? 'admin' : 'sales';
  const tabs = [
    {id:'admin', l:'🏢 Yönetici', admin:true},
    {id:'sales', l:'📈 Satış / Proje', admin:false},
    {id:'marketing', l:'🌐 Pazarlama / İş Geliştirme', admin:false},
  ];
  const isMobDash = window.innerWidth <= 768;
  const tabBar = h('div',{style:{display:'flex',gap:'6px',marginBottom:'16px',flexWrap:'wrap'}});
  tabs.forEach(t=>{
    if(t.admin && !cu?.isAdmin) return;
    const active = state.dashTab===t.id;
    const label = isMobDash && t.id==='marketing' ? '🌐 Pazarlama' : t.l;
    const b = btn(label, ()=>{ state.dashTab=t.id; render(); },
      active?'#1e2d4a':'#ffffff',
      active?'#ffffff':'#4a6080',
      isMobDash?'9px 12px':'10px 18px',
      {fontSize:isMobDash?'12px':'13px',fontWeight:active?'700':'500',border:active?'none':'1px solid #b0c8e0',borderRadius:'10px',boxShadow:active?'0 2px 8px rgba(30,45,74,.2)':'none',flex:isMobDash?'1':'none',textAlign:'center'}
    );
    tabBar.appendChild(b);
  });
  let content;
  if(state.dashTab==='admin') content = cu?.isAdmin ? renderDashboardAdmin() : renderDashboardSales();
  else if(state.dashTab==='sales') content = renderDashboardSales();
  else content = renderDashboardMarketing();
  return h('div',{style:{animation:'fu .3s ease'}},tabBar,content);
}

    );
    container.appendChild(h('div',{style:{marginBottom:'14px'}},
      h('label',{style:{fontWeight:'700',fontSize:'13px',color:'#1e2d4a',display:'block',marginBottom:'6px'}},'📦 Tedarikçi Türü *'),
      typeSelect
    ));

    // Şehir + Telefon
    container.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'14px'}},
      h('div',{},

          onInput:e=>{f.phone=e.target.value;}})

    ));

    // E-posta + Web
    container.appendChild(h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'14px'}},
      h('div',{},
        h('label',{style:{fontWeight:'700',fontSize:'13px',color:'#1e2d4a',display:'block',marginBottom:'6px'}},'✉️ E-posta'),
        h('input',{type:'email',placeholder:'info@firma.com',value:f.email||'',

          onInput:e=>{f.web=e.target.value;}})

  rerender();
  return modal('🏭 '+(isEdit?'Tedarikçi Düzenle':'Yeni Tedarikçi'), container, ()=>setState({modal:null}), '640px');

    filterRow,
    list
  );
}

function buildSupplierModal(item) {

            )

        } else {

              )
            ),
            h('div',{style:{display:'flex',gap:'5px'}},
              btn('✏️',()=>{editSupContactId=ct.id;esc={name:ct.name||'',title:ct.title||'',email:ct.email||'',phone:ct.phone||''};renderContacts();},'#f0fdf4','#15803d','5px 9px',{fontSize:'11px',border:'1px solid #86efac',borderRadius:'6px'}),

    const fPhone=inp('0212 000 00 00',f.phone,v=>f.phone=v);

          addArea

        contactsDiv

      h('div',{style:{display:'flex',gap:'10px'}},
        btn('Kaydet',()=>{if(f.firmName)saveSupplier(f,!!item);},'linear-gradient(135deg,#16a34a,#15803d)','#fff','11px 16px',{flex:'1',fontSize:'14px'}),
        btn('İptal',()=>setState({modal:null}),'#21262d','#8b949e','11px 20px',{fontSize:'14px'})

  }
  return modal(item?'Tedarikçiyi Düzenle':'Yeni Tedarikçi', getEl(), ()=>setState({modal:null}), '680px');
}

// Arama input + Bul butonu helper
function makeSearchInput(val, onChange) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;gap:6px;min-width:220px;flex:0 0 auto;margin-left:auto;order:999';
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = 'Anahtar kelime ara…';
  inp.value = val || '';
  inp.style.cssText = 'flex:1;padding:8px 11px;background:#fff;border:1px solid '+G4+';border-radius:8px;font-size:13px;color:'+T1+';outline:none;font-family:inherit;min-width:150px';
  const b = document.createElement('button');
  b.textContent = 'Bul';
  b.style.cssText = 'padding:8px 15px;background:#f97316;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap';
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') onChange(inp.value); });
  b.addEventListener('click', function(){ onChange(inp.value); });
  // Kutu boşaltılınca (metin silinince) filtre otomatik sıfırlanır — aksi halde
  // Bul/Enter beklediği için eski filtre görünmeye devam ediyordu.
  inp.addEventListener('input', function(){ if(inp.value === '') onChange(''); });
  wrap.appendChild(inp);
  wrap.appendChild(b);
  return wrap;
}

function renderCustomers() {
  const f = state.filters;

    if(f.custName){if(f.custName===EMPTY){if((c.firmName||'').trim())return false;}else if(!(c.firmName||'').toLowerCase().includes(f.custName.toLowerCase()))return false;}
    if(f.custSector){if(f.custSector===EMPTY){if((c.sector||'').trim())return false;}else if(c.sector!==f.custSector)return false;}

// ═══════════════════════════════════════════════════════
// YARDIMCI: KAYDIRMALI TABLO (tüm tablolarda ortak)
// ═══════════════════════════════════════════════════════
function makeScrollTable(thead, tbody, colWidths, isEmpty, emptyMsg) {
  if(!document.getElementById('apro-sc-style')){
    const s=document.createElement('style');s.id='apro-sc-style';
    s.textContent='.apro-no-sb{scrollbar-width:none;-ms-overflow-style:none}.apro-no-sb::-webkit-scrollbar{display:none}';
    document.head.appendChild(s);
  }
  const minW=colWidths.reduce((a,b)=>a+b,0)+'px';
  const outer=document.createElement('div');
  outer.style.cssText='background:#edf5fc;border:1px solid #b0c8e0;border-radius:14px;box-shadow:0 2px 8px rgba(20,40,80,.12);overflow:clip';

  // HEADER — taşma yok, JS ile kaydırılır
  const headWrap=document.createElement('div');
  headWrap.style.cssText='overflow:hidden';
  const hTbl=document.createElement('table');
  hTbl.style.cssText='border-collapse:collapse;min-width:'+minW;
  hTbl.appendChild(thead);
  headWrap.appendChild(hTbl);

  // KAYDIRMA SATIRI: [◀] [şerit] [▶]
  const stripRow=document.createElement('div');
  stripRow.style.cssText='display:flex;align-items:stretch;background:#0ea5e9;border-top:1px solid #38bdf8;border-bottom:1px solid #0284c7';
  const bSt='background:#0284c7;color:#fff;border:none;padding:0 16px;cursor:pointer;font-size:14px;flex-shrink:0;font-family:inherit';
  const btnL=document.createElement('button');
  btnL.textContent='◀';btnL.style.cssText=bSt+';border-right:1px solid #0369a1';
  btnL.onmouseenter=()=>{btnL.style.background='#0369a1';};
  btnL.onmouseleave=()=>{btnL.style.background='#0284c7';};
  const btnR=document.createElement('button');
  btnR.textContent='▶';btnR.style.cssText=bSt+';border-left:1px solid #0369a1';
  btnR.onmouseenter=()=>{btnR.style.background='#0369a1';};
  btnR.onmouseleave=()=>{btnR.style.background='#0284c7';};
  const strip=document.createElement('div');
  strip.style.cssText='overflow-x:auto;overflow-y:hidden;height:22px;flex:1;cursor:ew-resize;background:#0ea5e9';
  const stripInner=document.createElement('div');
  stripInner.style.cssText='min-width:'+minW+';height:1px';
  strip.appendChild(stripInner);
  stripRow.appendChild(btnL);stripRow.appendChild(strip);stripRow.appendChild(btnR);

  // BODY — native scrollbar gizli
  const bodyWrap=document.createElement('div');
  bodyWrap.style.cssText='overflow-x:auto';
  bodyWrap.className='apro-no-sb';
  const bTbl=document.createElement('table');
  bTbl.style.cssText='border-collapse:collapse;min-width:'+minW;
  bTbl.appendChild(tbody);
  bodyWrap.appendChild(bTbl);

  // Senkronizasyon (sonsuz döngü koruması)
  let _s=false;
  function syncAll(v){
    if(_s)return;_s=true;
    const pos=Math.max(0,v);
    headWrap.scrollLeft=pos;bodyWrap.scrollLeft=pos;strip.scrollLeft=pos;
    _s=false;
  }
  btnL.addEventListener('click',()=>syncAll(bodyWrap.scrollLeft-250));
  btnR.addEventListener('click',()=>syncAll(bodyWrap.scrollLeft+250));
  strip.addEventListener('scroll',()=>{if(!_s)syncAll(strip.scrollLeft);});
  bodyWrap.addEventListener('scroll',()=>{if(!_s)syncAll(bodyWrap.scrollLeft);});

  // Sticky tablo başlığı sarmalayıcısı
  const stickyHead=document.createElement('div');
  stickyHead.className='apro-sticky-head';
  stickyHead.style.cssText='position:sticky;top:0;z-index:10;overflow:hidden;border-radius:14px 14px 0 0';
  stickyHead.appendChild(headWrap);
  stickyHead.appendChild(stripRow);
  outer.appendChild(stickyHead);
  outer.appendChild(bodyWrap);
  if(isEmpty){const e=document.createElement('div');e.style.cssText='padding:38px;text-align:center;color:#8ba3b8';e.textContent=emptyMsg;outer.appendChild(e);}

  // Sütun genişliklerini render sonrası ölç ve senkronize et (double-rAF: layout hazır olsun)
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const hRow=hTbl.querySelector('tr');
    if(!hRow)return;
    const hCells=[...hRow.cells];
    const n=hCells.length;
    const colMaxW=colWidths.slice(0,n).map(w=>w||0);
    // Tüm satırları tara (sadece ilk değil)
    [...bTbl.querySelectorAll('tr')].forEach(row=>{
      [...row.cells].forEach((cell,i)=>{if(i<n)colMaxW[i]=Math.max(colMaxW[i],cell.offsetWidth);});
    });
    // Başlık hücrelerine uygula
    hCells.forEach((cell,i)=>{cell.style.width=colMaxW[i]+'px';cell.style.minWidth=colMaxW[i]+'px';});
    // Tüm gövde hücrelerine uygula
    [...bTbl.querySelectorAll('tr')].forEach(row=>{
      [...row.cells].forEach((cell,i)=>{if(i<n){cell.style.width=colMaxW[i]+'px';cell.style.minWidth=colMaxW[i]+'px';}});
    });
    const totalW=colMaxW.reduce((s,w)=>s+w,0);

function clLoadItems(c, sys){
  var prev = {}; (sys.items||[]).forEach(function(it){ prev[it.kod] = {result:it.result, note:it.note}; });
  var base = (c.formType==='bakim') ? clVisitItems(sys) : clItems(c.formType, sys.sysKey, sys.subType||'');
  sys.items = base.map(function(t){
    var p = prev[t.kod] || {};
    return {kod:t.kod, label:t.label, freq:t.freq||'', result:(p.result||''), note:(p.note||'')};
  });
  if(c.formType==='bakim' && sys.visitFreq){ sys.nextDue = clComputeNextDue(c.createdAt||today(), sys.visitFreq); }
}
function clAddSystem(c){
  var used = (c.systems||[]).map(function(s){ return s.sysKey; });

function clSignPad(c, sign, label, canvasId, nameList){
  setTimeout(function(){
    var cv = document.getElementById(canvasId); if(!cv) return;
    var ctx = cv.getContext('2d'); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#0f172a';
    if(sign.dataURL){ var img=new Image(); img.onload=function(){ ctx.drawImage(img,0,0,cv.width,cv.height); }; img.src=sign.dataURL; }
    var drawing=false;
    function pos(e){ var r=cv.getBoundingClientRect(); var t=e.touches&&e.touches[0]; var cx=t?t.clientX:e.clientX; var cy=t?t.clientY:e.clientY; return {x:(cx-r.left)*(cv.width/r.width), y:(cy-r.top)*(cv.height/r.height)}; }
    function start(e){ e.preventDefault(); drawing=true; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
    function move(e){ if(!drawing) return; e.preventDefault(); var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
    function end(){ if(!drawing) return; drawing=false; sign.dataURL=cv.toDataURL('image/png'); if(!sign.at) sign.at=today(); }
    cv.onmousedown=start; cv.onmousemove=move; cv.onmouseup=end; cv.onmouseleave=end;
    cv.ontouchstart=start; cv.ontouchmove=move; cv.ontouchend=end;
  }, 0);

    h('div',{style:{fontWeight:'700',fontSize:'13px',marginBottom:'4px',color:'#334155'}}, label),

}

function buildArizaModal(serviceId){
  const cu=state.currentUser; const isAdmin=!!(cu&&cu.isAdmin); const myName=cu&&cu.displayName;
  const s=(state.services||[]).find(x=>x.id===serviceId);
  if(!s) return modal('Arıza', h('div',{},'Servis kaydı bulunamadı.'), ()=>setState({modal:null}), '640px');
  const st=servExecStage(s), idx=_servStageIndex(st), closed=!!s.execClosedAt;

  const strip=h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'14px'}},
    ...SERVICE_STAGES.map((x,i)=>{
      const meta=SERVICE_STAGE_META[x];

      const bg = state_==='active'?meta.color:(state_==='done'?'#16a34a':'#e8eef7');
      const col = (state_==='active'||state_==='done')?'#fff':'#64748b';
      return h('span',{style:{background:bg,color:col,borderRadius:'20px',padding:'5px 11px',fontSize:'12px',fontWeight:'700'}},
        (state_==='done'?'✓ ':meta.icon+' ')+meta.l);
    })
  );

  const urgSel=sel([{v:'dusuk',l:'Düşük'},{v:'normal',l:'Normal'},{v:'acil',l:'Acil'}], s.execUrgency||'normal', async v=>{
    await personelSaveDoc('services', Object.assign({}, s, {execUrgency:v})); render();
  });
  const tgtInp=h('input',{type:'date',value:s.execTargetDate||'',style:{padding:'7px 10px',border:'1px solid #cbd5e1',borderRadius:'8px',fontSize:'12px'}});
  tgtInp.addEventListener('change',async e=>{ await personelSaveDoc('services', Object.assign({}, s, {execTargetDate:e.target.value})); render(); });
  const metaBar=h('div',{style:{display:'flex',gap:'10px',flexWrap:'wrap',alignItems:'center',marginBottom:'12px'}},
    h('span',{style:{fontSize:'12px',color:T3,fontWeight:'700'}},'Aciliyet:'), urgSel,

  );

  const acts=[];
  if(!closed && idx<SERVICE_STAGES.length-1) acts.push(btn('Sonraki aşama →',async()=>{await servAdvance(s); render();},'#1e3a6e','#fff','8px 14px',{fontSize:'13px'}));
  if(!closed && idx===SERVICE_STAGES.length-1) acts.push(btn('✓ Arızayı kapat',async()=>{await servClose(s); render();},'linear-gradient(135deg,#10b981,#059669)','#fff','8px 14px',{fontSize:'13px'}));
  if(isAdmin && closed) acts.push(btn('↺ Yeniden aç',async()=>{await servReopen(s); render();},'#fef3c7','#92400e','8px 14px',{fontSize:'13px'}));
  if(isAdmin && !closed && idx>0) acts.push(btn('← Geri al',async()=>{await servRollback(s); render();},'#fef3c7','#92400e','8px 14px',{fontSize:'13px'}));
  acts.push(btn('+ Bu aşamaya görev öner',async()=>{await suggestServStageTasks(s, st, {manual:true, silent:true}); render();},'#eef2ff','#4338ca','8px 14px',{fontSize:'13px'}));
  const actBar=h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'14px'}}, ...acts);

  const groups=SERVICE_STAGES.map(x=>{
    const ts=servStageTasks(s, x);
    if(!ts.length) return null;
    return h('div',{style:{marginBottom:'12px'}},
      h('div',{style:{fontWeight:'700',fontSize:'13px',color:SERVICE_STAGE_META[x].color,marginBottom:'6px'}},SERVICE_STAGE_META[x].icon+' '+SERVICE_STAGE_META[x].l),
      ...ts.map(t=>taskCard(t, isAdmin, myName))
    );
  }).filter(Boolean);
  const tasksBox = groups.length? h('div',{}, ...groups)
    : h('div',{style:{padding:'16px',textAlign:'center',color:T4}},'Bu arızaya bağlı görev yok. "Bu aşamaya görev öner" ile başlayın.');

  const cust=(state.customers||[]).find(c=>c.id===s.customerId)||null;
  const closeNote = (closed && s.execCloseNote) ? h('div',{style:{background:'#f0fdf4',border:'1px solid #86efac',borderRadius:'10px',padding:'10px',marginBottom:'12px',fontSize:'12px',color:'#166534'}},'📝 Kapanış notu: '+s.execCloseNote) : h('span');
  const content=h('div',{},
    cust?h('div',{style:{fontSize:'13px',color:T3,marginBottom:'10px'}},'👤 '+(cust.firmName||'')):h('span'),
    strip, metaBar, actBar, closeNote,

  );

  return modal((s.jobName||'Arıza')+' — İcra', content, ()=>setState({modal:null}), '720px');

    const da=(_toISO(a.apptDate)||'')+(a.apptTime||'');
